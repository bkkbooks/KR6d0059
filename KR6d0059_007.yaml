body:
  text: 壽量品玄義今疏具足此品明三種如來三種壽量故云壽量品今依金光明經略以十五門釋三身義初列次第門謂化應法與此經及法華論同也此是從末至本以為次第從本至末其義易知二為緣門為三緣故立於三身雜為衆生説種種法現種種身名為化身但為菩薩説一味法現於一身謂奇特相好以為應身纍無不盡德無不具唯以如如及如如智以為法身三權實門明前二身是願力起假名非實法身是實唯有如如及如如智故雖合用如如及如如智為法身如如是自利如如智是利他正與法華佛眼見六道相應謂如如智見六道見無所見即如如無所見而見謂如如智四感應門如如與如如智無有分別而能現應身及以化身喻如日月無分別水鏡無分別日月光無分別三事無分別而有顯現一如如二如如智三願自在因衆生感故得有應化兩身影五約涅槃論三身門依應化二身不住涅槃以二身念念滅數數出現故不住涅槃法身不住般涅槃般涅槃者入涅槃也法身既常不入滅也次明三涅槃義二身是有餘涅槃以二身非究竟故也法身是無餘涅槃以法身是究竟故也三身合論是無住處涅槃法身不住生死二身不住涅槃名無住處也六三相門為凡夫有三相故一凡夫有思惟分別相二有依他相三有成就相故不得三身佛能解分別相滅依他相淨成就相故有三身此意應是攝論三無性理是法身七滅三心門凡夫有三心一起事心二依根本心三根本心初是六識次是陀那後是本識依伏道起事心滅依法斷道依根本心滅依勝拔道根本心滅起事心滅得顯化身依根本心滅得起應身根本心滅得顯法身此初伏六識次斷陀那後除本識八三同門化身與佛同事唯應身與佛同意法身與佛同體同事者利物也同意者明一味法化菩薩也同體者如如智與如如境一體故云同體九有三意門初依衆生意有多故現多身次依菩薩意一故現一身次明法身絶相非一非多十依無依門化身依應身應身依法身法身別無依十一常無常門化身常説法化緣故名為常而用未具足故名無常應身亦常化緣故常而用具足異於化身但非本故名無常而法身則常十二治三鄣門煩惱鄣淨能現應身業鄣淨能現身化智鄣淨能現法身此明前斷四住斷四住故業壞更進斷智鄣也十三三淨門明性照清淨攝受法身智慧清淨攝受應身三昧清淨攝受化身十四二無所有門經云法身二無所有謂相及相處二無所有即攝論云相識見識相識是識相是前塵見是能識法身無此二也十五料簡門有四句料簡一化身非應身謂入涅槃後以願力故現身此是現種種身二應身非化身謂地前身此但化佛身三亦應亦化身住有餘涅槃現如來身具作二身四俱非謂法身也此是經文亦須知之此品亦有二章一勸信二正説勸信者凡有三重體用一法身常為體應化無常為用二常無常皆用中道為體三四句皆用不四為體四宗五時無此三重半滿二藏有初重意既無有二前一義亦不成問何經論作此説答華嚴云一切有無法了達非有無若能如是解則見真實佛楞伽第七卷常無常品偈云離於常無常非常非無常若見如是佛彼不墮惡道中論云如來寂滅相寂滅相中無常無常等四以此言難信故佛勸信也釋祕密神通力此標品大意也從過去初證法身盡未來際請謂時長也遍于法界謂化廣也時長化廣不可思議昔所未説謂祕密神通又如過去之始盡未來之終如此長時即是一念雖復一念而長時宛然故華嚴云無量劫一念一念無量劫元來無積聚而現諸劫事謂甚深祕密也又雖遍遊十方而不動足肇公云應愈動神愈寂故為甚深也餘如本疏釋一切世間天人此文來二意一牒執情即凡夫二乘假名菩薩不出三善道攝二牒彌勒新疑處正謂伽耶始成故作父少子老之疑今將斷疑故敘疑處也釋久成佛此品明證法身久即顯法身無始終義略有四意一用四悉檀義四十餘年執佛實有生滅始終是故為病今對治始終病故説無始終此是對治悉檀昔説始終今説無始終各各為人悉檀説始終無始終皆隨俗語耳謂世界悉檀非始終非無始終即第一義悉檀二者明具足滿義非始終非無始終始終無始終具足方是滿字昔但明始終今但明無始終及但明非始終無始終皆非具足三者始終無始終二邊不相離義然法身未曾始終無始終而始終無始終雙遊以常有今昔兩緣故常有二教但昔一邊獨遊今方具足故下云或時為此衆説佛壽無量久乃見佛者為説佛難值四者明權實義以始終為權無始終為實此是一往之言具足四重上來已辨次明化身之迹即是法身義大乘學者聞法身自謂法身不得是化身化身不得是法身今明即此化無所化故化即法身法身四絶化滿十方故法身即是化雖滿十方常是四絶故化即法身故涅槃云吾今此身即是法身也問二乘人不見法身及應身得見化身不答他云見今明不爾此是不動而化滿十方雖滿十方常是四絶二乘實不見此化又二乘人謂丈六是實身不知是化身故二乘人不見三身是不見佛人也以不見佛豈聞法乎二乘昔非但不聞一乘亦不聞三乘以不識三是一故也次簡化身無生義若不二二即以無生滅生滅為化生滅法二不二義亦化生滅即無生滅也問就化身有無生滅不答亦有如來是不生生故非是生故生如世諦非實生真無假生法身無假生化身無實生次釋我成佛復過此數至阿僧祗劫上明世界不可數末世界為塵塵不可數成佛復過此無量劫劫不可數須明如此久遠者非但明久已成佛即寄此明法身無有始終義如肇公云隨之不得其蹤迎之罔眺其首即法身無始終義也法身既無始報身亦無始以行因報得名報身故名為報法身既無始還得無始報應身亦爾與法身相應名相應身無始應身亦然法身絶四句超百非應身亦爾問法身因云何答他云修萬行感得法身今明法身果絶四句超百非亦還修絶四句超百非因方得法身果問若爾不行布施等萬行耶答安樂行品明菩薩行處正以虗實並冥緣觀俱寂以此心行此施等此則法身因萬事例然釋於是中間上明兩實今開二權兩實者一證法身久二垂應久今開二權者一過去因權二開現在果權二實攝實盡二權攝權周二權中各有二皆初略後廣即解之方也燃燈佛明過去一方便事即是因方便也若有衆生下第二廣開過去方便此文來有三初上明因方便今明過去果方便因果總攝一切二者上明過去化物今辨化物儀則三者上略説今廣説此中有三謂感應益也應中三輪初他心輪法身遍照而無所照如波若無知而無所不知處處説名字者如華嚴名號海雖號遍十方而無一稱年紀大小者遍示短長而未曾有近遠亦復現言入涅槃者上明存不為有今亡不為無問何故常作此語答總標祕藏甚深之事故不同人之常情也釋皆為度脫衆生夫既諸佛説經菩薩造論但為令衆生度苦海脫苦因智度論呵五百部云各執諸法有決定相不知佛意為解脫故或説己身下出度脫之方前度脫之意即他心輪今明解脫之方謂神通輪説法輪己身他身者化主也己事他事者教門也如娑婆世界以音聲為佛事無言國土以寂漠入道也皆實不虗下此文望前望後各有二義望前有二義者一者遠釋三身伽耶得道化身也久已成佛報身也今明十不辨法身也此從末至本以為次第昔為二乘故示化身對化身故辨報身由報身得法身故舉法身釋成報化二身二者今文明佛性見佛性故方有法身及以報化故舉佛性釋成三身望後二義者一不虗二得失不虗有二一內證法身故外用不虗二令物得實益故不虗今總標二不虗章門所以者何不釋二不虗門即前釋內證不虗即是辨得而文中明三界即是十不者恐衆生謂法身超百非絶四句在於身外則起衆生法身高下二見又於物無益故今明三界即是十不也肇公云道遠乎哉觸事而真聖遠乎哉體之則神豈非妙達三界即是四絶法身無有生死者可具二義一者法身無虗妄生死即空無諸纍義二者四生不能生法身二死不能化其體故云無有生死若退若出者明非隱顯義惑不能隱故不退約緣悟言顯體非新起故言不出亦無在世及滅度者即王宮非生雙林非滅此句與華嚴同故彼文云欲令衆生生歡喜現王宮生欲令衆生生戀慕善示雙林滅法身實不出世亦不涅槃此句破執無常及䨱相常也非實非虗者智度論師用實相為佛成實論師用世諦虗假為佛今並異之故俱非也非如非異者江南尚禪師用真如為佛攝論師亦然謂佛出二諦外者謂佛異於真如真如是妙無佛果是妙有今並非之總而言之超百非絶四句七辨不能説三眼不能照又形不可見者法身絶相也不如三界見於三界者凡夫不知三界常絶四句故四絶於凡夫成三界故成如來藏如來藏者即如來胎有所得人聞三界䨱佛性言即佛性在三界中成壁中有柱乃優樓迦義今明四絶於緣成三界雖覆實無所藏佛則知三界宛然常絶四句雖復四絶於緣宛然三界故凡夫見聖不見不見聖所見聖見凡不見復見凡所見問曰聖見凡不見聖可得異凡夫聖見凡所見聖與凡何異答曰聖雖見凡迷不如迷所見以凡見三界名為三故三聖見三界者此是不三三中論云語言雖同其心則異華嚴云隨順衆生故普入諸世間智慧常寂然不同世所見以諸衆生有種種欲者第二明益物不虗即是辨失上見三界而常四絶今見雖復四絶於緣宛然三界即是失佛性故成六道紛然也以種種因緣所作佛事者欲令衆生知三界宛然常是四絶故示應化兩身淨穢二教常不絶也即是益物不虗也亦即是欲令衆生見佛性故常作不絶如是我成佛來至常住不滅者上顯二實開兩權斷新疑破舊執今第三方得結成常住不滅曰五時者惡聞此經常住之字若言此經明常即破義宗喪失名利故作百種釋之今明三身俱常法身常住故不得言應化兩身常化大小兩緣不絶亦名為常又即應化亦常以不動而應十方現前雖十方現前常自不動故應化是常問云何示其相答應化是因緣因緣即寂滅故中觀論如來品云寂滅是如來故知應化即是法身故名為常釋我本行菩薩道此文舉長因以證長果法華論云本願未滿所得壽命復倍上數本願未滿者可有二意一顯壽長所以爾者本願度一切衆生令盡成佛衆生若盡佛壽乃盡衆生未盡佛壽則無盡顯常壽義常有法身壽故常起應化度衆生滿本願也問俗書尚知忘內外一死生佛法豈欣長齡而忘促壽答今為度衆生故語其常壽耳豈復存長短乎地論十盡句亦作此説衆生若盡我願乃盡等二破小乘人明佛義故有此文小乘謂本願度一切衆生而衆生未盡佛已入無餘也此是圓誓佛也又初欲普度即初心為勝後入無餘即後果翻劣大乘佛無斯二過也所成壽命復倍上數者釋滿本願也以滿本願常度衆生故壽命常住而言倍者上直云過去不可知而終有初心後證則是有始今明一證已後湛然無滅故復倍然應法二身具有二義一者法身本有無始終義於緣故有始始若起顛倒見即生死之終如其了悟故是生死之終如法身之始而應身始無始者約應始與法身相應故名為始而法身無始應身與無始相應法身既無始故應身亦無始問何故不分明辨常而言復倍上數耶答如今所解復倍上數勝直辨常住若直明常而不覺其長上已明三不可知一世界不可知二末為塵不可知三久成佛不可知今云復倍則絶一切思議境界即彌覺其長使惡短者欣此長齡故有勝常矣又勝者凡有二一者新成佛始終證常今明釋迦久已證常非止今也法皆如是者三世佛法不滅示滅令物得實益以得實益故非虗妄釋良醫喻中初開十喻二攝十為六三收六為三次攝三為二次攝二為一次泯一歸無句而句數滿十方十喻者一良醫有子喻二父去子病喻三父子相見喻四請治授藥喻五正子服藥喻六狂子憚藥喻七父醫示滅喻八狂子醒悟喻九父醫還家喻十父無虗妄喻次就文明攝十為六時一父醫養子時二父去子病時三父還救子時四不滅示滅時五父醫還家時六無有虗妄時次攝六為三即三世益物一從本成道至釋迦未出世謂過去未出時從是時其父還來歸家第二釋迦現在益物時是時其父還來歸家咸使見之第三未來益物時次攝三為二雖有三世不出無生滅示生滅二種化物如父醫去雖復去留不出留存亡利子次攝二歸一令悟生滅無生滅一法身故攝二歸一也次一句歸無句者若有生滅二可有不生滅不二既無生滅二云何有不二乃至亦二不二非二不二耶故舒之彌綸三世卷之無有蹤迹雖無蹤迹而常滿十方雖化滿十方竟未曾開卷無蹤迹亦未曾合問曰何故作此釋耶答曰佛將答彌勒前誡大衆令聽甚深祕密神通之力此實難思前約父子合有十喻次就子有六時一初有父時二父去感患時三見父請救時四正子服藥患差時五狂子憚藥不服時六服藥醒悟見父時也次收六為三即三根初有父時是上根次服藥病愈謂中根醒悟見父謂下根次攝三歸二雖有三根不出迷悟如雖有三子唯有病與無病也次收二歸一返迷成悟故無迷有悟次泯一歸無既其無迷亦無悟故非迷非悟非佛非衆生如是五句也然未得斯悟即六道紛然今得此悟泯無蹤迹然六道紛然時即是泯無蹤迹泯無蹤迹時衆生不減佛界不增六道紛然時衆生不增佛界不減也須深照此意也釋良醫有二一欲開方便義二欲息方便義開方便者實未曾佛不佛而作佛者為欲度衆生故如為治病故立醫師二息方便者病若除醫即廢衆生若悟即佛亦忘故華嚴云為度衆生故有佛有世界若於真實中無佛無世界若除妄而存真無衆生有佛此無薪有火義良醫者餘醫但用藥治病不能用醫治病今具此二故名良用醫治病如父示死子得悟佛具此二故名良多諸子息下第一良醫有子喻遍十方窮三世皆是病子欲父明醫盡未來際常住不滅遍治法界子病故云多也若十二十百數者從初得佛至今一期出世成佛略為三根從初成佛竟未出世之前所化得者為上根即千世界菩薩之流也從華嚴會竟法華化得悟者為中根所以齊此為中根明根本枝末攝末歸本一期事盡所應悟者皆已悟竟故為中根從歷開三輪不悟即狂子憚藥竟唱滅乃至涅槃已後像正中得道為下根亦從此已後盡未來際得悟悉屬下根此亦是不思議事也者佛去世後若無佛法世界受五欲及外道邪教為毒藥生愛見為得病若佛去世於像正中值有所得大乘師有所得法即是毒藥生有所得名無得病飲他毒藥下第二父去子病喻佛去世後無佛世則受五欲及外道邪教為他毒藥生愛見為得病感心苦為悶亂感身苦為宛轉又一惑具二力迷中道鄣正觀為悶亂受生死苦報為宛轉也是時其父下第三父子相見喻初父見子次子見父是佛出世衆生見佛形也問曰云何為遙見答曰他云去理遠為遙今明是近義亦見即喜故云遙見問曰上明飲毒起愛見是煩惱鄣佛云何感佛答曰如見窮子中釋內三力一有佛性正因二既有良醫之子有菩提心緣因因不滅三法種衆苦樂求涅槃外三力隨逐化中有他心説法現通也問曰云何為失本心不失本心答曰為取本解不現前即二子俱失今就機中強弱論之顛倒強菩提心弱者為失反之為不失我等下第四請治授藥喻初請治也父見子下授藥也其諸子中第五正子病除喻餘失心者下第六狂子憚藥喻父作是念下第七父醫示滅喻説三輪竟更無藥治之唯當示滅又作生不能救為子示死救之明大悲深莫復過也問至涅槃時説涅槃教云何言無教能治之答曰終説涅槃時事是死也又要須示滅方乃説教故以示滅為正問曰遣幾使耶答曰釋迦全碎二舍利為兩使也是時諸子下第八狂子醒悟喻是時其父第九父醫還家喻於意云何下第十不虗妄喻次偈頌有二過去無始與未來無終也但頌過去則略未來便偈廣者夫論常義要在未來滅與不滅不在過去久與近故廣頌不滅廣破無常廣論常義二章各兩初章二者一頌證法身久二頌垂應久億載阿僧祇者振旦之數極謂載即地所不能載也阿僧祇天竺之數謂不可説舉二數不能數者欲明佛壽出數量之表即常義也為度衆生故下頌未來不滅亦二初釋疑二不虗各三初三者初正果釋疑二依果釋疑三雙結依正不虗中三者謂法譬合也然釋疑中雖有三段但鉤鎖相接次第凡釋十疑第一疑云既證法身久則可不滅何故唱滅是故釋云為度物故言滅實不滅也第二疑云若常住此土不滅何故不常見耶故釋云雖常住此以神通力令近而不見第三疑云令不見有何利耶故釋云以不見故得種佛善根第四疑云種善根復有何利故釋云則見從靈山出事第五疑云若佛出者當知前滅今復更生則是生滅何名常耶故釋云我實不生滅為度物故示生滅第六疑云云何為物示生滅耶故釋云此土不見為滅彼土見為生故是示現生滅第七疑云佛幾處幾時作此方便故釋云阿僧祇劫及一切處第八疑云若在靈山則靈山可不被燒故釋云穢土被燒淨土不被燒第九疑云若淨土不毀穢土被燒何物衆生見淨見穢耶故釋云罪障衆生見穢不見淨直心者見淨不見穢第十疑云淨穢出二緣者佛壽復云何耶故釋云為穢緣説短為淨緣説長論淨穢土義問曰云何是法身土答曰世間聞佛住大涅槃則不疑住土則疑此是異名也諸佛所乘故名乘至人所栖稱土普賢觀經云法身住常寂光土問曰土與身何異答曰法身有能照所照義分境智有能證所證義分人土問曰經明唯有自性清淨心顯名法身此外並是虗妄云何分人土智度亦云除實相外皆是魔實相即法身云何有人土耶答攝論師云法身是真如更無有土蓋是未精見論意耳今此淨心及真如在煩惱中不為煩惱壞亦不可變異故名如取照用名智智非但知非如亦知於如既有能知所知何無能住所住故有人土也分別功德品從此以去第二明流通即是辨因前五章中各有二合十章今亦五章章各有二亦十章也言五章者一辨聞經得益二感諸靈瑞三彌勒稱嘆四格量勸信五總論持經功德初章又二一總明功德佛告下第二別明功德説餘經得道人少説此經明得道多者此經具開一切權實略有五種如上明之問曰何故壽量品後明得道者多答曰上來但開釋迦一期近事今明過去之始未來之終謂時長明遍法界化謂明化廣則釋迦始終事盡應得道者悉皆取悟論生數有三家一者江南法華師云初六位界內得道次八生已上五位界外七地去得道今明不然此經前後明轉不退轉皆在八地云何乃言六地二者天親論八生得菩提者謂地前人八遍受分段生得入初地菩提也此既是論文置而不辨今從多為論三義不似此釋一依此經文從初得無生至一生此是轉增明義初明得無生論文已判屬初地今八生還復屬初地乃是後淺於前一不可也二者文次第各有所得初得無生次得不退轉八生乃至云得菩提不應是初地又下偈中分明云成佛成一切智亦非初地也又舉塵數從多至少所以然者為表從淺至深也淺悟易故多深悟難故少若爾八生云何乃劣上來諸位耶二不可也三依淨名經云一生得菩提乃是十地經一生得佛菩提三不可也三者龍樹云三生菩薩一生菩薩皆辨得佛菩提從多論門宜用八生已上明得佛菩提就文有三位得道一八世界衆生發心地前得益二從得無生六位十地得益三從八生已上就十地中得佛開為五品謂下中上上中上上問曰十地中云何五品受生答曰攝論云金剛心一念是無有生死十地是有有生死則十地多過受生死何故無五品又二生死義即變易中論其五品若不許五品何故有三生一生菩薩耶問曰一生三生是應生何以為例答曰今寄應生以顯變易中大位判時節作五品故云五生耳問曰十地已上何故作生論之答曰地位但十也不可作餘位明之故但説八生一生得成佛也問曰八生一生幾許時答曰不可知瓔珞經明無垢地菩薩學佛威儀凡經千劫無垢地即十地人佛説是時下第二明感瑞相亦二初明感瑞所由時虗空中下正明感瑞彌勒領解中亦二初長行次偈頌格量勸信中亦二初長行次偈頌總明功德中亦二初略明功德二廣明功德略明中二初佛在世三品功德次佛滅後四品功德問曰上明八十萬億那由他劫行五度不及一念信壽量今云何持經人福即是起塔寺耶答曰此中歎持經人有二種功德一嘆持經人即極敬謂頂載如來二極供養供養者凡有二時供養一佛滅後起於高塔長時供養舍利二造栴檀寺現前供養佛僧此二供養稱順佛心持經人亦稱順佛心取此義邊故云持經人即是造寺起塔供養又上明五度是有所得故不及信壽量今明起塔寺是無所得心故與持經福等何以得知既稱持經人即是起塔寺持經既是無所得起塔寺亦然也隨喜品昔四十餘年執五權迷五實今開五權顯五實多逆耳違心不能隨喜故建首論隨喜有四重隨喜五種權實也所以頓得如斯功德也四重者如上數辨要具二慧隨喜方成聞三是方便一是真實次聞無生滅身是真實生滅身是方便次聞始終壽是方便無始終是真實淨穢兩土是方便非淨穢土是真實次調達惡是方便善是真實謂順五種權實而生隨喜名初重隨喜今略辨之有四重隨喜一者三乘為權一乘為實生滅身權無生滅身實淨穢土權非淨穢實始終壽權無始終實提婆達多惡權善實於五權實而生歡喜名初重隨喜二者借一除三若除三捨一三一並權不三一實身壽土等權實亦爾三者三一為二非三一為不二二不二權非二不二實餘三種例爾四者二不二非二不二方言極此蓋是無言言皆是方便因無言言悟言無言乃是究竟無餘極説於此四重而生歡喜名為隨喜今明隨喜其義大難但有波若不成隨喜但用方便亦不成隨喜要具二慧隨喜方成知能所宛然本來寂滅名方便波若雖本來寂滅而能所宛然名波若方便也問此隨喜何故勝於財法兩施答財法兩施不及初重隨喜初重隨喜已明作佛財法兩施但是世間二乘善根也又四重隨喜即是理內財法兩施是理外也又四重隨喜具佛四智一一重中皆具四智故隨喜之人即生四智是初心佛也如華嚴云初發心時便成正覺故以自隨喜生四智故自作佛又教化隨喜令他生四智化他作佛故功德勝財法兩施自他俱不生四智並不成佛故劣也問此隨喜何故勝財法兩施答財法兩施未乃無所得隨喜明作佛財寶有得是世間法故財法兩施皆不成佛故劣釋長行偈頌五人次第長行明五人者為答彌勒問及令執昔五乘人生於信心故初明隨喜第二舉心動出來聽第三先來聽竟後人來容之坐存前二自來第三味他人來第四一心聽人及一心説人亦前四是聽人後是説人偈頌五人即頌隨喜二人即二也頌餘四人亦四但不次第初前頌第四人者初隨喜轉教人是口業第四人亦口業故一類頌之餘二人同是身業故一類頌之二口業中初人為他説次人勸他聽故分二也二身業中初人自來聽次人容他坐故分二人也問曰五人五一人五答曰具也一人五者初來次容他坐三勸他來四一心聽五聽已還歸為他説一人具得此五功德也問曰何故格量最初人勝最後人答曰最後人功德已無邊況最初人今欲嘆隨喜功德深令人信此經故作優劣説又親聞與傳聞無定今欲令人親到法坐復生動出之善故説親聞為勝問曰乘天宮等何以知明動出果耶答曰動是而來故得乘天宮之報因果相似後文皆爾也法師功德品釋告常精進有二義一令菩薩勤遮凡夫二乘有所得心不令入二勤習無所得中道觀具此二勤得六根淨也昔來恆約十善釋六千功德今更示功德之因讀誦者須依四智如讀是因緣義要因牙舌方得讀經即是因緣因緣所生法即寂滅相若識此一句四智即生了因緣讀經本來寂滅即生如來智雖本寂滅而讀經宛然即生佛智此觀明了無礙任運智生讀無所讀無所讀而讀即自然智行者不復須師恆得現前智謂無師智也讀經既具四智即破除二障得度五百由旬知讀本寂滅而讀經宛然即生如來智破凡夫有見雖本寂滅而讀經宛然即生佛智破二乘空見既破除凡夫二乘有無二見亦破五住煩惱以五種法師具足四智即意根淨故餘五根亦淨也一一根中無凡夫二乘有所得煩惱是故六根清淨也次約六根用辨功德果亦不同二乘凡夫今更引三文作之一淨名經明阿那律得天眼見大千世界淨名問云為作相而見無作相見作相見者作能見所見相而見為不作能見所見相若作相見則同外道若不作相則墮無為不應有見故失對當時受屈於二難次梵天問世就有真天眼者不答有也即佛世尊悉見諸佛土不以二相見二相宛然無所見雖見無所見而無所不見即是四智以見無所見故不同外道破凡夫有見無所見而見破那律空見故知眼見破二惑也次簡凡夫二乘六根用義菩薩讀經時知讀本來寂滅雖知寂滅常讀經觀心轉利即得二智無礙二智無礙故六根無礙故於一根得六根用是則行無礙因得無礙果也而諸小乘經論三根合中知三根離中知者此是説凡夫二乘有所得鄣礙因果耳次簡凡夫所見異於菩薩凡夫見千世界二乘見大千界菩薩亦見大千界凡夫二乘未得四智觀但見其麁未見其細亦不見無色界色不知上界有香菩薩讀妙經得妙觀明徹故粗細皆見聞耳問若讀經時即生四智破五住度五百由旬與佛何異又地前菩薩何未得法性身耶答菩薩已破其粗未破其細故與佛不同也佛悟因緣六本來無六前悟無六究然六窮四智邊竟五住惑傾得三身之用悟六本來無六故得法身無六為衆生故現六有應化兩身無六而有妙六故有大小相好於淨土成佛即是應身故金光明説應身亦有相好也無六身同衆生相好於穢土中為化佛然六無六既窮實相邊竟無六而六盡因緣之原故眼徹見十方故與菩薩異也讀經既生四智破五住惑餘四亦爾乃至菩薩三業四儀皆因緣則常生四智念念入佛知見淨名説二慧為父母始行之子不得暫離父母離父母即破正觀法身大品説二慧為健兒人健兒人扶持老病百八煩惱為病六十二見為老必常須用二慧扶持至佛度五百由旬也釋六根果初眼耳直明能遠見聞事與二乘略同鼻根全異外道二乘無鼻通而菩薩有之二者外道二乘鼻不能遍聞菩薩能聞三外道二乘不能知上界微細香菩薩能知也此三根果歎菩薩能知他用又直明菩薩自用也舌根具二義一感自報謂上味好聲等二能利他用此中明八果一上味果以菩薩淨心為因緣感得上味果若以舌根下二得好聲果能入其心下三明巧説果又諸天子下四明得眷屬果眷屬果中前明幽衆又諸比丘下明顯衆以是菩薩下五明供養果又諸聲聞下六衆聖樂見果是人所在方面下七諸佛護念果又能下八出法音果上明下順衆生音今出上弘道音又持經是大福慧人發言説法時言音之中出於通氣令人聞之自然發道心攝山師即是其人余親聞説如此也釋意根中雖有六根不出三業四根屬身業用舌根口用今是意用又上五根正就神通門意根中明説法用長行明四果一法無礙果通達下明知義無礙解是義下明辭無礙三千下明知機説樂説無礙偈文有四初頌得四無礙義果即四也十方無數佛第二得總持果悉知諸法相下第三得經旨趣果此人有所説下第四時無所畏果要須此四生起可知也常不輕品此品重示菩薩破病顯道之方前密後顯前密有三雙意一往身禮口嘆顯一乘破三執二身禮以開正因口嘆以辨緣因三身禮稱深敬明望理衆生本是佛口歎明理雖是於衆生恆非既是常佛也衆生是佛用如來智於衆生恆非用於佛智故身禮口嘆有三雙之義此時宜中須作此方便也惡人罵菩薩無智者彼謂佛説菩薩作佛二乘不作佛是有智今忽言皆作佛謂不解大小乘故是無智也虗妄記者不作佛既實説作佛則虗也常不輕得十果八果如本疏復有能説法果從得常眼根淨已後更值佛此得二地乃至十地果後方成佛也大饒益諸菩薩者常不輕得三報益初宿罪除六根淨得現益次命終得值佛生報益次更命終登地至佛皆後報益問曰常不輕但身禮口嘆云何得宿罪除及六根淨益耶答曰此菩薩常作無所得觀故虗妄稍滅故六根淨也今無緣大悲還欲令衆生得六根淨故往禮歎之令習觀行滅凡夫二乘見同菩薩根也問佛説住古因緣於今何益耶答於緣有三益現報執除生報滅苦果後報於菩薩不退也如來神力品此品有四意一證上五權實不虗又總證持經必得三品功德不虗故出舌相也二欲令上聞法華人心生歡喜轉加精進求於佛道聞此經皆發佛心今見佛有如斯神力故大歡喜轉加勤行故下云為求佛道者現如是神力也三欲更歎持經有七種功德令物持經故現神力四欲顯經功德諸佛有大神力纍劫長時説持經福不盡故知歎所不能歎也何以知之初明乘權實中三根聲聞及聞一偈一念隨喜皆授記即穢土人得益次開三權實十二種淨土中人得益今欲為十方窮虗空一切淨穢土衆生説法華經悉令得益故更現神力也故分經有三會一穢土會二淨土會三通淨穢土會也又知別是會説一法者如智度論初現七種瑞召集有緣佛自説般若利益竟次舌相品更出舌相光明召集於須菩提等有緣之徒故復現瑞今亦爾上來現瑞利淨穢緣竟今三世佛共利十方有緣衆生故共現神力及説法華也千世界塵數菩薩自誓持經有二意初正自誓持經次釋自持經前化他後自行雖言自行意在化他真淨大法者五實為真開五權無復隱䨱為淨具攝權實為大千世界塵數菩薩來意有二別弘別利二總弘總利別弘者開身壽權實皆由彌勒別利者十二蒙益也並由其人也總弘者分身滅後總弘斯教利益群生又由其人立誓如來現五神力普為十方説教謂總弘也總利者十方同聞隨喜供養皆當成佛也佛現神力亦二初長行次偈頌長行二初現神力次歎教勸修現神力中兩感兩應初應中現五神力為三初出舌放光為色瑞次彈指下明聲瑞次動地瑞如疏出舌二意一成前未信者令信已信者逾明二令十方及未來生信也放光亦二一為令十方通同使彼此相見二示佛神德難思令求佛道也出聲亦二一覺悟十方令知説法華二者表轉道聲於二世動地亦二一驚悟二世令知説法華二表二世成佛問曰何以故釋分身放光現舌多寶默無所為答曰大聖動靜應機前為顯常所為而言今明寂絶是故致默應化是迹故有形聲故放色現舌多寶示本無言像故默無所為即令十方同悟三身權實空中聲告者前是身權實今演教令異方同聞虗空天有二事一勸隨喜以生慧二勸供養以生福下還受此二勸既於法華生福慧即並至佛果也變成大帳表法身果遍䨱衆生十方通達無礙者十方聞經皆成佛故偈中有二初明現瑞意初偈文是也次別明現瑞意分五瑞為二初為現在衆生現舌放光即令生信及見此土次三瑞為未來者前二是聲以聲教傳流十方故未來得聞地六動者未來聞經故六道成佛然五瑞皆通二世約義便故佛作此分之嘆持經人見二佛者準法報化也祕要法不久當得者即五權實也因緣次第者因緣即經旨趣門次第者如三輪前為菩薩説根本中為二乘説枝末後明攝末歸本也囑纍品前住三土説法並利現在今欲益未來故付諸菩薩又三會於佛有緣者皆以得悟今為菩薩有因緣付之宣通故以付囑又令諸菩薩滿本願又令菩薩進行成佛故付囑也初從法坐起者有三意一欲以手周遍摩十方菩薩頂在塔內不得現此事故諸下起出塔二欲以數尺之手遍摩十方菩薩頂現此奇特普令十方見之故出塔三欲顯説果分經竟還歸本座也釋付囑意若有慳無慈不得施法故明無慳有慈也若有怖畏不能施法故明無畏此經宗明慧故辨智佛雖萬德智為其宗又群生唯有心心外無法若妄心息唯有真智故但明智餘深法者即三乘中大乘小乘人聞此大乘謂是菩薩法二乘自謂究竟故信三中大也問曰若爾説此大乘於二乘何益答曰此大乘中有二教一付財密化二陶練小心可得入佛慧方便諸菩薩又一切乘有三謂小大一説小但增其執無得佛理説大即得毀小嘆大有遠得佛義歡喜者本願於十方弘道利人今命之稱本願故喜又菩薩自欲進行作佛今見佛勸稱本心故喜釋散座三佛集者欲開三身土壽利物今弘道化人竟各令還也多寶閇塔分身還本土者將分身對釋迦以辨去留欲顯釋迦化身住穢土利人應身往淨國化物多寶閇塔欲表法身在空不在淨穢利人問曰何故見分身來而不覩去答曰欲明無去來故見其去來故去無所去又示迹故不來而來顯本故去無所去即是法身問曰多寶表法身不滅即通為二佛之本何故偏住釋迦穢土答曰淨土菩薩中無執迹無常迷本常住故不須住淨土穢土中凡夫二乘假名菩薩執迹迷本故須住穢土問曰多寶照其不滅分身顯丈六非真去則俱去何故一去一留答曰丈六非真其義易信故分身還土法身常住其言難明乃至涅槃猶執無常故多寶猶停用斥之耳若就事中者多寶為聽經故來説果雖竟未説因故多寶住也又分身本為開塔來今塔已還閇宜各還本土耳又多寶與妙音等有重因緣故下經云命妙音來故猶停也分身無此因緣所以去矣問曰分身既去淨土應隱何不明之答曰示適緣精粗故前明其變顯理無垢淨改後無所改問曰佛何故喜耶答曰三佛土三會及未來衆生聞經得益又辨盡理法暢佛心故喜大衆喜者一聞三會五種權實並皆領悟故喜二重覩諸佛去留之義於三身三土解心明決故喜也此經名祕密教多據事相以顯深理難信難解事顯於斯也藥王品此下六品第二分明菩薩乘問曰菩薩乘為因佛乘為果何先果後因答曰有二義一有佛昔説三乘今欲開乘權實二乘果是方便佛果是真實故得會三歸一及破二顯一是以先要須明果竟方得明因二者此經結會釋迦一化始終五權實以衆生正與佛結因緣來久令一期得悟故先辨佛法也又十二門論釋大乘亦前明諸佛所乘後明菩薩因中大人所乘故名大乘所以先就佛後約菩薩者大名唯在佛果不在因但因人求大從所求立名故名大人此經明果既聞説大果方後求大故後辨因此説門次第今此中後欲辨諸菩薩弘果乘經義後明菩薩乘也果分六會今亦六會即六品果也分四權實今亦四初二上弘佛道次兩品下利益衆生第三勸善知識降伏邪人四勸發護正法又上三會亦三初二明一乘體觀音從體起用後三攝用歸體至京師見天竺僧云囑纍之後明陀羅尼品而羅什以藥王在初者六意一明宣道所寄故法師品云因藥王告八萬大士二娑婆重緣故問云何遊此娑婆世界三根緣所宜即下菩薩得道四悟解之首故明聞經得現一切色身三昧五報恩之初捨身命財報恩供養六即勸人持經藥王由經得益欲如藥王者當持此經又勸人弘經欲尊人重道當如藥王又上來説法華經此一品揄揚讚嘆即説嘆次第藥王者一如舊釋二此經平等大慧是衆藥之王以遍治凡夫二乘病悟此藥王從法受名如身子受華光之稱下明勤精進得一切色身三昧者經以三智為宗菩薩悟解三智故得現一切色身三昧九道身本來寂滅故雖多常一即智雖一常多故了悟一道清淨故現一切身轉身供養供養中有二初明佛在世時事次明佛滅後事各四章初中四者一明受生所以還生王家者欲以上化下也還生此佛土者一欲報恩二受佛付囑次偈第二為文説燒身意初偈明感佛恩次明報恩所以為文説此事者明文但能生一身由佛得現一切身文但能生肉身佛能生法身故報恩供養釋文疑也第三明燒身果者前聞經得現諸身三昧果能示一切色身今燒身能解一切聲果重敘聞經果者欲往佛所恐文王留礙故明於佛邊多獲利益更往佛所爾時一切衆生喜見菩薩下第二佛滅後供養亦四一問涅槃二答涅槃三外財供養四內身供養文易知問曰上云無四惡道即無修羅今何故天人阿修羅見其無臂憂惱答曰上實無今化示有亦可上明此土無今從他方來或翻經人錯次嘆法華者前嘆所益人今美能益之教二意都為勸人持經又法華通因果上明佛能乘今辨能乘所乘也又前嘆弘道人今美所弘之教持一偈勝大千寶施者上燒指勝捨大千寶燒指為難物多憚之持一偈勝大千寶持經為易物多從之都為勸持經也持一偈必為法身種子物施但感人天故持經勝問持一偈何如燒指答曰小般若云日三時捨身不如信心不逆況燒指耶次十喻嘆法華者初以海為喻嘆此經五根本五支末五攝末歸本故無不收故大也究竟之道超四句絶百非謂之深也次山喻者昔明三乘皆究竟山如無高下今唯佛乘究竟餘乘非究竟如須彌之高衆山為下三乘既爾三身壽土亦然次日月喻者此經敞一切權開一切實如月照明也破凡夫二乘菩薩三人及除封執五權之病為滅一切不善暗故月喻顯理日譬破病也次人天王者王有二義一歸往喻收五權歸五實二自在從五實出五權廣即一切也次凡聖者梵王為衆生之父一道清淨是六道原三乘之得本也由法華經出生三身故是三身本亦是一切權實體用本初段經出生一切果本後段經出生一切因本故藥王等皆從法華生故説此品即是嘆經令人持經也既為得失之宗是故第一如四果辟支之第一也次因果者菩薩因中之上佛是果中之極如妙因妙果一切因果中最上聞此品得無量功德者此品明得益之人妙嘆能利之教妙又藥王為因法華為果因果略備故聞之福多捨女身者以染著而受女身故持一品正以離著為本脫女身也則聞藥王全燒一體別燒兩臂重道輕身於身不著病則消滅者法華論云火宅治凡夫病窮子治二乘病藥草治菩薩病聞此經三病消滅破此三病便得佛不復老死問曰持經女人云何即得無生答曰有二義一是久行人示同女像度物如勝鬘之流聞經進悟二持經生彼彼土中修行得無生也妙音品藥王妙音俱稟一道同得現一切色身三昧前以身財報恩妙音弘道酬澤又法華有遍治病之功德如藥王故藥王彼破病以受稱妙法之教能顯至理稱為妙音從顯理之教得名二人既為弘經之瑞具取經之兩義為目佛放中道光召來者明其人弘中道經得中道悟也法華明中道有四如上説之問曰何故名彼菩薩來答曰有五義故來一者欲引彼菩薩得化彼人及此土故放光召來二者藥王妙音文中並云救護娑婆故知於此土有重緣今土還穢正於此土行化故偏召之三者上明果德有種種果今明因行亦有種種因故上説藥王今辨妙音四者欲勸人持經故妙音由法華成就欲得如妙音者當持此經五者欲顯淨穢故來既從淨土來佛誡之勿生下劣相者尋妙音必無斯念但寄彼誡此土衆生見土還復穢覩彼從淨土來故起高下想故逆誡之令知淨穢土從緣土無定實土無定有二義一者約緣為言於淨緣見淨於穢緣見穢故土無定因此悟非淨非穢得住常寂光土二者望佛淨穢皆是方便土實未曾淨穢亦令因土權實悟土非權實乃得無生忍次顯乘權實者妙音欲來化作八萬四千白蓮華者欲顯法華一乘之相明八萬四千法藏皆是法華問曰釋迦令多寶召來妙音問訊多寶云無病少惱安穩堪忍久住不答曰上來諸事欲明多寶不滅既云少惱堪忍久住不故知未曾滅小乘橫云佛滅謗佛也問曰妙音請見多寶何不明見事但述多寶歎之答曰元求見之意在顯常多寶稱嘆即知不滅何須辨見耶形不可見者法身絶相也而聲可聞者教中説有也作此意復一種形勢顯本迹又且得明見略不述之白佛已下敘一切處弘經益物即説五權實也住普現色身三昧者了多為一以一為多亦名現一切説三昧彼此得益也觀音普門品尋聖人無名強立稱有二菩薩名者妙音從所弘法門立名觀音以所度衆生受稱良由菩薩德唯有二上弘大道下度衆生故二人相接總攝衆義也然妙音遍十方而弘一道實無所弘觀音入六道而度四生實無所度平等真法界佛不度衆生悟無所弘所度即是弘大道也常須以三智為意也問曰妙音弘一道即度四生何煩觀音度四生復弘一道答曰流通法華有二妙音周十方而弘一道謂攝用歸體觀音遍五趣而説三乘即從體起用體用具足化道乃圓故要須矣問二人各用何方便答二人俱用三輪但妙音正明弘經用説法輪度物即滅惑生解觀音用神通輪度物即拔苦與樂又妙音弘一乘辨生滅無生滅方便令凡夫二乘有所得菩薩滅惑生解捨生死取涅槃次彰平等大慧是故令悟惑本自不生竟無所滅無生死可捨涅槃無可證即令悟不生不滅不取不捨中道大慧謂妙音用也但根性未堪受斯大道交為衆苦所縈拔苦與樂滅惑生解蓋是觀音之方便也雙泯之然生與無生皆為斥病故生病若息無生亦忘乃契環中之妙術耳又妙音以法門度物為弘一乘觀音以人門利他謂三名三德並是人也今説名德以人利物也又歎觀音名德皆由法華而成若欲得如觀音者當持此經也又上來明菩薩行今明行本行本者謂大悲也華嚴云譬如金剛從金剛性生不從餘物生菩提心寶從大悲救護衆生生今此品正説大悲救護衆生故名行本行本若成衆行自立也觀音普門者具三輪度人即又三普也於法身地遍察法之機謂他心普隨類現身知病識藥謂神通普隨緣説法應病授藥謂説法普也問觀音名何故境智感應答要具二義前觀幾為境智後得益為感應故名中含兩問三名具機通乃示現答觀世意是他心通即是示現觀世音為天耳觀世身為天眼此二是通非示現三普中即是三示現三明中説法普是漏盡明餘二非明又三普是三通上下名德相對者觀音是弘道之人普門是所弘之法道約三身辨次第上是法身下明應化次三輪次第上是他心今是現通説法次明悲心悲事上是悲心今是悲事問境智具幾種答具論有四諦二諦無諦因緣生音聲所生是苦能生是集謂苦集因緣生畢竟不生即滅道也了因緣不生生謂世諦生無生第一義即二諦觀了因緣生本不生故不苦不集今無所滅故不滅不道即一諦觀因緣生既不四亦不一即無諦觀也問觀音正是何諦答是世諦及苦諦也問感應有幾種答有二種一相應感謂雖復稱名是因緣之名雖有無名知無為謂波若方便名無名方便波若觀音即二慧為體稱為名具二慧與觀音相應如此人感多得相應益名相應二直聞名生重心不識前二義與觀音不相應但得不相應益謂脫火水等耳問二名得論顯密不答正是也觀音是密應顯感普門是密感顯應就文如此互相兼成四句攝一切感應事盡又初章是理外感理內應以脫水火等為理外感菩薩應之為理內應也普門中明得度義即理內義也問理外是有所得云何感理內答理外感有二一者理外轉入理內故感理內此是外將傾無得得應發人二者理外感但得理外益如脫水火及得男女等此人未必見理內菩薩身及教但得感見理外事問若爾還是理外事感理外事云何感理內答此是理內人示理外事於菩薩恆是內於衆生常是外也問云何密感顯應耶答衆生不三業求請而有諸佛出世及觀音現身是密感顯應也依求請現身請説法而不見聞身教而得益是顯感密應也稱觀音名乃滅三毒者蓋是大悲純原從重至輕一切衆生皆為身心火所燒而身火切故前救之心火於物賖故後令滅矣觀音是法身法身絶四句今見法身即四句心斷三毒豈生又以波若為觀音體論云在菩薩心名波若在佛心名薩波若歎波若偈云波若遍無所依止過一切言語念觀音即是波若故一切惑斷又念己身是念觀音經云觀身實相觀佛亦然論云如來所有性即是世間性也白佛言云何遊下前明大悲拔苦謂身心有四苦今與四樂謂三乘樂及世間樂也問何者是觀世音答世人云常云觀音是人名今明只觀世音即是妙法蓮華也今取三菩薩約法華三義妙法有治病義即藥王是也得於妙悟為物宣通是故名妙音即妙用遍觀法界衆生機故名觀世音問下更有餘人復云何耶答妙法是諸佛祕法能有所消伏有所護持故名神呪無處非妙故妙普賢賢者妙也故隨義立名不二而二上明如是所證故名所乘法今取能照義故名觀世音也問何者為如法答有人法見即名粗言有二無我理無人法見亦有亦無非有非無皆是粗法淨如此粗故名為妙以有諸見之粗故不能照明六道今粗法既淨即觀無不明故明見四生故經云一切法不生即波若生也問衆生何故不見觀音答觀音非是有而衆生起有見則與觀音隔何猶見觀音如是亦有亦無乃至常無常真妄等今若習無生觀則四句不生絶四句故則觀音現觀音即波若也問習無生故觀音即現此事不疑若叵有無生未現觀音現不答習無生若明生滅將滅觀音若現身即得悟故智度論云滅惡生善見佛聞法也釋應以佛身得度乃至而為説法應化二身淨穢兩土權實教門也故此一句網羅一切雖現應化而不動雖説二教而無言不動而現身不言而説法即開義也雖現不動雖説無言謂卷義也雖開不舒雖卷不合即三密不思議也觀音既爾十方佛亦然釋辟支佛有八方便八實行謂少大一雙七生人是鈍根但約聞教即成鈍根羅漢自悟成鈍辟支極利取百劫人次於本乘辟支亦有利鈍一雙極鈍四世極利百劫次獨覺及部行一雙有徒衆眷屬名部行緣覺無眷屬獨靜山林名獨覺次明一人多人一雙一人世出謂本乘人發願獨生無佛世出多人出世謂如五百仙人一時成辟支佛次菩薩辟支佛本乘人智度論云菩薩不值佛法退證四諦成辟支此通利鈍既為八人可知問曰辟支不能令人得𤏙法及四果能令人成辟支不答曰能也如五百仙人初人成辟支竟教餘四百九十九人並成辟支所以者何聖人應在無佛世根就故能令人成聲聞也問曰云何人非人答曰現為人復有非人相故云人非人也分舉二佛者經有兩義一三身義須立分身佛復有二身本迹義但有多寶法身釋迦迹用故上明三身今明二身也陀羅尼品有二義故來一根緣次第衆中有六萬八千人應聞祕密法門得悟故諸菩薩應機而説二義次第者觀音謂通救護一切衆生今別救持經人問曰神呪應遍救一切何故但救持經人耶答曰此是嘆經力以受持經之因感神呪救護餘不持者不感欲得救者當持此經初藥王問持經福多少者顯持經福多勸人持經又持經福多還感經護此神呪即是法華上顯法華能消伏煩惱是通神呪義大品云般若是大神呪大明呪法華亦爾今嘆祕密説法華有消伏邪魔惡鬼之力也又法華能消伏生滅邪想之力故下明聞之得無生忍也妙莊嚴王品亦二義故來一上品明菩薩見機故説神呪今品是佛見衆中八萬四千人得法眼淨故應機説於古事故佛菩薩共聚靈山弘道利物二望流通法華意者弘一乘有三留難一凡夫二乘二天魔惡鬼三外道邪見上藥王妙音弘通一乘降伏二乘人次陀羅尼降伏魔邪惡鬼今降伏外道邪見伏此三方得弘宣大道又此品來者上品護正人令其進行心不退轉謂説法輪今品降伏邪人令回邪入正現世得記未來成佛謂神通輪又此品正歎善知識力令一切衆生種善根生生值善知識更相救護遂致成佛品中有二初明緣起二正陳本事緣起易解爾時彼佛第二正明本事於中有二初説本事次品未明時衆悟道本事有二初明古事佛告大衆於意云何下次會古今事於中有二初述二善知識共化一邪見王次王回邪入正現世得記未來成佛嘆二善知識也初二善知識即二前明菩薩善知識化王令回邪入正以生信心爾時彼佛為王説法下次明佛善知識化王滅惑生解二文各六初文六者一佛逆為集衆説經二菩薩現通令回邪信正三菩薩出家四勸父母令見佛聽法五敘王眷屬有堪聞之德釋成不虗勸意六王眷屬受勸至佛所初明為引導王説一乘者王有權有實若是實行則王為邪見之王以上化下則一切人皆行邪道今佛欲伐其邪本則天下皆回邪入正同龍樹出世欲弘佛法前化邪王心也若是權行者王初同邪後回邪入正亦令一切邪回也二子白母下第二佛既説經今菩薩勸往聽也爾時二子下第三請求出家前引令回邪入正今欲引父母令捨家學道故嘆佛難值及脫難為難爾時二子白母下第四勸至佛所也當聽我等下前但私白母今具啓父母意欲通化父母令聽法及出家也妙莊嚴王後宮下第五敘王眷屬有堪聞之德釋成勸意爾時下第六至佛所也爾佛時下第二明善知識亦六一為王説法二王聞法歡喜捨財供養化成大臺下第三佛現神力表王行因得成佛相也爾時王下第四王覩相歡喜自發意求佛也爾時佛下第五授記也其王即時下第六敘王出家得益也即升虗空白佛下第二大段王得益歎二善知識即二前歎二菩薩次歎佛嘆菩薩中初正嘆二佛述歎述歎中初通嘆一切善知識勸人種善根大王汝見此二子不下次發二子迹別嘆善知識也爾時大王下第二嘆佛為四初嘆佛爾時王讚嘆佛如是下次嘆教於來前下正嘆法我爾下第三明服藥病差生心自誓第四稱嘆竟禮佛而退次會古今及得益文易知也普賢品亦二義故來一根緣次第此會中應有大千世界衆生行與普賢相應故普賢為之現形即得悟道故有此品二義次第者是第四護正法行上果門有四謂乘權實身權實壽權實土權實辨今菩薩行亦四初二弘佛道行次兩救衆生行次一降邪人行次一護正法行故四德攝一切果德四行攝一切因行次攝四為三果德三者初穢土中明乘權實次淨土中明餘五權實次會遍為十方總明四權實此説教周化緣遍今攝四行亦三初明弘佛道行明攝用歸體觀音一品明從體起用從陀羅尼竟普賢還攝用歸體可熟者文方見此意所以初後皆攝用歸體者正弘一道之教及理無二唯教一人也次攝三為二者前雖有三但有權實實即體權即用也果德唯有體用今雖有攝用取體從體起用亦只有體用也次攝二歸一者前雖有體用亦是果門是佛法之事今雖有體用但是因門謂菩薩事故云一因一果也次明因是果因果是因果因果故非果果因故非因乃明非因果中道妙法再放眉間光顯於折中豈是虗哉然妙起對於粗中對於偏其法華時無復於粗云何亦粗亦妙如是五句皆無蹤迹佛不能行亦不到論説大乘行竟亦結云諸法不可示滅一切戲論無人亦無處佛亦無所説也末又結云一切法空何有邪見正見即是無粗亦無妙矣若不信龍樹亦不信佛故龍樹權佛作此説也釋普賢普有二義一體普二用普體普者華嚴云普賢身相猶如虗空依於如如不依佛國依如如者以如為身如遍一切處六道三乘皆在如內淨名云一切衆生皆如也乃至諸賢聖皆如也一切法亦如也衆賢聖亦如也攝論云無有衆生界出法身外又一切法不出於如大品云如外更無有法問曰何故明六通三乘皆在如內普賢身內耶答曰欲明六道衆生皆是普賢普賢絶四句超百非六道亦然常須安普賢己身心達此身心本來四絶故即是普賢性故中論云如來所有性即是世間性又云生死及涅槃際無有二際作此觀行方見普賢若作有所得與普賢隔是故不見普賢也問曰攝論云初地得遍滿真如與今何異答曰今衆生謂六道與普賢異故明遍耳既無六道不遍云何有遍既無不如云何有如故經云如如不異又中論云寂滅相中無邊無邊等也四明次用普者十方有六道一切國土身皆是普賢身所以明用普者欲令衆生悟於體普既無用普之不一寧有體普之不二也問曰何故最後明普賢答曰欲顯此經明因果皆究竟上已辨果究竟後明究竟因普賢既是究竟即顯因門究竟也欲勸持經故未能持此經則行普賢行欲得如普賢者當持經也問開內云多寶照其不滅普賢顯其不成云何是耶答普賢不明成佛顯法身無始成終滅義也
