body:
  text: 信解品玄義五門如疏中説大意信解權實耳正宗在大小二涅槃一往昔信於滅不信不滅信滅者信小乘滅四住分段生死是究竟不滅不信者不信小乘更有煩惱生死可滅今則反之不信小滅是究竟信更有究竟滅故言信解也二者昔不信本無煩惱生死可滅而信有煩惱生死可滅今信者不信煩惱生死有滅信煩惱生死本不滅所以然者煩惱生死本不生今何所滅耶問曰云何名直往菩薩回小入大十信答曰若初信本不生今無所滅是直往菩薩若初執有生滅回生滅心信本不生滅是回小入大問曰何故就本不生判信不信答曰生是六道三乘本故睿公智度論序云夫萬化本於生生而生生者無生大生能生六道三乘法故大生為本生生復生大生則生生為本中之本今悟無生則三乘六道本不生則自然歸一故就無生明於得失此是一往對治之言耳竟無末生何有本不生如是五句故云不信一切法是信般若一切法謂竪橫辨百非四句也問曰身子與中根悟解何異答曰身子但敘二輪耳鹿薗之小謂枝末之權今一乘實攝末歸本法枝末謂無生滅生滅是方便根本即生滅無生滅是真實中根近領三輪華嚴根本即本不生滅次中途枝末即是生滅後攝末歸本謂無生滅也二者過去本習無生即根本中途失無生故起生滅三至靈山還悟本無生也問曰回小入大至十信中何信答曰既是始回但是初信根耳何以得知方便品初明除諸菩薩衆信力堅固者明菩薩信一切二乘弟子力不堪即明未有信又云諸佛語無異當生大信力又廣説初勸信佛語不虗後結勸信奉時乃至佛滅後羅漢都未生信故知今始生信入初信根八萬十千劫十信方備如攝論十信初心入初僧祗劫數地持中明種性菩薩上根者入僧祗軟根者不在數中此二論明位有前後此二就直往人也問曰何以知直往人有行強空觀弱回小人空行強有行弱答曰小乘人專修空觀設起大願大行心多入空以數習故如凡夫人欲作空觀心多入有也釋文初長行法説略明信不信不信者二乘有二種不信一不信小乘二不信大乘不信小者不信小從大有亦不信説小與悟大信者信小從大有信説小令悟大也二不信大者不信小人説大令小學大亦不信大人説大教於小人唯信小人説大教大人大人説大亦教大人今與此相違故名信大也法説中有三乘初小乘次法華前大乘三一乘昔於前二乘中迷今於一乘悟一乘悟者非是悟一乘並悟前二乘悟小從大出説小令學大亦悟昔説大令捨小學大也釋十譬玄心十譬者一為父子喻二中途相失喻三子漸還鄉喻四父子相見喻五喚子不得喻六冷水灑面喻七誘引還家喻八付財密化喻九陶練小心喻十委囑家業喻釋名領上如疏中説次合十為六謂子有六時父亦有六時子有六時者一住鄉時二失鄉時三還鄉時四見父時五怖畏背父去時六回還就父時父六者一住鄉生子時二覓子不得時三止宅待子還鄉時四見子歡喜時五喚子不得時六得子付家業時次合六為三子有三時一住鄉時二失鄉時三歸鄉時昔聞説平等正觀而修習之謂住鄉時二斷常既強正觀微弱背中道起斷常竟靈山之前謂失鄉時三靈山之會還得正觀捨於斷常謂歸鄉時父亦三時一昔為説平等正觀時第二中途覓正觀子不得時三正為説還鄉中道正觀名為得子時也即是三化初是一往化次是隨逐化次是畢竟化次合三為二子有二時一失鄉時二歸鄉時從初習正觀乃至靈山之前若得若失皆名為失以未住中道之鄉從靈山聞還鄉之經始正觀明了住中道之鄉故是歸鄉時父二時其間教門無量且據始終二事昔作菩薩覆請化子時今作佛方便以化子時又有二時初為子中途相失及漸還鄉是過去時自爾已後名現在時次合二為一子一父一子一者從昔至今雖復輪回反覆並皆是子非是餘人即顯始終皆是一乘人無二乘人皆是一因無有餘因即是顯一破二明説譬意也父一者雖復今昔輪回終是一父即顯始終唯有一果無有三果總而言之唯有一父一子一因一果次合因果二以歸於一既是一因一果令子回因證果則唯有一果故下云一相一味究竟至於常寂涅槃次泯一以歸不一本對於多是故有一既其無多云何有一即是言忘慮寂非一非多不常不斷故中論觀法品云嘆大涅槃非一亦非異不常亦不斷是名諸佛世尊教化甘露味不異者無九道之異也不一者既無九道之異亦不見涅槃之一不一故不常不異故不斷得此正觀名甘露心不行此處皆是服毒藥也又一遍敘十譬意初信諸法本無生是初為父子喻佛令初生彼無生信是父其人初信無生為子也中途相失喻者無始來習生滅煩惱強今始習生故無生信弱遂背無生而起生滅名子失父父覓其無生善根不得故父失子子值善知識捨生滅還習無生觀名子漸還鄉一形之內應悟本無生名子見父初成道時未堪受無生觀名喚子不得習虗妄來久但堪受虗妄中虗妄故為説人天教名冷水灑面譬欲止虗妄中虗妄故且説虗妄中不妄謂無生滅生滅教故云除糞除糞者未説糞無生且説有糞生令除之也欲令生滅人悟無生滅故令生滅人説無生滅名付財密化次令無生滅人説無生滅化生滅人陶練其生滅心名陶練小心生滅心遂改得悟無生故委家業也佛意正爾作此釋者於今人有益不爾者直是述古活耳像法決疑經云諸佛説法指近以標遠立像以表真當意在無生正觀故作此喻耳問曰十譬有幾種意耶答曰有四義一者近望長行略説今明廣説略説有二意三意三意者即三乘一小乘二者昔大乘三一乘從初至誘引還家喻上解小乘教意付財陶練喻上不解昔大乘教意委屬家業喻上領解一乘教意爾前六喻通為此三作緣由耳次長行二義者前二教辨昔不求後悟解明今自得今九譬譬不求之失一譬譬悟解自得二就今十譬復作一途次第如上生起此欲明過去共結因緣中間流浪今日相值得悟解也三者領火宅六譬次第如本疏説四者釋成火宅六喻微隱之義令二世衆生解佛六喻意問曰此品凡有幾義答曰略有十四條大義一明三身義覓子不得為法身中止為應身著垢衣為化身次有三土法身居實相土應身居淨土化身住穢土次有三乘義即長行法説文謂小乘一乘次有三輪義謂根本枝末攝末歸本喚于不得為根本誘引還家為枝末委屬家業攝末歸本次有三時義一住鄉時二失鄉時三歸鄉時初是住鄉時中間相失為失鄉時子漸還鄉為還鄉時次三化義謂一往化隨逐化畢竟化初為父子謂一往化中間相失至法華之前為隨逐化靈山之會為畢竟化次有三品善根義一下品如向國二中品如向城三上品如至舍次有三世義謂初過去世父子相見為現在世後委家業受記作佛為未來世次有漸頓義喚子不得為頓冷水灑面竟委囑家業為漸次有世出世義冷水灑面為世間教誘引還家竟後為出世教次有大小乘義誘引還家為小乘教付財竟後為大乘教次有自他義付財為自教陶練為他教次有顯密義從冷水灑面竟陶練小心為密教委囑家業為顯教次有得失初九為失第十為得解此一品具解十四牒義方解此一品也次釋文譬如有人年既幼稚者此是子住鄉時今先須識鄉方須識背向也婆羅門問佛本鄉在何處佛答曰絶四句是里薩婆若樹下止絶句里者謂中道也薩婆若樹下止者謂正觀也故龍樹中觀論有申破二事申者申初中道令九道衆生識本鄉破於斷常令發正觀使歸鄉也斯論豈不要哉豈易聞寄語一切諸修道人可常栖神於論矣問曰何故獨美斯論答曰馬鳴興正法之末猶未造論龍樹出像教之初為失鄉之流故正論於鄉是故要也又是衆論本宜尋其根問曰此論云何示絶句鄉耶答曰論末結束云從因緣品來推求諸法有亦無無亦無非有非無亦無是名諸法實相亦名如法性涅槃故是絶句里示故鄉之義法華三昧經云返原示欲鄉失令人歸故鄉故鄉名無為號字清淨室清淨室者百非四句皆畢竟淨也但六道衆生妄想因緣失於故鄉流浪六道諸佛過去為失鄉衆生説平等大慧即是還鄉經令諸子得住本鄉但無始來習斷常久正觀微弱故名年既幼稚也此領上三十子及生育甚難之言也捨父逃逝者第二明失父時此領上其人近出未久之間歘然火起上明佛出宅故火起火起由佛今釋成之此非佛捨衆生但衆生背佛故名佛去耳又頌偈中先因遊戲來入此宅然中道之法隨義立名亦名父亦名鄉得中道法能生他正觀故名為父涅槃云中道名佛中道是衆生本宅故名為鄉今起斷常背中道故名捨父即領上惡鬼毒蟲既背中道必起愛見由愛見故起業遂感生老病死名為他國中道既是本鄉當知斷常即他國也此領上三界舍形初背理起常猶輕故生於人天於人天中或受五欲起愛或因邪教起見愛見既重故墮三惡趣所以初言或十二十乃至五十舊來以乃至之言含取修羅今明非無斯意但望後偈文稱周流諸國當知欲辨輪回五趣故故云乃至也此領上五百人加後窮困者久劫在於五趣名年長大備受三苦故云加後窮困故下云以三苦故出生死中受諸熱惱此領上火起燒宅若就今文領總譬中其義略盡背文即起惡鬼毒蟲二因次他國即三界五道兩果此間為六道舊迷加後窮困謂三乘新惑故領上盡矣若直就今文譬次第者四句次第初明捨父次住他國三辨得五十餘年四具受八苦四方求衣食者此第三子漸還鄉譬地獄苦重畜生愚癡不能生善無還鄉之義餘之四趣可得生善故言四方又不知歸父舍以求樂而於四方求樂顯子之愚喻不知於大乘中道求樂而求人天二乘之樂亦是愚癡又四方者去城逾遠岐路逾多顯不知歸一極之由路也漸漸遊行遇向本國者此具二義一因修有所得善根冥資過去無得善根故言漸漸遊行向本國二者稍學習無所得觀故言漸漸向中道實相本國也子還鄉有三因三緣一有中道佛性故還生中道善根二曾有中道種子故還生善根三法種衆苦樂求涅槃物極則返三緣者則是三輪一知機二現通三説法今於三因三緣中但明一因謂法種諸苦樂求涅槃故云加復窮困馳騁四方其父先來已下第二明父三義問曰何故前明於子後辨父耶答曰火宅是父所説故前明於父後辨於子今是子設譬故前明於子後辨於父又火宅中作諸佛出世次第譬前有諸佛出世然後説教方有三乘諸子今則感應次第前有諸子之感然後諸佛出世應之又欲明抑揚得失故有父子二譬子背中道故受生死極苦父得中道故有法身極樂故前是逼門後是引門也還明父三義其父者對為子時以明父也領上長者也先來求子不得者第二對上子失父明父求子中道善根不得也有此文來為釋疑也疑云既是父子早應出世拔子之苦與子之樂何故今方出耶是以釋云求子大機不得故不早出世也中止一城者有其三義一者若明中止一城時處人物則是初成道華嚴會也二者望子貧父富父富則明嘆佛乘子貧則毀小乘三者欲明子宿緣應熟故佛垂應待之即是第三對上子還即辨佛出世也此領上國邑聚落有大長者中子即明出世時謂化不失鄉子即華嚴中諸菩薩也又是待失鄉子還時也一城者敘出處即辨在摩竭提界成佛也其家大富者領上總譬中嘆長者德也上嘆德有二初嘆自德二嘆化他今具領之其家大富領上財寶無量謂自德也其諸倉庫領上化他德也上化他德中有二初是二本二是兩迹令具領之倉者領上大慈庫者領上大悲之宅多諸僮僕者還領上僮僕外迹用也但上文既略今廣嘆之又開二別一嘆二迹此土之用次嘆二迹他方之用此土用中僮僕總喻現通象馬以明説法上以僮喻神通僕譬説法今總以僮僕喻現通者欲明具得借僮僕通喻二事也出入息利第二明二迹他方之用説法現通非止益此土遠利十方商估賈客者上明此往彼化今辨彼來此化又上明佛自現化此辨加菩薩化是華嚴中諸事也然此中開三身三土之義求子不得謂法身中止一城竟喚子不得明應身誘引還家謂化身即此三身便有三土法身謂實相土應身居淨土化身住穢土問曰初直云求子不得何以知是法身答曰若垂應化兩身則是救子不名不得今稱不得則知是法身照機未堪垂應化救之也問曰三身領何處文答曰上兩處文辨真應兩身一合總譬中初辨法身而生三界謂應身也頌見火譬亦明二身聞有人言是真身驚入火宅名為應身但佛略説故辨於二身四大聲聞助佛揚化故廣明三身又教門不同或二身或三身二身明義者一體一用三身明義者顯體一用多問曰上佛何故明二今弟子明三耶答上明法身照穢土機應身入穢中救子燒害故但明二身今明法身照機聲聞菩薩感見不同故開應化所以辨三身問曰中止一城何以知是淨土答曰中止一城不廢家業當知救聲聞大機未熟而菩薩道緣已備既化菩薩則是淨土又長者二子一者失鄉子二不失鄉子雜覓失鄉子無生善根不得而不失鄉子善根已熟故於淨土化之所以明淨土也又知失鄉子應回生還悟無生故住淨土待之故明淨土也時貧窮子下第三明子二義問曰何故交絡明於父子一類辨耶答曰欲明得失互相顯發故前明子三失父三得今敘子二義及父二義故交絡明之問曰中止一城是佛初成道華嚴時事今何故乃敘窮子方經歷生死國邑答曰有二義一顯菩薩心淨久在淨土非佛初成道時始有蓮華藏土亦如下云常在靈鷲山我淨土不毀二者初在淨土成佛富貴佛但追敘窮子昔經生死困苦事故也問曰此中明近父緣由及正近父欲明何義答曰欲明子既背生滅惑向無生滅解發起復父憶子之苦欲與子之樂又欲明子求人天二乘樂也困苦謂毀小乘即遊諸聚落是也二欲明藉此善根得增進近大乘即至城也父每念子第四重敘父也初念欲以大乘悲拔子斷常苦因離生死苦果也次念欲以大慈與正觀樂因授止觀樂果失鄉之子有苦無樂父無苦有樂欲令子同於父故興此二念又初念念其初事後念念其後事寂滅道場時失鄉之子未堪受道所以興悲靈山之會必當得悟是故起慈此則悲喜災集也又就初念自有悲喜所以爾者佛有二子一不失鄉子昔説平等大會經利根之子即得正觀是故住鄉鈍根之流失於正觀為斷常所牽名為失鄉華嚴之會為不失鄉子説於大法所以生喜愍失鄉之子是故興悲故悲喜交集問曰此二子何時得悟共父同集作歡樂耶答曰不失鄉子華嚴之會即便得悟失鄉之子靈山之集方乃得解故踊出品云是諸衆生始見我身即入佛慧餘小乘者今日亦入佛慧二子俱入佛慧故父便大喜所以云今我喜無畏即是父與二子同聚作樂也父子相見譬子見父者凡有三義一如舊説一形之內應悟無生名子見父二者欲抑揚大小前嘆父德即是揄揚大道下明見父起避畏心謂抑毀小乘故明子見父譬三者前中止一城此嘆佛初成道時菩薩堪受大乘今明子見父嘆於佛乘即敘二乘不堪受於大道於中有四一見父緣由二見父處三正見父四見父起避畏心由傭作展轉故至父舍由正觀漸明斷常漸離一形之內得悟中道名見父也國城舍父皆是中道異名至理有大城名國防斷常為城可栖名舍虗通為門能生正觀為父問曰但釋父是舍那佛今云何以中道理為父答曰即舍那是中道去中道有三品即是去父三品又可取二義為父一者內德即中道正觀二者外德謂應身佛也問曰何故具用二德答曰但取內德便成法身失眷屬圍繞之義若但取外德失悟入一乘之理故須明內外兩德為父又今正以長者喻佛乘佛乘備內外二德也住立門側者見父處也大機未熟如住後時必熟如立初有人天機天機不與無生理相應為門側但諸子始終凡有三機一久後無生大機熟二中途二乘機熟三初有人天虗妄機熟故一形之內聞此三教也遙見其父已下第三明見父問曰中止一城已敘父德與今何異答曰此譬有五義一者前譬還領火宅中化主譬説即是為譬立譬此領火宅中合總譬即為法立譬四大聲聞助佛揚化恐衆生未悟更舉喻而顯釋之二者立譬領上大車譬上佛舉譬嘆大車今復引譬譬上喻也三者為稱嘆佛乘下見父起避畏心抑毀小乘也四者次明佛初成道時事窮子爾時未堪受大道五者佛上略説今則廣釋之上合譬中有二初合舉處取人即是嘆人故云如來則為一切世間之父於諸佛怖畏已下第二嘆人德今還領此二事遙見其父者領上第一也踞師子床已下領第二也上嘆父德有二初嘆自德二嘆化他今領之亦二初別嘆二總嘆就別嘆中領上二嘆初領第一嘆自德第二領上嘆化他德上自德中有二初明纍無不寂次嘆德無不圓今還領此二也踞師子床者師子無畏領上於諸怖畏乃至無明暗弊永盡無餘即解脫床也亦是大車中高廣義也寶機承足者領上成就無量知見上纍無不盡今德無不圓即領大車中衆寶莊校也諸婆羅門等恭敬圍繞領上十力義也此諸勝人各有大力喻佛力亦然類上僮僕之義不須疑之又內有十力多有降制為物所崇故勝人恭敬即初成道時華嚴之會影嚮衆也又踞師子床寶機承足嘆佛富義今為勝人所崇美佛貴義一事之中多有所含故略明三義問曰何以得知復是華嚴中影嚮衆答曰後偈眷屬圍繞故知爾也真珠瓔珞者領上四無所畏福慧內嚴故外不懼物也臣佐吏民手執白拂者領上有大神力神通自在屈曲縱心如吏民等又神通助開至理猶如臣佐皆是無漏神通如執白拂又現通之意為除物垢故如白拂又即喻華嚴教中地前稟教衆也又前明福慧莊嚴重明富義今辨臣佐重辨貴義覆以寶帳者領上及智慧力智慧高出猶如寶帳又智慧力能上弘下利如寶帳上遮下䨱又智慧摧邪顯正如寶帳有遮䨱埀諸華幡者七辨巧説喻華八音美妙如幡香水灑地者嘆如來説法能滅四惡一掩惡覺觀塵土二滅煩惱毒三止邪師熱氣四滅邪教惡風散衆名華者此嘆説法四種生用一未發菩提心令生二已生令增長三已增長令成就四應退者不退羅列寶物者領上具足方便智慧波羅蜜也出內取與者自上已來舉譬嘆佛自德今領上慈悲之本及慈悲之迹即化他德亦前是領車今領牛與賓從兼喻華嚴中加諸菩薩演説大法如長者不自運使諸人出內也下諸句總結嘆佛乘不思議也窮子見父已下第四明見父起避畏心前是揄揚大道此抑毀小乘即令捨小而欣大也問曰父見子歡喜明何義答曰前子見父毀二乘明初成道時不堪受大今嘆父明知子後時必堪受大故前明子不識父今明父識子即遣傍人此喚子不得譬問上見父恐怖已疾走而去今何故遣使喚之答有二義一者見父不識避父而去此是一癡今遣使喚不來復是一癡上即是小機不受大今為説大教而復不受欲顯二乘無智故有二文也二者上明不信是父謂不堪見菩薩所見身今明不信我言即不堪聞菩薩所聞教欲顯菩薩聲聞有所得心路各異故見聞不同為此二事故隱菩薩所見身起二乘化身隱菩薩所聞教起小乘教也即遣傍人謂諸法本無生教為傍人令其捨生滅悟本無生滅為將還將還者還歸本無生也憚不受本無生故云驚愕等也轉更惶怖者謗則害慧命墮無間故轉可怖也隱窮深之佛慧授極淺人天為冷水問曰何故説此譬答欲顯根性淺劣不堪受窮深教久習虗妄但堪受極淺人天之教也方便不語他人云是我子顯初成道時不堪受二種一一者上來不堪受根本一今亦不堪聞攝末歸本一以不堪受二種一但事不獲已然後説三也歡喜者上以二種一化之應喜而返悲今息二種一而授人天及二乘應悲而反喜皆愚癡之深可傷之甚也將欲誘引已下自上皆是淨土教化菩薩竟今是穢土化於二乘但淨土教中有二事一者以淨土教化於菩薩二者從父每念子竟喚子不得明不得以淨土教化二乘人顯菩薩堪聞大乘二乘不堪聞大即顯二教門異也就不得以淨土教化二乘為二初明二乘人不堪見淨土身即子見父譬是也即遣傍人顯二乘不堪聞淨土教也今文即有二初對上不堪受大教故起於小教二對不堪見應身故起化身問應前現身方後説教何故前明教後辨身答接前大化不得故今明小化故前明教也又接上前明往貧里於世間中教行今即明出世教也又教正主傍如藥正醫傍也又從緩至切遣使與之共作此則為賒次明長者身自往化之此事為切又前説教是小化今現身是小化意謂比於小中密説大也問隱實教而起權教有四章領上何文答具領三車中四事初念欲起權教領上知子宿好譬從爾時使者第二正起權教領譬上為説三車譬爾時窮子已下第三子信受領上出宅譬第四父生愍怪領上見子出宅歡喜譬問曰上何故喜今明怪耶答上見脫重苦故喜今見不受大故怪又上明方便誘引故喜今論理實故怪若云除糞者作此問者若作好作我則不能若除糞鄙劣則便能也若聞煩惱本不生今無所滅則不信聞生滅則信故昔於波羅捺説五衆生滅中論云前為聲聞説生滅十二緣也今人聞三論明本無生不信聞斷五住等即信亦其人也前取價者今大乘人先欲求佛然後斷惑亦其人也又斷煩惱求涅槃是除糞如是除散求靜捨凡取聖欲捨非道而求佛道如是坐禪行道解義人皆是除糞人也問曰大乘經論具有斷不斷今云何偏呵斷答曰經云斷者了惑本不生強名斷耳不言先有惑然後斷之父見除糞故愍怪三世佛及菩薩見學大小乘斷煩惱亦愍怪以煩惱本不生今言其生後欲滅之則破實相若破實相則一切破所以愍怪也又以他日第二隱真身而起化身上明菩薩堪聞實教自傷二乘不堪聞上明菩薩堪見實身今明二乘不堪見實身又説一乘有三門初就小乘中説一二大乘中説一三一乘中説一小乘中説一者是密中説密大中説一是密中顯一中説一是顯中顯又上根於小中悟一中根於大中悟一下根於一中悟一上隱實教起權教明説小乘今隱實身起化謂小中密説一也就文有五第一父照子機譬第二父同子密令子同父譬第三子迷密教譬第四父重密化譬第五子得遠益譬問此五章領上何文答例前四教今身亦四初領父知宿好但堪見化身第二第四領上為説三車譬第三第五領上子信受出宅譬但無第四見子免難歡喜譬問此四與上四教何異答曰上明領所説教有四今領説教主丈六化身有四又上領説小教今領小教中密説大如上所明也問曰隱實教起權教隱實身起化身猶是一時云何乃言他日答曰喻中言前明遣二人共窮子作後長者來勸勤作合意前説二乘教令修行斷惑後更勸其勤加精進此是約義論前後故言他日實非異時於窗牖中見者正為二乘人不堪見真身作喻也羸瘦燋焠者無大乘解為羸瘦無大乘行為憔焠又初無智次無功德也有凡夫煩惱故言糞土塵坌以糞土重故也未斷二乘之惑故汙穢不淨汙穢輕也故見子二無及兩有也初父同子令子同父凡有五密方便初附近方便二誡勸方便三加價方便四安意方便五稱嘆方便此五從微至著漸就小中説大即脫御服已下第一明附近方便父來就子令子具大乘行解之二無除凡夫二乘之兩有也執除糞器者以心康無漏慧心是右手又人康無漏慧人是右手無漏慧除糞器也問曰長者除糞以不答曰小乘教明除糞今譬意明不除但執器來揚作除糞耳執器來者欲令子勤作也實不除有二義一明為二乘示丈六此是化身佛實不除惑二顯諸法本無生無糞可除即以此開方便門而化於子明實無惑可斷但方便言斷耳末世大小乘人言佛斷煩惱皆是謗佛也又世間人云佛斷惑是實不斷是方便今反之不斷是實斷是方便滅罪是方便不滅是真實故大品云若法先有後無諸佛菩薩則有過罪中論云諸業本不生故知不滅是真實滅是方便語諸作人已下第二明誡勸方便豪貴之父令子勤除糞意在本性空寂無糞可除故是小中密説大也以方便故得近其子者前喚子欲明是父子而子遂不來今父來就子令知是父子也故起化身為令衆生成佛故壽量品云見諸衆生樂於小法故説年小出家為令衆生入於佛道作如是説後復告言已下第三加價方便實無異時而言後復者據譬而言前來誡勸今更來加價約義異故言時異耳咄哉男子者揚作苦言勸作實是呵責除糞咄哉男子者即欲明既是丈夫何為除糞即是密語也本疏皆顯説小乘今並作密説釋者文含二意顯説就機論之密説就佛意以辨也汝常此作勿復餘去者密留子住父處作即是密令子習大乘也當加汝價者加價及賜諸物令作人歡喜更相親附令父子義成也好自安意已下第四安意方便安意住此作即留子之義故是密語也我如汝父者示其是父子非他人也此言大顯恐其驚憚故下以老少釋之小乘中説大乘半開半覆乍隱乍顯汝常作時已下第五稱嘆方便稱嘆令其歡喜欲留之相附為父子之義如餘作人欲明是子有異餘人也自今已後如所生子者未得顯説是真子但密示是子故云如也即時長者更與作字名之為兒者密改二乘之號密立大士之名也爾時窮子雖欣此遇者第三子迷密化譬窮子起惑凡有三時一本性寂滅橫成六道紛然二實是長者之兒自謂貧窮之子三説小密令悟大而遂不能因小悟大也猶是之故於二十年中常令除糞者第四重示密化譬既唯領近小不悟遠大當知是與父共事未久耳故今二十年者欲久住父處得成佛子也常令除糞既就小中説大不悟故還説於小令藉生滅之教遠悟無生故令除糞也過是已後心相體信者第五遠益譬藉生滅教除麁煩惱遠悟一乘也釋長者有疾自知將死不久凡有三義一者佛應機雙説大小此則為生機謝應息雙廢大小名之為死今至般若時已廢於小故稱為病二者就説大中自有二種未密説大則有小乘之教丈六之身此則為生密教於大則密廢小教密廢丈六之身此則為病至法華顯教於大顯廢三乘顯廢丈六故名為死三者佛初出世説於小乘有小教主已去涅槃遠名之為健至説大品已去涅槃近稱之為病若至涅槃目之為死釋付財四益義佛不自説般若者有益二無益二有益者一佛是至人説於極法則有顯法益二化於菩薩有利物益二無益者一人畏佛尊高疑問不能自盡二不得化於二乘故佛不自説不命菩薩説有五義一者令菩薩説得化於菩薩二得顯法尊妙三小乘人謂菩薩漏未盡見理不明亦有不得以人清淨顯法淨義四有疑問亦不能自盡以菩薩亦高尊故五不得化於二乘人故亦不得加菩薩令説命二乘人説復有四益一人淨顯法淨二得化菩薩三有疑問得自盡四正得化小乘人也問般若教宗云何答曰正明一乘為宗問與法華何異答曰有二異一般若正教菩薩傍為二乘所以知者下云佛敕我等為大菩薩説最上道智度論云為彌勒説菩薩行二般若顯教菩薩密教二乘法華二義一正教二乘傍教菩薩二顯教菩薩亦顯教二乘雖顯密傍正不同同明一乘也釋付財譬問曰付財明何義答曰望父付即是大方便調柔其心欲令引小入大望子受者前明不解昔小教意今不解昔大乘意上説小乘既有五密今命弘大道義亦同然富貴長者付貧賤子家財足之知示是己物斯一密也二者發言我心如是當體此意我心如是者欲與財也當體此意者令窮子體達與財之意斯二密也三重釋云今我與汝便為不異者明父子一體天地與我同根真如之外更無異物此三密也四宜加用心者加意用心採我此言謂四密也五無令漏失勿漏失與財之意也釋頓漸義問曰他明三教一頓二漸三無方不定與今何異答五時四時四宗五宗法華中明未有頓教義若有頓教則破彼義也亦無漸教漸教者悟入一乘至法華時即是悟本頓教故初一乘化不得為頓後漸化令入本一乘名漸化明法華未了寧有漸頓耶今明法華具足頓漸即是窮深極大極大者含三句一頓非漸謂頓化不得即華嚴也二漸非頓人天二乘教三亦頓亦漸大品等明大乘為頓未廢小為漸窮深者泯上三門歸于一道故一切教並歸法華從法華出一切教雖出無所出雖收無所入須精見斯意釋權實四句義實非方便即是一乘二方便非實謂四乘三亦方便亦真實即法華前諸大乘於菩薩即是真實小乘人假此得悟入一乘方便此四是教同表一理即非權實也釋本末四句一根本非枝末謂一乘法輪二枝末非根本四乘之教三亦根本亦枝末即法華前諸大乘經未廢三乘者是也有大乘故即是根本未廢於小故有枝末也問今正取何物為根本何物為枝末答曰本來唯有一理故一名為本又從一起二一為二一為二本四乘名為枝末問曰若以一乘為根本者則一切大乘並是根本一切四乘皆是枝末何得云華嚴為根本法華為枝末歸本答華嚴初具足辨佛乘故是根本餘教非初説也又或未廢小故不名根本預是佛乘皆是根本非佛乘皆是枝末此就教一重定作此分本末若中假相望則有四重本末初重如向二者不三不一中道為本三一為末三者三一為二不三一為不二二與不二皆末非二不二為本次絶四之理為本四句皆是末故中論法品明實相絶於四句若説於實不實四句皆是至理之門欲令因此四門悟入不四之道亦從無言起言故有四句之言也釋窮子始終有十癡義所以明十癡者四大聲聞將説譬建章逆敘譬意云我樂説譬喻以明此義此義者上法説中但明得失二義如譬喻品初今當以譬喻更明此義明此義者雖有六譬但明唯教一人唯顯一道也今雖十譬但明得失失中凡有十癡初背父而去謂一癡也次還歸住門立而不入斯二癡也次見父不識謂為非父此三癡也次重背父去謂四癡也次喚不來謂五癡也次為説是子亦不生信此六癡也故文云雖如是子而以方便不語他人云是我子即初成道設為説法華亦不生信也次往人天他家客作斯七癡也次父喚為子不求而為父除糞斯八癡也次父親付財而不取斯九癡也次為説大法陶練小心猶自不求此十癡也釋佛知其心漸已通泰明四調柔義此譬來亦二義一者望佛陶練小心令立大志二者重顯子癡如下偈二種陶練猶不改小求大一者用大行陶練而封執小行不求大行二者以大果陶練報封小果不求大果今就佛一化始終四種陶練令改小心大機成就四調柔者世間教出世間教自教他教也初二調柔令離凡夫有見次兩調柔令離二乘空見空有二見將滅中道正觀將生故至法華中為説中道之經即便得悟即是因中發觀也又前二調柔令離三界毒蟲惡鬼三界火宅令不起凡夫之愛離於毒蟲不起凡失之見離於惡鬼惡鬼毒蟲若滅則心火滅火滅故不更起三界身故身火滅得出分段火宅也後二調柔令離二乘毒蟲惡鬼令不起二乘之愛故息毒蟲不起二乘之見名息惡鬼問曰二乘云何有愛見答曰涅槃經云有所得者名為二乘有所得即是有所愛著故名愛若以聲聞言無布施是邪見又見菩薩八相成道名為曲見故二乘具愛見則見毒蟲惡鬼毒蟲惡鬼滅故心火滅不受變易之身故身火滅得出第二重火宅是以四調令出二種火宅也今二乘後火將滅應登中道大車故佛為説大乘也而命其子者斷常將滅正觀將生即是子也親族者同行中道同行之流名為親族也國王者分身等也若多寶分身來集者取已成佛諸菩薩是國王也大臣者十方諸佛所化高行衆也剎利者七地無生已上也居士者初地以上人也問曰何故但集此衆答曰今欲召集證明衆不取稟道人故但列大者也此是我子者是我正觀子也我之所生者昔説中道經今生正觀子也捨吾走者背中道起斷常也昔於本城推覓者本城者即中道本鄉求正觀子不得也此間遇會得之者至法華斷常始傾正觀始發名得之也此實我子者問曰上已云我子今云何故重説答曰可細尋經旨今言實子實子者真子也昔雖是正觀子斷常強正觀弱非真子故退也今正觀強斷常弱不後退轉故是實子也大富貴長者忽起客作賤人為兒恐是權誘物不信故言實也昔二乘畢竟不作佛今忽作佛亦是難信故發此言也次付財者非長者外與其財因中道經發正觀解故名與財彼得正觀離斷常故名得財也先所出內是子所知者上悟法華今悟般若般若法華是大乘教之始終顯二乘人具解一切大乘教理也又與上句財令其自行今知內外使其化他既成菩薩則具自行化他二德也昔雖化他謂是他令我化他始知是我自化他非長者使我化他又昔謂他物與他今知是自物與他也又上與其財今令用財得而不用亦無深益還是自行化他意也釋合譬意但合三初合住鄉二合失鄉三合歸鄉此三既要攝十都盡凡衆經合譬其意有四一者全合以喻説難明須次第遍合二譬多合少譬説易者不合難者合之三譬少合多亦是譬難所以四轉勢合喻中一勢明之合中更復轉勢也若講師但取譬而合者唯得一意也大富長者得實理纍無不寂德無不圓為大富皆似佛子者謙讓門也又得無生中觀為真今但入十信為如來常説為子者不敢自稱皆是佛子提引亦自謙也又斥餘未悟也雖復三世回轉未始非子則唯有佛子無有二乘六道之非子也以三苦故已下合失鄉也失中道鄉起二火宅也三苦者起凡夫愛見心火感分段身火也迷惑無知樂著小法者起二乘愛見心火方受變易生死身火也又失中道正觀具起斷常起凡夫有見即三苦所燒起二乘斷見名示小法也又退菩提心有二種事一受三界苦二者愚癡苦即樂著小法也世尊已下合還鄉譬但合三者初合小乘次合大乘後合一乘攝大乘論中亦明此三也又釋迦一化唯此三人也又前法説中唯有三也又三譬二意初二是兩調柔謂悟一之方便次合所悟之一也此亦攝一切方便正體也初二為二調柔者初譬令離凡夫愛見火宅次付財調柔令離二乘見愛火宅也又對上失鄉兩事一者起凡夫愛見受三苦二者樂著小法是愚癡苦初譬令離凡夫有見次調令離二乘空見合此三譬中一一有二初二者一明小化得次辨大化不得釋成小化得也蠲除戲論之糞者凡夫愛見為戲論也如中論法品説也得一日價者上所離今有所得也此中顯二乘所得不足言如一年得一日價此一癡也二復以為足此二癡也三自以為多此三癡也下復云不復更進求也此為四癡也次明大化不得釋成小化如文易見也合付財中亦二初明説大不求世尊以方便力隨我等説者第二明昔不得顯教其大也方便隨我者説我説大乘但教菩薩不教二乘二乘自學小法佛昔於大品中隨我亦作是説故名方便合一乘中亦二初明領解法王已下次辨自慶釋偈文前舉善吉今明迦葉者欲明解同故互舉也頌十譬應十但偈與長行轉勢明義故文不同轉勢有二初略廣二科簡略廣有二長行廣有十譬偈略唯八一初為父子二中途相失三子漸還鄉四父子相見五大乘喚子不得六小乘化子得七付財密化示大乘八顯了教大作此八事明不須人天教故略冷水灑面付財陶練同是大乘密化舉一則攝二故亦略之則但有八也二者長行與偈互有略廣長行廣已顯偈則略之長行略未顯偈則廣之次科文階節者雖有八譬取意唯有三階一明住鄉二辨失鄉三敘還鄉此三攝一切但上三譬四番初明子三義次父三義三重明子二四重明父二今合四為三初明子二次辨父四次明子三子二者前明住鄉次失鄉童子者昔修正觀不離凡夫二乘愛見如童子也幼稚者習觀微弱也無識者釋長行捨父之所以也未能精識有所得無所得如無識也遠到他土者第二失鄉也有所得無所得其理懸絶故名遠也周流者長行中但明遍生六道為周今辨輪回久劫如流即釋長行久住義也乃至之言其父憂念領父也長行略明三義今廣明四義一父覓時二覓失鄉子不得時三化不失鄉子時四憶失鄉子時四方覓者子移五趣父言四生其言巧妙也五趣攝生不盡四生攝生則盡欲顯住一子地遍覓失鄉子不得方息化也求之既疲者覓失鄉子善根成就未得未堪即化也頓止一城者頌上化不失時也一城化不失鄉子處也造立舍宅示舍那身明化主也五欲自娛者內受佛樂外化大機説盡理之法稱悅佛心也其家大富者頌化主德也此中猶是頌火宅嘆長者德但長行略説今明廣嘆就文有三初作大富譬二明大貴譬三總結富貴初總讚嘆佛德無不圓次嘆九道尊極又初明盛德內充次辨外為物敬富貴各三一內富二外富三他方富亦得為四謂內外此土他方明富德頌本迹義耳千萬億已下第二明貴亦文三義四初明內眷屬所敬次十方佛愛念群臣已下十方菩薩所尊重義四者謂內外佛菩薩皆敬愛也以諸緣故已下第三總結富貴弘道利人名為諸緣授道為往稟教為來又遣化他方為往他方遣化或為作證為來豪富如是第四憶子之苦上來化不失鄉子今憶失鄉子夙夜夙謂早也爾時窮子已下第三重明子三義初求衣食時二近父時三至舍時即三品善根也初二義屬子還鄉譬後一屬子見父譬但欲作三品善根次故一處合頌也釋借問貧里欲住傭作既略冷水灑面譬則借問貧里是二乘機欲扣佛説除糞譬也釋何用衣食使我至此從向國城舍皆是求衣食故來因求衣食遂為王所捉此欲明非求衣食之處故不應來此耳求衣食即是求小乘為大教所局欲明大教非求小果之處不信我言不信是父此頌誘引還鄉譬長行中直明隱實教起權教隱實身起化身今偈欲釋長行宜分為二初明無實身實教二機第二明權身權教兩化不信我言者不信華嚴實教也不信是父者不信舍那實身也更遣餘人已下第二起權教權身初頌起權教長者於窗牖第二起權身二文亦各三初文三者一知機二説教三信受次文三者一知機二現身三説教文易解也塗足油者外得使令即五通也飯食為飽薦席為𤏙三學即內德也即內外事圓長者有智然長者不自知家事復有不失鄉子亦不令知家業事而令失鄉子知家事者蓋是有智計也又上就小乘中五種密令因小悟大已得遠悟今更就大乘中復作五種密語乃至二種陶練小志遂移大機成就故有智佛亦如是已下頌合譬即轉勢説法開之為二初明頓化不得第二明漸化得頓化不得即是華嚴初偈文是也就漸化中開為三別初明小乘化次明大乘化後明一乘化初是密中密次是密中顯後是顯中顯又初二教為方便後一正化得之佛敕我等已下第二大乘化於中有二初明昔密化次辨昔不得顯化各分為二初章二者一明自化二明他化自化中有二初合父付財二合子受付合父付為二初合付財二合密化初有半偈合付財最上道者嘆般若是十方三世諸佛法身父母修習成佛者第二合密化辨般若教宗也般若正以成佛為宗問曰何故作此語答曰有二義一密化失鄉子般若正以成佛為宗今令汝説之即是令汝作佛也二化不失鄉子令修習成佛也余見南北諸師互布抑揚深用嘆息南方諸德用四五時及北土四五宗者皆毀般若而歎法華晚弘智度論師多毀法華而歎般若皆失經旨也今責四時之流若般若必非究竟則一切皆破何者如長者宅內一切珍寶皆付窮子即是以般若付聲聞若般若定非究竟則長者宅內物皆非好物又長者亦非好長者又將不好物與子又令子以不好物教他此有四失也五者付財時物猶是委家物耳付財物既非好物則委家物亦非好物則般若法華一切皆破也又二乘非究竟令説般若即以究竟破不究竟若般若遂不究竟則將不究竟破不究竟也今所明者般若法華更無有異而有二法者為不失鄉直往菩薩説名為般若為失鄉回小入大菩薩説名為法華約為人不同而理無二問曰出何文答曰出此經譬喻如云為諸聲聞説大乘經名妙法蓮華即法華正教聲聞也又云我承佛教為大菩薩智度論云為彌勒菩薩行故説般若又云般若不囑佛不囑二乘但屬菩薩此明般若教菩薩也問曰何故法華為二乘般若為菩薩答曰般若明二道般若道方便道此二是十方佛父母十方佛從此而生菩薩將欲作佛故般若教菩薩也法華開三顯一令捨二歸一故正教二乘也又講聽人心粗但言前説般若後説法華只前説般若即是説法華後説法華即説般若以前財後財猶是一財般若亦是大慧法華亦大慧有何異耶問曰法華開權般若未開權云何是一耶答曰法華開權是般若方便之用耳豈離般若耶但般若時為二乘大根未熟故未得開般若方便之用但説般若之實以此異法華耳為大菩薩大菩薩即彌勒十地人而令極小之人為十地説者欲以聲聞説代佛意欲令其成佛所以然者唯佛一人得為十地菩薩説耳聲聞既為十地人説當知代佛意欲令成佛也但為菩薩而不為我説斯真要者結教旨歸正教菩薩作佛爾時二乘人未堪聞即顯般若獨屬菩薩不通屬二乘也釋一切諸佛祕藏北土人云般若是不真宗南方人云般若未開權故未堪實今文云但為菩薩演其實事又云説斯真要斯真要破北土不真宗演其實事破南方未顯實也問曰下明二乘亦得不生不滅與菩薩何異答曰二乘壞生得不生亦壞不生得生故以壞生得不生故是生滅觀為除糞人菩薩知生宛然即不生不生宛然而生遊刃不傷皮宍也我等若聞淨佛已下第二頌他教即陶練小心就文亦二前用大行陶練而封執小行不求大行我等長夜於佛智慧已下第二明大果陶練而封執小果不受大果我等雖為已下第二章明昔不得顯教於大就文亦二初明為他説大而自不求大導師見捨已下第二明佛昔知大機未熟不勸求大初是自不求大次他不教求大也如富長者已下頌一乘化得即頌委屬家業譬問曰初窮子見父大宅財物疾走而去次領知財物後得財歡喜此三何異答曰初是華嚴事大機未熟故背大趣小次是大品事受命而説後是法華事故得悟歡喜問曰乃知三時不同財物何異答曰財無異也初見財而怖次領受於財後得財歡喜雖有三時而財無異若爾華嚴般若法華三教亦無有異但約教化與不化及顯密不同故有三經差別化不化者華嚴但顯教菩薩不密化二乘般若顯教菩薩密化二乘法華顯教菩薩顯教二乘故又初大機未熟如怖走次遠熟如領財三正熟如得財但約機不同教無異也問曰今文頌付財陶練小心及委家業有何異耶答嘆菩薩早聞大乘早得領悟二乘之人雖早聞大乘而不捨小不取大故是癡迷又欲明三大乘無異初聞怖走次聞不知取三聞方取蓋毀二乘之鄙劣也嘆菩薩初聞即便取之又二乘薄福鈍根具待四種調柔方捨小取大菩薩福德利根不須四調即便取大又四大聲聞欲化諸未悟令初聞即信勿經三時又我昔親説大而不取大後方取之者餘聲聞昔不取大以同我迷今聞法華若不取大則是迷中迷不可化也釋得道得果得者無正觀也果者實相境也於無漏法釋果也得清淨眼釋道也此偈辨得大乘解持戒已下明行以外為正故前明之解行為因梵行是果涅槃故前二為因後一為果又前二德無不圓後一纍無不盡問曰下明二恩何異答曰神通恩是隱實身而起化身説法恩謂隱實教而起權教也
