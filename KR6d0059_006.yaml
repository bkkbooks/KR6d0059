body:
  text: 胡吉藏撰五百弟子授記品問下根人云何得悟答曰此經雖三周說法大宗終是開權顯實下根人悟於權實入佛知見故得佛記今更以五門辨於權實一開合門二有無門三生滅無生滅門四實不實門五邪正門開合門者今品正就涅槃權實以二乘人正保執涅槃故須斥之昔教明三乘人同一涅槃同度一生死故前云佛說一解脫義我等亦得此法到於涅槃此是合義故名為權今教辨開義開者明三乘人二生死二涅槃二乘人度分段生死一乘度變易生死二乘人分段外有涅槃大乘佛變易外有涅槃故昔合為權今開為實有無門者昔日四種有無皆是方便言四種者涅槃中有無生死中有無涅槃中有無者唯有一涅槃也所言無者更無大涅槃唯有一生死為有更無生死為無故此四有無皆是方便今亦就涅槃中論有無則番昔唯有大涅槃無有小涅槃實有無二生死無有一生死也次生滅無生滅門明權實者二乘涅槃是生滅義故是權今日涅槃是無生滅故實二乘是生滅者有分段四住生滅此二種得於涅槃名之為滅故四諦中苦集相生滅道還滅此是權教今明五住二死本自不生今亦無滅無生無滅即是涅槃即是度二生死名無生滅教稱為實也次別就今教明生死涅槃實不實門凡有四種一者以二乘度分段立涅槃此是權今度立涅槃此是實此一往今昔權實對二乘用也二生死涅槃皆是權非生死非涅槃名實所以立此一位者有三意一義權本有生死可有涅槃竟未曾有生死何有涅槃又至涅槃時無復生死云何有涅槃如薪無故不得有火二釋經華嚴云生死及涅槃二俱不可得又云生死非雜亂涅槃非寂靜三者斥病惑者但云小涅槃如化城謂大涅槃是實城者昔為著生死故說涅槃明小涅槃今為拔小見故說大耳云何捨小更封大三者生死涅槃為二非生死非涅槃是非二二與不二皆是方便非二不二方名為實所以有此者為著中道也聞前生死涅槃是二邊非生死非涅槃是中道捨二邊而著中道經云遠離二邊不著中道亦應云大聖說中道為離於偏故若復見有中諸佛所不化故二不二皆是方便非二非不二方便真實四明上來四句皆是方便離四句方是真實故下經云諸法寂滅相不可以言宣也問此四句權實的出何文答曰但令對病散釋衆經二事便足何須問文必欲出者中論觀法品彼云為下根人明生死不實涅槃實也為中根人生死涅槃皆不實非生死涅槃是實也三為上根俱泯前二故云非實非不實論云此四句皆是門為通絶四之理方是實前四皆不實此是龍樹自作勿不依之次破邪門釋法華唯有三師光宅云壽量佛終歸無餘即是化城故壽量佛終以化城為涅槃又終是化城竟無寶所又終是化城終無度二百此說大悲次云䨱相明常前顯了開權明化城是方便何故䨱相於辨寶處為真實此是開門顯了示像隱䨱自於害也既不得顯示其像何事廣開於門既廣開門何事䨱於像又經分明辨二乘度三百分明辨佛度二百分明辨小涅槃是化大涅槃非化何乃云隱䨱耶次明此經辨佛是常具得開二生死二涅槃但謂二死決定無名斷見涅槃定有是常見故中論成壞品云涅槃時滅生死相續是則為斷滅又此但得今四方便因中之一支因耳用尚未圓何猶得體無體何有用故一切失也今五百弟子學無學人得如此了悟與佛悟同故得佛記問曰既得此悟即應是佛答曰本不可知據迹而言初回小入大是初心佛也釋繫珠喻初先敘師三說次敘弟子三領師三說者初周略說次周處中中說後周廣說三說不同為三根故利根須略中下根廣說亦爾轉勢說法故有三種不同初周略說者始自法身照機次有根本法輪枝末及攝末歸本即起三輪化故從華嚴竟法華也次周處中說者亦辨自法身照機次起三輪之化長明三一不虗及初為父子故云此諸子等生育甚難乃至先因遊戲來入此宅故名處中說第三周廣明三世及以三時三時者過去初結緣時中途流浪乃至得羅漢時後至靈山為說法華得了悟時也弟子三領者初領略說作略說解次領處中說作處中領解後領廣說作廣說領解身子兩義故一人略但敘己身二時略謂從鹿薗已去竟於法華也次四大聲聞人法俱處中人則四大聲聞法則從過去失鄉竟今委囑家業後周俱廣人則五百法具三時一聞大法時二中途忘大取小時三捨小悟大時也利根難得故有一人中根稍多有四大聲聞下根無數略陳五百也次合三周作法譬二說初周法說次兩周並是譬說三領亦然身子作法說而領悟二作譬說而領也又三周為二初二周作父教子義後周作兄教弟喻三根聲聞為十六沙彌竝共受大通智勝佛學故俱是法子十六先悟如兄三根聲聞後學如弟此是大通智勝他也現在猶存兄弟故作導師徒侶之喻故三周唯有父兄二說三周亦唯有子弟二領初二周作子領父說次周作弟領兄說也釋繫珠譬先敘大意明貧窮弟者敘凡夫過也忘珠困苦者鄣二乘失也故知凡滯有為過二乘沈空亦惑也初明繫珠者為菩薩時利物也後明示珠者成佛道益物也故有凡聖兩迷佛菩薩之二益示珠者破凡迷排聖惑令悟中道直登一極理也讚歎珠者勸一切衆生發菩提心一句染神歷劫不朽也設酒譬者敘始終迷悟欣憂不同凡有三譬初繫珠二忘珠三示珠如疏今就三譬各二初二者第一說教譬二繫珠譬中二者一忘大乘譬二取小譬後二者一親友會遇譬二示珠譬初說教譬中三句第一至親友家謂稟教譬珠之一字是說教譬從醉已下第三明迷教譬酒正喻法華教所以因酒喻法華教者正道絶名無名相中佛欲令人悟解故上來種種名字說之序品文殊借大雨及䗍鼓喻之初周中直名妙法蓮華第二周中三種名字初名機案次一門次大車機案是父身所憑足之所履欲以父物出子不得即是用佛道化物不得也次作一門而復狹少喻至理微妙虗通如門不容一豪斷常如狹少是三世佛所乘故名大車第三周中對化城故名寶所寶所即是寶城顯二乘位處是化城如涅槃中亦明真化故云汝今值此正法寶城云何取此虗僞物也三周領解中名字者身子云開佛柔濡音演暢清淨法即是妙法蓮華不為諸垢所染名為清淨第二周中名為傍人喚子不得如大乘化不從人有示悟教令之功如大法有詮理化人之用其後種種名字謂向本國至城到舍住門見父其家業珠寶至理是衆生舊居本國防斷常邪非為城可以栖神為舍至妙虗通為門中道能生正觀為父可貴重珍寶今第三周作酒名者約教而言正喻觀樂兄弟共聚必共作樂說法華經既明盡理之法暢衆聖心故化主樂也衆生聞教現在得記未來成佛心大歡喜如身子之流又方便品云是等聞得佛大喜充遍身二者酒能益體如教長養法身也三酒能治病喻此經能破凡夫二乘及菩薩病四酒能宣藥如教能詮理也次約緣亦有四義一初飲酒未醉時二大醉時三小醒時四大醒時三根聲聞始終亦有四時一逸去初聞經發菩提心如未醉時次忘菩提心流浪生死如大醉時三發小心行小行如小醒起行時四為說法華得悟解如大醒時問膳喻何物答曰若酒膳合設令其飽溫酒為禮主喻教令發菩提心膳喻令修菩薩行也若偈中明酒長行辦膳如信解中初老弊使人後作塗足油者即是轉譬並喻教也一者富貴兄設弟百味暢於兄心則兄樂也二飢人得百味美食必大喜樂聞法華亦然三者食長養身命法華教長養法身慧命四食能治飢渴苦如教能破一切惑是時親友官事當行者第二繫珠譬前教今譬說教令譬受解即令發菩提心也又三初明繫珠意以無價寶下第二正繫珠與之而去下第三明感盡應息官事當行者初繫珠意也私事可住官事必行一他土機熟不得不去者其人醉臥即是起迷鄣聖謂感應息也酒喻教珠喻菩提心珠有五義一菩提心是中道種子故圓正如珠二辨無價之得市當樂佛果三珠不可朽滅如菩提心種子不可滅四可寶重如華嚴云菩提心寶一切寶中最上五正取繫著內衣裏喻以菩提心種子在衆生心內天親論明一切種子皆在梨耶識中問為是繫罷醉為是醉罷繫若醉罷繫則醉無所知云何得發菩提心此乃得文而害義若繫罷方醉發菩提心竟然後起迷此釋得義而違譬文答曰他曰醉竟方繫衆生有無明煩惱如醉今其發菩提心如繫此不成喻其醉臥一無所知云何得發菩提心耶今明繫竟方醉初設酒時即是已繫珠初設法華時已令發心今明醉臥不覺知時繫者欲顯菩提心種子不朽滅義若初設酒即辨繫珠者不得顯不朽滅今欲明後起迷亦有菩提種子不失故就鴆臥時繫問以何文證繫忘後醉答曰余久久方見文合譬中先明發菩提心後辨廢忘文甚分明問何故說繫珠譬答曰欲勸一切衆生聽法華發菩提心若一發心則永不朽滅復還得續發菩提心也二欲斥二乘人心內自有真實而不知求身外之僞珍即令捨二乘見其人醉臥都不覺知第二忘大取小譬即為二別初明忘大起已遊行謂取小如疏也是時親友下第三示珠譬亦二初明會遇相見二辨示珠會遇者小志移大機熟感應相稱也會遇見者求衣食時已是見佛既求二乘是貪財人非是兄弟如信解中客作也得悟一乘始是兄弟故名親友相見如信解得悟故名父子咄哉下第二示珠為二初呵取小次令求大丈夫不應求衣食如菩薩不應取二乘也我昔已下第二令求大還敘三時初敘過去兄弟相見與珠時而汝不知下明中途忘失時即不知是忘大勤苦下取小也汝今可以下第三示大時也學無學人授記品釋三周文各異初周有授記有領解文少故不立品次周俱有二事以文多俱有二品三周亦有亦無有授記文多故立二品有領解文少故不立品次論前後前二周先領解次授記以其利根故解心明淨故即與記後示鈍根雖復聞法解心猶昧待得記竟解方明了決故方述解也次論有無前二周皆有述成三周無者前二述成為欲與記故有之也第三已授記竟故無述成也三周授記異者初直授記不論總別故不立品次明四大聲聞同是無學以人同立一品第三周中以人異故立於異同故品前五百同是無學同有領解現在同皆得記未來同皆成佛故同立品次同有學無學同無領解同得記同成佛故同立一品前分二人初是變化次是退菩提心二權實不同三有述解不述解不同四默念述解不述解不同五願行有別故立二人後兩人者阿難羅云權行二千人是實行前二人願行同次二千人願行同前是顯名次是密行初二人前後得記前後成佛二千人同時得記同時成佛前是佛眷屬後非佛親屬故分二人對上品者上無學中初權人次實人今亦初權後實欲攝一切聲聞得記盡也亦應分者同餘權實二人也又我下超異諸人也但同衆人尚應得記況復異也唯有如來我所歸者意在求佛示迹為聲聞顯述解也釋學無學人於空王佛所發心因此明縮觀義智度論云菩薩行性空佛行畢竟空畢竟空是空王性空者一切法自性是空橫論生死涅槃等萬法及竪論有無等四句皆是無自性無自性則無物無物故名為空畢竟空者佛了達橫竪畢竟清淨名畢竟空故畢竟是無遺餘之名宜約於佛菩薩雖習畢竟空觀但照猶未盡但有性空之稱也彼佛得此畢竟空觀因以為名故云空王佛也釋迦與阿難亦初習畢竟空觀故名初發心則初後不二但初習畢竟空破有所得難後去則易其猶破竹初節也大品云從初發心則行無所得無所得者不得一切法謂橫竪一切法皆不可得名不可得華嚴云初發心時則是佛心故亦是此意問曰畢竟空云何乃是發菩提心答曰一切法不生彼若則生不發一切諸心即是發心佛若發生死涅槃有無四句內外一豪心則佛心不發也我常勤精進故得佛阿難樂多聞故後成佛者良以釋迦常勤習畢竟空故先成佛阿難樂多聞不勤習一觀故後成佛也問曰云何勤習答曰寄南北三師明習觀成佛義長安二攝論師一云聞薰習滅二云滅次江南亦滅不滅金剛心無常實法義自滅假名相續轉金剛作佛是故不滅前二互淨復與第三諍第三與前二諍以三各諍各相破俱不成也又互執則互起愛見於自起愛於他起瞋無明常在其中具足三毒是煩惱因緣煩惱因緣惑起業因業受諸苦執如來懸見末世有此三執初是無見次是有見後亦有亦無見故楞伽經記龍樹菩薩云南天大國中有龍樹菩薩為人說大乘能破有無見往生安養國今檢中論文具破三家義一明因滅失於前誰生於果二明因不滅失則因至果名常亦不生果若轉因至作果復有失滅義者則一法有兩體若是一因體者滅則無可作果不得言滅令遂有滅復有轉作則成二體者一十地滅復有一十地轉作佛也故三法不成云何有佛問曰今云何得作佛耶答曰亦見有三家義故成有所得故不得佛正以求三義不可得脫一切有所得蕭然無寄即是佛也又原此三家心路根本謂有八妄想八顛倒而後習無生觀除之故顛倒漸滅觀門漸生故諍此觀行有滅不滅亦滅不滅今更足一家乃至滅非不滅蓋是四宗病原也中論顛倒品云正破此病今且示之法師品兩義明流通一者上三周明妙道三根人已悟今令其悟二世未悟衆生前即是令發菩提心今令修菩薩行二者上與其淨土成佛記夫得清淨土者要由自他心俱淨土已得自淨自淨者火宅破凡夫心信解破二乘心藥草破菩薩心故自心今還以悟他亦令他淨故徒衆淨自淨故化主淨故感國五淨教門所以得淨土成佛也二令諸菩薩及一切凡夫弘通法華亦得四淨也上弘大法下為物師即上弘下化名為法師即具四淨故得淨土也因藥王者藥王稟法華得悟捨身命財弘通利物以報佛及法華恩今八萬人亦爾今三根聲聞亦爾次別四衆三乘人云聞此經一偈皆與授記者三義故來一者令八萬人及三根聲聞弘經也以聞經一偈即得記成佛有斯大利八萬及三根一切凡夫豈不努力弘經二者即是勸一切衆生聽法之義聞一偈既得記成佛寧得不聽法華耶三者上但授聲聞記今欲並授一切聞經人記故說此言佛滅度後弟子文來亦具三義如向釋也又上來但授三根記今授一切聽法人記者欲明一切得佛記佛語無二則一切人皆成佛無疑即是欲顯唯有一無二也問曰聞經得記不聞不得記何得云一切衆生皆成佛耶答曰一切雖有佛性正因要由聞經發菩提心緣由因故得成佛也問曰一念隨喜云何得記答曰隨順此妙妙既絶四句超百非言忘慮寂心亦順如此妙則與妙相應妙即是佛乘與佛乘相應故得佛記也問曰何故明佛滅度後弟子答曰舉佛滅後弟子令八萬大士及三根聲聞化之又聞經一偈即得佛記佛滅後弟子聞此利益努力持經問曰何故明二世法師答曰二世弘經有大利益故令法師努力弘經也問曰云何於此經卷敬如佛耶答曰經詮於妙所詮之理既妙能詮之文亦妙妙理既是佛文妙文亦是佛故敬如佛又所詮之理是妙妙既絶能詮之文妙能詮之文亦絶故天女云既知解脫無言宜知言即解脫所詮之理妙妙絶四句斷百非是法身能詮之文亦絶四句百非亦是法身故敬經如法身佛亦即法身佛也問曰此法用何心供養經答曰既體悟妙道得於妙觀因此妙心設於妙供養即餘經論中行法供養也若以凡夫二乘有所得不淨心則不名供妙法也問曰此人何故供養十萬億耶答曰十萬億佛所習此妙觀故能敬妙道未來成佛者以行妙因故未來得妙果也次供養者既得妙觀即是妙因宜應供也下明願生者得妙觀受妙生而生粗處當知是願生也下明說一句者不煩一句但說妙字泯寂諸邊發生正觀也釋毀持經人罪重義問曰云何罵讀誦法華人罪重佛耶答曰帶法罵人故罪重佛如人正讀經忽有人罵云癡人何用讀此經為此言中帶法罵人故罪重也問曰若爾佛正說法華者人罵佛癡何用說此法耶亦是帶法罵佛此罪大重何故云輕答曰帶毀法罵人人聞廢自行不成佛濟度化他他不成佛故罪重雖復毀佛佛聞毀譽不動不廢自行化他故罪輕也智度論云巧罵婆羅門以五百曲罵佛佛無憂色其見佛不憂更轉前五百曲罵作五百曲嘆佛如來無喜色故不妨自行化他問曰何故明罪福答曰欲遮法師之失誡前人之惡故明罪欲與法師之樂觀前人行善故明福次一長行一偈歎人所弘法亦前嘆弟子今歎於師以法為師故法為和上人為弟子也釋已說今說當說法華最難信難解法華最深極廣故難信難解極廣者如上所明總攝十方三世佛三輪及釋迦一化三輪也窮深者不一不二之非權非實言忘慮絶又此經多就祕密門說之故難信解諸師講此經多迷余自眼所見自耳所聞未曾有人如此釋也釋全身在塔中光宅云謂佛無常磨滅但有碎身耳䨱相常者䨱相全身亦不可見故塔內不見全身也執常見者塔內但觀常見衆生何處有法身耶今明此經辨佛無生滅壽無始終故有全身既無生滅亦非斷常豈是常見以衣䨱既行妙理與理相應則為理攝名䨱與理相應與佛相應為佛護念同栖一理是實知宿同入生死是權知宿既同佛權實是佛真子為佛摩頂也釋未善行菩薩道破三乘中菩薩聲聞般若等大乘復言有二乘作小大二解則未識道道豈二哉以未識道何猶解行道耶善行道者精識道體未曾三一因有三一故能行道也釋高原譬問曰此與上善行不善行何異答曰善行據始近道約終故異也又上破三乘中大乘菩薩未解權實則無二智故不善行今破一乘中未生三慧及有所得菩薩也問曰此品中行故數破菩薩答曰上三周已破聲聞成菩薩恐墮有所得大乘菩薩復恐墮有所得一乘菩薩故破之此經正明教菩薩法令菩薩不起凡夫二乘亦不起大小見亦捨三一見也問曰云何是高原求水答曰今以三義釋之一就二乘釋二約大乘釋三約一乘釋就二乘釋者有人渴乏須水者水喻佛性即是一乘理理絶四句百非窮盡深妙如在高原下也又高原喻教教下有理如水也渴乏須水者一心求見佛性佛性顯成法身也今於二乘教中求佛去佛性遠如於高原求水故大品云於聲聞經中求薩婆若名不點也今毗曇成實中用此求佛即其事也二用三乘中大乘教求佛去佛亦遠三乘中大乘即是法華但為爾時未廢二乘始行菩薩作三乘異解不識一道何由近道故作有所得大乘解故佛道遠也三者一乘中未生三慧人去佛道亦遠令明此經乘絶三一車非大小道無近遠方便一往用一破三假遠斥近如此始是聞故從聞生慧乃至思修故去佛近也問尋高原始終是一原而有去水遠近則始終是法華教去佛道遠近於教未生三慧為遠生三慧為近則但於法華近遠何得對餘經耶答曰於一乘經不生三慧尚去佛遠況復餘經具含諸意釋開方便門一往以三為方便一為真實乃至四重作之近遠亦四重也釋無人能到天魔是毒蟲外道為惡鬼二乘在門外三乘中大乘菩薩執大小異並不能到也又如上方便品九人不到唯佛能到也菩薩驚疑怖畏者若明低頭舉手之善皆成佛者何所驚疑令明此經窮深極大如向不一不三乃至五句其心依倚無有處所故驚疑耳二乘亦爾若定有一破三破三歸一有一可歸者二乘亦不拒逆良由退捨二乘進不著一蹤迹不可尋求故驚疑耳釋坐如來座夫論不忍者見有衆生及有自心故爾依正觀五求衆生不得五求心不得何處不忍耶問曰何人總菩薩耶答曰法華經破上七人來總菩薩也見寶塔品此品來意義非一途若三分明者初辨乘權乘實次明身權身實此經文雖七卷宗歸一乘但一乘有二謂能乘人及所乘之法具能乘所乘乘義乃備乘權乘實明所乘之法身權身實辨能乘之人然正道未曾人法無名於中為衆生故假名相說故作人法之名欲令衆生因此名相悟無名於前章已明所乘之法竟令次辨能乘之人問曰何故先明所乘法後辨能乘人答曰所乘之法即是教能乘人謂化主但教正被緣緣稟三乘之教遂生對執故破於三病明三是方便法一乘是真實法辨教既竟次論教主故明身權身實又乘權實中此是自病身權實中謂迷他病自病者自非究竟謂是究竟他病者迷佛真應兩身自病為切故先破之他病賖緩故後破之又說身權實者為成乘權實也若能乘之人身者有生滅壽有始終者則一乘義不成以一乘即是法身法身既生滅始終一乘亦生滅始終則與二乘同何名一極又昔教明二乘人今教又是二乘即破十方三世佛一乘根本教既無一乘亦無二乘則破權實世出世一切法也今明二乘自生滅始終一乘則無生滅始終故與二乘為異又見塔品正破執法華經佛是無常者以佛見未來有人謂此經明佛是生滅無常故多寶涌現明法身不生滅故常住也下明開塔為破䨱相常者開塔了了見多寶不滅則悟法身亦然問曰若爾則同半滿明佛是常答曰上來已設多寶所以現者為對無常病故說常耳無常病消常藥亦廢故不同半滿也又正道未曾常無常亦非常無常作無常方便即釋迦是也今非常無常作常方便謂多寶是欲令因此常無常悟法身非常無常未曾釋迦亦非多寶又約緣故來者明乘權實正破二乘令二乘回小入大故經云為聲聞說是法華經三根聲聞並皆得記今說身之權實為諸菩薩令菩薩修因趣果問曰為何等菩薩答曰從此去竟經有二種菩薩一三根是回小入大菩薩二直往菩薩此之二人聞身權實並皆得悟故分別功德品明十二種菩薩利益問曰前章亦為菩薩不答曰傍為也故經云菩薩聞是法疑網皆已除菩薩無自保究竟之病不生為菩薩也問曰後段亦應有為聲聞答曰後文無復聲聞故法師品云聞法華經一偈一句一念隨喜皆與授記問云何是身權實耶答曰如三種法輪一者雙說二者雙䨱三者雙開發說者十方三世佛為大事因緣故出現於世謂說身無生滅壽無始終為令一切衆生捨生滅身始終之壽即是逼引教門令起欣厭之觀說法身無生滅壽無始終令物欣之辨生滅身始終壽便物厭之此謂十方三世佛出世大意但為衆生不堪聞無生滅身無始終壽故䨱實身實壽說生滅之身始終之壽所以雙䨱明為欲同物故所以須同者佛身無生滅壽無始終衆生身有生滅壽有始終何由猶得與物同今先與物同然後令物同聖身身亦有生滅始終既修道成聖衆生亦然喻如同前外道然後方得返之但執教之流更謂佛身實有生滅壽有始終不識如來真實身壽於佛身起輕劣想不求佛道是故雙開明生滅身是方便無生滅身是真實壽亦然也始終是方便無始終是真實是雙開又前用生滅身壽始終調柔其心然後始得真實身壽也此是十方三世根本身壽支末身壽攝末歸本身壽十方既爾釋迦亦然但約一期凡有三種一約時初成道為大菩薩說根本身壽次為凡夫二乘小行菩薩八相成道說支末身壽至靈山還說根本身壽二者其間不定為二乘自說支末為菩薩說根本三言一時之中隨所聞見如上祕密法輪二乘自聞支末菩薩自聞根本釋迦既有此三十方諸佛亦爾也問曰為菩薩說無生滅身為二乘說生滅身此事可明昔亦得為二乘說無生滅身不答曰昔為二乘說大乘令密捨小得大為二乘說法身亦令密捨求佛身也問曰昔既得說法身無生滅亦得說壽無始終答曰若辨法身無生滅即非三世故無始終二乘亦得聞也若如壽量品明久已成佛則昔未說也問曰華嚴之會說無生滅始終何佛說之釋迦亦爾答曰若論教主則不定且據華嚴分二佛二土二教二徒衆者華嚴是盧舍那佛說法身無生滅始終梵網經明華葉釋迦往舍那聽法後還七處八會說之則是釋迦說也若為二乘人者一化始終但是丈六釋迦說一切教菩薩隨所見而說也問曰分二身二土但初成道有華嚴後去亦有耶答曰菩薩所見乃至未有釋迦及釋迦已滅常有淨土舍那教門徒衆故祇桓時有華嚴事像法決疑經云或見我今夜涅槃或見我為報佛百千釋迦圍繞乃至此經明淨土不毀須總相知不可具敘也就此章大開為二初明身權身實次辨流通前乘權實義亦如是初明身權實即是智慧次辨流通敘其功德初是辨果次明其因二門各四初門四者一辨寶塔涌現二明現塔之意三者開塔四兩佛竝坐初章總有十句大分二別九句敘塔之形一句明佛出聲九句中復二初八句正明塔現次句敘天龍供養八句即為八義爾時者明塔涌現時乘權乘實中云所以未曾說說時未至故今正是其時決定說大乘身權身實義亦如是自昔乃至經之初分並得說今是說時故出現也佛者第二句多寶所以現者為開釋迦佛法身佛不生滅方便生滅故明佛也前者第三句敘出方即是上於諸菩薩中正直捨方便但說無上道今欲於佛前捨生滅方便說無生滅真實也有七寶塔第四句敘塔名所以多寶塔現者上乘權實以人開法故以釋迦之人開二乘為方便一乘為真實今以人開人故以多寶之人開釋迦之身權實所以用人開人者明古佛既其不滅今佛豈是滅耶又已謝之身既其不滅當滅之佛豈是滅耶又眼見已滅之佛既其不滅耳開釋迦當滅寧是滅耶是故舉塔又上乘權實名為自開以釋迦昔自於一說三故還自開三顯一今是他開要須前敘他佛不滅為證然後釋迦順同故明他又上是說法輪今是神通輪開二章皆得互現也高五百由旬廣二百五十者敘塔形量也未深見旨聊擬儀之大車之中有其高廣大車即是寶塔車為所乘人為能乘塔為所住人為能住故經云佛自住大乘但隨義立名故有車有塔車中之高對凡夫之下辨廣形二乘之小今亦然矣高出凡夫四生之外故云五百是故不生橫超二死之表稱二百五十名為不滅即序中四趣無以攝其生二死無以化其體明法身不生滅也又高出四句之表故云五百龍樹云如來在世時不言有與無亦有及亦無非有與非無佛滅後亦有此四句可例之多寶之亡道超四句釋迦之存義亦如是廣二百五十者前明超四句之外今序出百非之表初釋影經後意依論從地涌出疏中已辨一示涅槃之體本自有之故或裂而現二昔生滅之教䨱無生之身今廢生滅方便無生之身便顯三衆生心垢之地鄣寶相之身故不得說垢纍將傾便得聞教也住在空中明塔出處寶塔所以升空者欲明法身栖實相土即土照權實義土權實者此品明三身三土三身者多寶表法身分身謂應身釋迦為化身三土者法身住實相土應身居寶玉之淨化身處土沙之穢實相土是實餘二是方便今欲令捨淨穢二悟非淨穢不二故多寶爾實於土也種種寶物而莊挍之此明塔莊嚴具准大車高廣敘超凡超聖明纍無不盡今謂德無不圓五千欄楯者例大車中即力無畏十力內照如欄無畏外用為楯龕室千萬者例嘆長者德中多有田宅即是慈悲蔭䨱於物故稱龕室遍遮衆苦普與物樂故言千萬即大車白牛義也無數幢幡即大車中張設幰蓋謂智慧力智慧高顯如幢又摧邪顯正下利上弘並是慧力故如幢也七辨巧說回轉適悅如幡八音美妙故稱瓔珞寶鈴萬億而懸其上者即大車中四面懸鈴謂佛有大神力覺悟一切也四面出香者淨名中以戒品為塗香配此文不便依無量義大莊嚴王菩薩嘆佛道風德香薰一切此既結句當知圓德內充外勳一切使無德者同佛旃檀其諸幡蓋者上來別敘諸德今歎一一德皆攝一切德也高至四天王宮明塔所至處唯是法身乃窮常樂我淨四德之理無常苦四事為生死之下常樂我常四德是法身之高故普賢觀云毗盧遮那住常寂光土常波羅蜜所攝成處我波羅蜜所安立處淨波羅蜜滅有相處樂波羅蜜離身心相處普賢觀還論法華及多寶事故用彼釋此三千三天下自上八章稱嘆法身此下明因崇於果謂三十心人以十地諸菩薩等崇仰果德爾時寶塔中第二明塔出聲敘出聲有二初嘆印於法成乘權乘實使未信者信已信者逾明二顯法身不滅開身權身實義也爾時四衆第二明塔現意總現意略有三種一寶塔升空謂明一實相土歎印於法辨唯有一法多寶發聲明唯有一人所以顯此三者欲合一切衆生同住一實相土同乘一乘法同成能乘人無復九道處無復九道法亦無九道人即是上文一相一味常寂滅相就文為二初段問次佛答問中先大衆疑次興問皆得法喜者既是法身相出資衆會令悟法身故得法喜大樂說者衆生大樂機欲將發菩薩知之仍為興問名大樂說佛答中亦二初開兩章門次發釋二門兩章門者一寶塔二全身乃往過去釋二章門為二初正釋二章門次明涌現意意有二初通明十方涌現次別明釋迦佛所涌現敘多寶於十方世界出現者欲遍十方諸佛土權實法權實身權實也以遍開十方佛三種權實則正無不顯遍彼十方諸佛稟三種權實之迷謂邪無不摧又遍開十方三種權實即上無不弘遍破十方三種之迷下無不利多寶為益不可勝言普賢觀經禮十方佛竟別禮多寶重罪鄣今塔涌出以此推之知有重益問何故敘多寶十方涌現答既開三種權實恐物驚憚謂多寶化偏故明十方道同故此會生信也次明今日涌現意正破釋迦緣迷開釋迦三權實也問曰具開十方及釋迦三權實以何為正也答身權實為正也釋普集分身而所乘之法唯有於三謂二乘及佛乘能乘之人亦有三人即是三佛多寶是法身之相為法身佛分身在淨土中化諸菩薩謂應身佛釋迦居穢國謂化身佛所乘法中亦有三種一者用一破二故經云唯此一事實餘二非真二借二破三故經文尚無緣覺之第二寧有聲聞之第三三者用權破實故經云三是方便非真實也然所乘法中既具三義能乘之人亦具三義一用一破二唯法身是實餘二身非真金光明云唯法身是實餘二身是假名有非真實也二者用二破三明淨土應身尚皆非實穢土丈六寧是實也故此經敘分身佛皆云是化則知釋迦是化中之化故非真也三者用權破實唯有一乘方便說三故三非真今亦爾唯有法身是其真實方便說三故三非真實次將身例土亦有三義一用一斥二唯一實相土是真淨之與穢皆是方便二借二破二十方淨土之佛既其是化所栖淨土寧是真耶十方淨土尚其非真釋迦穢國寧是實耶三者用權破實唯是一土故方便說三故三非真實問曰三身三乘既有根本支末攝末歸本土亦得然不答其義亦類根本土尋十方諸佛為欲令衆生住法如中道第一義土故出現於世但衆生未堪栖此土為例情薄者示七寶之淨煩惱重者現土沙之穢所以示淨穢者欲令衆生悟非真淨穢住中道土也問曰何以知分身佛是三身中應耶答此經敘十方分身皆是淨土純有菩薩無有二乘而同性經金光明攝論等皆明應身化菩薩居淨土化身化二乘住穢國也問此經乃明分身是化佛云何是應身答曰斯有深旨淨土妙身望於真佛猶尚是化穢土丈六粗質豈是真耶又應身從法身出化身從應身出應身尚是化而非真化身是化中之化豈是真實問曰攝論云二乘及地前菩薩見化身佛登地已上方見應身今云何二乘普見應身答曰金光明云有四句一者應身非化身謂地前身則知應身位通從地前乃至登地皆有應身今攝論云初地見應身者此明初地已上見真如故應身與真如相應者即是內應身取本有義名法身與如相應始有之義名應身初地已上見此應身也今言分身為應身者此是外應身位通上下今約大小二人故開二身化菩薩為應身化二乘名化身此義後廣論之問曰何故前明多寶後辨分身答曰有二次第一事次第二義次第事次第者前有多寶出次令集分身後明釋迦開塔一義次第者多寶是法身相故前明由法身有應身由應有化如金光明云化身依應身應身依法身法身無所依淨名亦云依無住本立一切法無所依也三土亦次第要由住非淨穢土故能示應身淨土由應身淨土故乘化身故有穢土故文中前明多寶土也問曰何故多寶唯一分身則多答曰多寶示法身相故多寶唯一應身迹用故須多也問曰何故分身多釋迦唯一答曰事中取釋迦當今教主則一有十方分身故多據理之示十方淨土皆是化非真一穢丈六身豈是十方淨土唯明一乘故一乘是實一穢土明三故三是方便問曰亦得應身一化身多以不答曰亦得梵網經盧舍那一身示千百億釋迦此明本一迹多也問曰亦得云分身釋迦是實佛多寶為化不答曰亦得分身實是應身丈六實是化身故名實佛但是法身相故非真佛問曰何故兩佛不明相法身辨於相耶答曰法身絶四句不可示故假相辨之二身可示故不假相辨也土亦爾法身土不可示故寄虗空相辨之二土相顯不寄相辨也次普集分身稱多寶願者多寶有行願二事遍破二病遍開二身行門即是涌出及發聲破無常病及顯法身如上釋願門普集十方分身佛遍破法界謂迹身為實開丈六為方便有行門顯法身願門開應化故以行願二門顯三身壽也問曰何故開塔答曰欲使此土十方義皆分明上雖云多寶開釋迦三權實及十方佛三種權實猶未分明開塔覩形聞聲前義方顯是故開塔問曰何故十方佛及釋迦同開塔答曰欲明說應化兩身同開法身如上說二乘為開一乘問曰何故令釋迦開而不共開答曰多寶分身並為開釋迦也以釋迦之緣稟教謂佛無常及丈六為實故多寶顯釋迦常分身明釋迦丈六非實故令釋迦開即是開釋迦也問曰何故放白豪光召分身答曰前表說中道法今表說中道人並是開人法權實義最顯明如白豪也又前示無漏法今表無漏人也放一光者上明雖有三乘唯一佛乘是實今辨三身唯一法身是實故放一光也反淨者身權既顯則化主淨故教門淨及國土徒衆並淨乘權實中未得四淨故淨名云梵王與身子見土身子見土不淨梵王見淨此明二乘斷常生滅觀不依佛慧不得正觀故不見淨土上來二乘執已破則心淨故見淨土也移天人者今是應身淨土唯菩薩見人天二乘皆不見故移耳此欲分大小化意也無地獄天人者無凡夫愛見心故見淨也此等具愛見故不見淨土故云移之無山海者顯無高下故見平坦土也遣一侍者問訊者正欲開一法身用故將一人來使之也問曰大衆見多寶佛何故嘆未曾有答曰昔聞多寶已謝今見其不滅既覩非常之事故發未曾有嘆也釋二佛共坐多寶開塔出聲則閇塔明常開塔出聲故開塔明常則多寶常義已顯所以顯多寶常者意在顯於釋迦故要之就座又多寶出聲是多寶不滅則成毗盧舍那多寶升空者住常寂滅光土釋迦不滅亦成毗盧舍那升空亦住常寂光土今古二佛既爾一切諸佛類然又法華論二佛竝坐共成大事者謂共開二種權實共破三迷則上弘大道下利群生名為大事接衆生在空者自上已來二佛互相顯並成毗盧舍那同住寂光土此明能化事竟所以明能化者意在為物今日大衆亦成毗盧舍那同住真如土故接之升空若爾者則一切佛及一切衆生同栖一土也以大音聲下第二大段次辨流通亦是明因就文有四此品初命覓持經人提婆一品第二歎於經力成命持經之義第三大衆自誓持經即持品也第四出持經方法即安樂行品就初又二前長行略命次偈廣命長行二意一命持經二發涌出緣由所以命持經者令衆起大願行即是行因故得三權實果也發涌出緣由者前已開身權實今欲開壽權實成上身權實故大音普告令下方聞之又因命持經故他方大士請佛持經止其所請開發涌出緣由故命弘經而言大音普告八方大士及下方菩薩故稱大也又令諸菩薩護持大法得法身果故名大音又因此得開壽量大法故名大音又因此說於遠壽有十二種大益八不思議瑞相故名大音欲以法華付囑有在者寄八方大士護法為法身因唯因果二事故云有在又寄在涌出菩薩得開果壽成於法身故言有在偈為二初頌二佛集意次命持經人所以開此二者凡有兩義頌二佛集以明果勸護法以修因二以高勵下古佛今佛尚為護法故來大衆是當來佛寧不弘護頌二佛集即兩意多寶集中三義初意勸人次意嘆法第三意正為開法身即是教門分身亦三初意勸人次意開法身後意令意令久住者以開法身常名久住也又十方佛集世界清淨衆生見之起奇特想因此持經故法得久住告諸大衆下命持經人四命四釋命弘經者令起大願行弘通利人即是行因得法身果初釋云三佛集當知此意者有兩義三佛即法應化而同集者欲開身權實也恐衆未知云當知此意二者三佛共集為欲弘經須解佛集為弘經意問曰現見弘法華者布滿南北云何難耶答曰略有三人非究竟及䨱相常二人如前所述第三師謂經是常住亦非弘經經是中道非常無常而以常義弘經乃弘於常非中道又是中道家總此總判別三師別約文明者衆人多謂前分明因後章辨果亦非弘經前分實是辨果而謂明因以果為因乃弘因經非弘果也又後果分實顯了明常謂是無常及䨱相明常非弘果經又度三百而立化城度二百立真城則化城居分段之外真城出變易之表不明斯意亦非弘經又十方淨土三世佛集盛開身權實而謂但是命覔弘經之人故非弘法身之經問曰安樂行品不許論說他人好惡長短亦不輕慢諸餘法師今云何敘他過失答曰大品云不說魔事魔罪示道邪正則是衆生大惡知識今欲申明正教破於邪說是慈悲行故無過也十方三世諸佛殷勤稱嘆凡夫毀呰豈不痛哉又若聞究竟之經即受持讀誦生難之想若聞不了之義即起輕劣之心上非圓諸佛下誤群生耶提婆達多品此品來意義有多途依七會明之上辨所乘之法及能乘之人開順權實竟今此一品次開違權實釋迦一期有兄弟二人明違順兩用上已敘其順今以明於違釋迦既爾諸佛亦然問曰云何開違權實耶答曰違順互相開也以順開違者昔明三乘真實故閇方便門隱真實相今明三乘方便故方便門開唯有一乘故真實相顯昔明身有生滅故方便門閇真實相隱今明生滅方便故方便門開身無生滅真實相顯釋迦既爾調達亦然昔為三逆故方便門閇真實相隱今明方便示惡故方便門開實是善人故真實相顯次以違開順者塔品雖明迹身無常本是常住但執情既久取信未明故引調達為例實是極窮善權示極惡釋迦亦然實無生滅權示生滅故以違開順也又涅槃云明具足信義謂信佛常住一實之道調達實不破僧用此為具足信者若但信明一實之道及信法身常住則但信聖人順用猶未信大聖違用故信不具足今欲令信具足故違順雙明又此品接上生者塔品四命持經今三嘆經力成前四命三嘆經力一嘆經成果力嘆成因力三嘆速成因果力故說此品又此品來者聖教無方適機而說或見塔而受悟或說人而得道即根緣次第故有此品來也又上現塔神通門今說法門皆是適機也提婆者天也達多者熱也諸天見其生時知造大罪壞亂佛法心生熱惱故云天熱品開三章一明調達事即嘆經成佛力二文殊智積論義嘆經成因力三龍女嘆經速疾力初章又四一過去世事二會古今明現世事三授記明未來世事四說品利益初章又二前長行次偈頌長行為三初求經二說經三報恩文處易知偈頌三則三初頌求經二頌說經三頌報恩佛告已下明現在世事即是廣述果德皆由值提婆所辨及歎經力明嘆調達欲開違用美經力勸人持經次明授記者小乘法中記調達從地獄出當成辟支號曰骨髓此經記之成天王佛良以非善非惡故能善能惡不大不小大小適機亦非因非果非過去非當體絶百非應形萬用難思議天王佛者因既返常會道果亦同世順真智度論云天王佛即俗人佛也食不須鉢衣異袈裟如天王之治世故云天王佛也二十中劫者毗曇以十小劫為中劫善生經用十九小劫為一中劫次說品利益云不生疑惑者昔明其人造三逆罪今辨弘一乘經恐物驚憚故誡令勿疑信此品得五種果報凡有二義一識大聖智慧善巧違順適機故種智慧業二信窮善之人示為極惡則知大聖慈悲深厚種福德因以具殖二因故得五果報如文所列於時下方第二歎經能成因力上明由經得佛謂成果力今明由經二種菩薩並皆成就謂成因力二種菩薩者一直往二回小入大顯在後文此章七句一智積請多寶還發起論端二釋迦心其所請欲顯經力爾時文殊下第三明文殊從海宮來問曰前不見文殊之去今云何辨來答曰有二義一例如涅槃初明文殊來中途共純陀而去後還與純陀共來今亦爾序品中明文殊來中間或可往化龍去但文略不述今辨還來二者肇公云近不可知者其唯物性乎言動而靜似去而留可以神會不可事求物性尚爾況至人乎問曰上品中已各變八方為淨土無大海山河今云何文殊從海出耶答不體經旨謂是相違今明有其深意欲示淨穢無定出彼兩緣淨緣則見淨如上淨土穢緣見穢故有龍宮如人自見水餓鬼則見火此欲明非淨非穢實相常寂光土義也既明土非淨非穢淨穢出兩緣亦法身非應化應化出兩緣亦得即顯乘無大小大小出兩緣又淨穢有二義一異質異處二異質同處上明異質異處今明異質同處又上明異質異見今明同質異見智積問文殊第四問明也文殊下第五辨答本聲聞在虗空中者上化直往今化回小入大昔住但空今回但空悟不但空成菩薩也爾時智積下第六嘆初偈嘆弘道之人次嘆所弘之法文殊言下第七智積雖有雙嘆文殊推功法華成佛命持經義智積問下第三嘆經速成因果力上違順皆是遲方便今明速方便上男今女上人今畜上長今幼此經開一切方便門示一切真實相非遲非速故能遲能速男女等亦爾方便一近為成提婆違方便二遠成釋迦人法權實也亦有七章一問二答三難四龍女來五身子難六龍女答七時衆悟道第二章云剎那頃發菩提心者依伽耶山頂經明四種發心一初發心謂初地已證聖處名初發心二行發心自二地至七地更修諸行名行發心三不退轉發心八地已上勉於三退名不退發心四一生補處發心謂十地終心龍女若實成佛則是後發心若應成佛通前三也智積菩薩下第三難言論未訖下第四龍女來時舍利弗下第五重難爾時龍女下第六答龍女以一珠奉佛者上獻一珠下酬兩難財檀既具法施亦圓此則辨才無滯下明成佛神力自在又前無礙口次無礙身即具無礙意爾時娑婆下第七說品利益也持品塔品中四命弘經次品三歎經力大小二衆開上四命及三嘆經力咸於佛前自誓持經故以目品亦有三初直往菩薩自誓於此土持經次回小入大自誓於他方持此經三重命直往菩薩周旋十方弘通此經初二人者藥王命乘權乘實之終樂說告身權實之始欲令異世同聞故自誓宣持次回小中亦二人初比丘次比丘尼各為二比丘二者一顯名無學二密行學無學自誓於他方持經凡有二義一示直往是十地深行忍辱力強大慈悲心厚故能住此土弘經回小入大為十信信義淺行忍力猶弱慈悲未深故他方弘經二藥王樂說住此呵回小入大流欲寄彼斥此令此改過故託迹他方尼中有二初授記次弘經文處易知第三中有二初明弘經二者受命命弘經有三意一前二人各居彼此猶未稱佛心故命令周旋十方彼此雙化故重命也二欲令諸菩薩述弘經之方便弘道者依而行之三者上弘經人少未暢佛心故重命多菩薩問曰何故眼視答曰一欲顯諸菩薩懸得佛意二欲表諸菩薩既懸得佛意亦懸解經旨堪弘道利人三欲誡諸菩薩受命中有二初嘆德即從座起下第二受命弘經又二一者住謙讓門二者順佛意門住謙讓門者佛雖嘆諸菩薩懸知佛意及識經旨歸而諸菩薩不自顯德故物不知佛意一思不解重思未悟故云復作是念時諸菩薩下第二順佛意即是三思方達亦二初長行順佛意略自誓持經請佛加護二偈順佛意廣自誓持經偈三初標自誓弘經次釋自誓弘經三結自誓弘經釋中有二初忍惡人自誓弘經次為善人自誓弘經忍惡人中二初忍天魔外道惡次忍封執二乘惡鄣於一乘唯此四人故皆忍也惡世中比丘下忍二乘惡又二初明惡人次明人惡各二惡人中二者一邑二山文易知而作如是言下次明人惡亦兩一明作惡二明作惡意作惡中二章一惡言謗法毀人菩薩能忍二善言謗法毀人菩薩能忍初中又二一私處謗法毀人二在衆中謗法毀人菩薩皆忍為斯所輕言下第二善言謗法毀人菩薩能忍以大乘經皆說衆生本來是佛故華嚴云心佛及衆生是三無差別中論云如來所有性即是世間性小乘人聞此言則指斥學大乘者云汝學大乘明衆生是佛汝應是佛耶此言重意輕故為名過又此經云持此經者隨所至方皆應禮拜當以佛供而供養之小乘人聞於此言若爾汝是佛耶濁劫惡世中下明第二作惡意亦二初明外緣惡菩薩能忍世尊自當知下內因惡菩薩能忍前是天魔惡後是小乘惡又前是愛惡後為是見惡諸聚落城邑下第二為善人弘經餘結誓易知安樂行品玄意及來意如本疏又上來明一法一人一土皆是借一破異若異病雖除更封於一一復成病便不得安樂此五句皆是執病不與道相應為五見所纏今能心無所依諸見皆淨與道相應始是安樂又釋迦佛及十方佛有體用二門昔非同非異作於異門今非異非同作於同門若執此同異皆與理隔若因此同異悟非同異始是妙法方是安樂又此品來者上標乘標度今釋乘釋度標乘者乘是寶乘直至道場標度者度五百由旬今明若依四行則五百可越一場便到故是釋也又此品來者明懺悔斷惑坐禪行道之要也懺悔者罪從妄心生能生之心既妄所生亦妄事中懺悔還是妄耳但借其輕妄以除重妄故妄根未拔此品明實相觀實相之境既實所生之觀亦實故以實除妄故妄便息名實懺悔斷煩惱者無始來動心若不除墮凡夫二乘便起有所得心取相今得實觀此三自寂前念觀為無礙後念觀為解脫故煩惱清淨言坐禪者凡夫二乘有所得生心動亂得實相觀斯事皆寂即第一義禪亦如斯而行即是行道又得如實觀衆行具足無慳即檀遮非為戒餘類爾又說此品者上來明持經今辨持經如一一行中各明果報又下嘆夢覺安樂等生起四行第一畢竟空行正明菩薩妙於淨觀餘三行教菩薩外巧於涉動菩薩內得實相觀外為物弘經凡對四境以三行治之言四境者一劣己境二勝己境三小乘境四大乘境劣己境者以無慢行治之勝己境者用無嫉行治之小乘境者則起悲心於大乘境起於慈行故用三行對於四境便得安樂又菩薩內外兩病無始世來取相有得惱惱名內病初行治之外有四境餘三行治之初行又有二前明方便觀次正體觀住忍辱地者一於窮惡之世弘極善道理教相違必多魔事宜須行忍又始行人久習凡夫二乘有所得煩惱此名為病今欲行無所得觀即是服藥夫論服藥必動諸病宜應覺知須忍也柔和善順者不令他惱是故柔和他若來惱巧須將順菩薩知是顛倒狂人故將忍心不驚之者邪正二形邪正兩教菩薩見聞不應驚動設見普賢亦須安心魔尚作佛況普賢邪但須觀其所說與實相應即受若不與實相應即須回魔到實相內論云自知不隨他寂滅又復於法無所行第二正體觀有二義今前明兩義次融會之兩義者無戲論也初辨虗實兩冥緣觀俱寂名行處初於法無所行謂不行虗妄四句而觀諸法實相即是行絶四句實相觀此初歎意也亦不行者亦不行實相觀也小品云如來所得法無實無虗大品云菩薩不行真實法亦不行無真實法即其事也不分別者上求虗實兩冥今緣觀俱寂不見境智能所照及能發所發境為所緣境為能發智為所發智度論云緣是一邊觀是一邊離此二邊名為中道次依後偈及正法華釋此文從初至亦不行辨法無生觀故後偈云又復不行上中下法有為無為實不實法故知辨法無生不分別者明衆生無生觀故後偈云亦不分別是男是女即其事也所以辨法無生後明人無生者有兩義一者今是說門從深至淺故前除法次泯於人二者前淺後深修行次第前正辨法空後破人者辨無觀主即是泯觀故下半偈云不得諸法不知不見即證也然生法兩緣觀俱寂此中說為行處涅槃中用為聖行有四諦二諦一諦無諦無論今文具之見虗實緣觀即是邪觀名集諦集諦感苦即是苦諦若了虗實緣觀本自不生故虗實滅名為滅諦如斯了悟即是道諦故具四諦也二諦者於顛倒人有虗實緣觀名世諦於菩薩即畢竟空為第一義故具二諦一諦者緣觀本不生故無苦集今亦不滅故無滅道即一諦也有多故有一多無故一亦無即無諦也又此文即佛性隱顯義也有緣觀故佛性即隱也緣觀俱寂故佛性顯也釋近處與上意者前明虗實兩冥緣觀俱寂故為深今但寂緣未明泯觀所以為淺今文正辨菩薩作二諦觀者欲離惡父母求善父母離惡父母者無始來貪愛為母無明為父受六道生今欲別此父母故學二諦觀學第一義發生正智學世諦觀生於後智二慧具故法身便成二諦是佛法大宗迷悟根本不可不知但此義難明釋之多謬也今依龍樹中論四諦品云一切法本性空於凡夫顛倒謂為有名世諦諸賢聖真知顛倒性空是實於聖是第一義故涅槃云一切世諦於如來是第一義諦亦應云一切第一義於凡為世諦問曰無四於凡四有四句起不答曰於凡謂起理實不起以實不起故無六道起亦無二乘起九道起亦無無起乃至四句問曰為觀令不起為本不起答曰本不起故經云諸法從本來寂滅相中論亦云諸業本不生以無定性故問曰四句本不起於凡心外有四句境起不答曰細觀論文於凡心外有四句境起心外實無四句境故百論云心想言有炎中水炎中實無水起攝論明幻等八喻亦同問曰心外無四句起今四句息心亦息不答曰心謂四句即是心作故一切經論皆是破心想不破四句法故淨名經云但除其病不除其法問曰心外無四句境有此想心以不答曰能想如所想四句既本來無能想之心亦空故普賢觀經明十方諸佛同令行者觀心畢竟空不生問曰十方佛何故勸觀無心答曰從心謂有四句如此觀心不生有何可示問曰凡夫無四句謂有四句聖人何故說四句答曰隨俗故說欲令因四悟本無四問曰凡夫無四謂四聖隨凡說四有四句起教不答曰凡四尚不起聖四寧有凡四不起故本無六道聖四不起亦無三乘界故不增有六道可化亦無三世佛出亦不吐一言故像法決疑經云從初得道乃至涅槃不度一人不說一教釋文觀一切法空如實相者觀一切法空明菩薩見空義如實相見不空義但觀於空此與二乘不異不名智者見空及以不空行中道也不顛倒者離邪觀也不動者安住實相不動明正觀也不退者內惑不能壞也不轉者外緣不能轉也如虗空者上是法說今弘喻如中論及智度論明虗空絶四句也無所有性者上法譬辨空似如破法今明本性空也一切言斷者上明心境絶此辨言語斷也不生不出不起者無六道因故果不從六道業因生無六道煩惱緣故六道果不從緣出六道果不起故云不起無有六道外名亦無內相故云無名無相無所有者明向是實說非為權教無量已下亦不可尋求但以因緣有下明世諦觀菩薩知六道常四絶名第一義失於緣四絶常六道名世諦從顛倒生故說常樂者上明菩薩知二諦今明衆生不知世諦是因緣故橫計有常樂問曰何故不明衆生不知第一義答曰衆生尚不知世諦云何得知真諦釋偈又復不行上中下法三意初偈明法無生觀次半偈明人無生觀後半明境智法無生俱寂初泯昔法下中上即三乘又人天為下二乘為中大乘為上次半泯今初泯上身權實故不見為無為次泯上權實也次半明不見男女者泯今昔教所被人即不見三乘人亦不見一乘菩薩人也不得諸法下泯境智也二無生理為境二忍為智生法既忘境智便俱寂也無有常住者不見此身是常亦不見是無常故離常無常二邊為正觀也又不見涅槃常亦不見生死無常亦是中道觀顛倒分別下敘失即明今昔倒不倒義法華教不到者判昔有二倒謂三乘異倒及佛身無常今一乘及佛常為不倒二至此品今昔俱倒昔倒如向今明八倒者乘權實有四倒謂決定有一決定無三此有無二倒又一定實三定虗即虗實二倒也於法身亦四決定唯有法身定無應化身此有無二倒法身定實應身定虗故有四倒故經云顛倒分別是有無是實非實是生滅也問曰上佛自作此說今云何倒答曰佛借一以破三三除一捨假修以斥短短息而常消即領佛智耳今捨三著一捨無常著常又道非三一而執三一與道相翻故名為倒又分別有無者若決定二我為非二無我為是世諦定有真諦定無皆是顛也在間處攝心者出息倒之方若三病息一病生者用三破之一用相待門破之無三可待即無一也二用實相門破之實相絶一異等四句云何存一耶三用名字破之既名為倒即知非有若其實有不名不為倒也故下云不生不出不生者顛倒本不曾生乘權實四倒既作此破身四亦爾釋第二離慢行正為一乘菩薩既妙解今昔倒不倒竟多起心謂己為得乖道者為失以有得失自舉陵他內有此意外生是非故令離之諸餘法師者雖作大乘作大乘學者有異小之大異大之小二有所得執定常等如上八倒者雖知其失不得起輕心及自恃於聲聞人上令於大乘人用心法今令於小乘人用心法長行中有二初離過行二習德行偈二初頌習德次頌離過各四初四者一外淨二內淨三說法淨四問答淨文易知離過四者一離懶墮二離懈怠三離憂令慈心起行次離貪發大誓願前明離過果次明習德果文易知第三行前因後果因中二前離過次習德各三初三者初明內德無諂嫉二外不惱人三不戲論法文易知習德三者初下有所愍三上有所敬三解法之方三果易知涌出品始從塔品終竟壽量三世佛集十方土淨不思議徒衆微妙教門必有具大事明深利益余雖不面覩靈山而心眼似有所見今略以四門明其大意一能所門二開䨱門三迷悟門四因果隱顯門能所門者身權實有能開所開能破所破能開有二一多寶佛顯法身不滅淨土佛顯丈六非真故能開唯有二佛所開但本迹兩身能破所破者兩佛即是能破二迷即是所破多寶顯法身不滅破迷法身淨土佛明丈六非真破報迹身實也壽權實中亦具能開所開能破所破能開謂涌出菩薩所開即壽權實也前開有二今亦然矣一菩薩數多二大士德備若但數多皆是心初不得顯成佛久要須數多德備方得顯伽耶非始成雙樹非終法身無始方便有始終能破所破數多德備即是能破迷實壽執權壽即所破也又上能化開能化以佛為佛事謂弘道利人今所化開能化菩薩為佛事弘大道十二種利人故佛與菩薩是真善知識同開大道同利衆生又上以過去人開今用現在人開過去人開者多寶是過去佛古佛既不滅今佛云何滅現在人開者現在有所化菩薩數多德備故知釋迦成道已久又上通開今明別通開者一切佛皆法身無生滅方便有生滅別開者釋迦成佛已久不得云一切佛皆成佛已久也此論所開通別能開通別者多寶開十方佛法身無生滅方便有生滅亦得開釋迦故經云多寶於十方佛說法華處皆涌現及於釋迦會現也千世界菩薩但是釋迦所化但開釋迦不得開餘佛故能門別也又多寶唯得開方身不滅不得開久已成佛此別開身也涌出菩薩唯得開已成佛不得開法身不滅此亦開別也又所開通別者一切佛法身皆無生滅壽亦無始終此是通義若論久已成佛者此義則別過去佛是久成現未非久成問曰今品明佛壽為是通為是別耶答曰有二義若論法身無生滅本有非始終則通一切佛若論久證法身者但是釋迦又上略開釋迦教從此廣開釋迦一化法門又經初已來明少時益今辨多時如五十小劫及十二種益又上來少現瑞相今現多瑞相如下八種瑞又上來略明功德從此去廣明持經功德如下略明七品及廣明三品等又上塔品略說三身多寶為法身分身為應身釋迦為化壽量品廣明三身伽耶為化身久成為應身無有生死為法身上但示其相今廣辨之第二開䨱門問曰直明塔浮空而至菩薩從十方來亦得能顯所顯能破所破何故二品要從地涌出答曰此有深旨就教辨開䨱義凡有三時一寂滅道場發開實身壽此是無地䨱時二者為二乘人隱實身壽說方便身壽即是有地䨱時三靈山廢方便身壽顯實身壽即地裂涌出時如塔與菩薩亦有三時一塔初顯時二中途隱地時三地裂塔現涌出時菩薩亦三時故下經云昔伽耶城化得豈生非在地上時後居地及涌出寧非二時故借隱顯三時以開佛教次三時一過去大通佛說實身壽謂無地時佛初出世說方便身壽是有地時法華會是地裂涌出時第三通論十方三世佛為大事因緣出明實身壽是無地時曲為二乘不堪聞實說方便身壽是有地時廢身壽兩權實辨於二寶是地裂涌出時三迷悟門衆生煩惱名之為地亦約前三時寂滅道場菩薩身淨堪聞二實是無地時二乘有煩惱故不堪聞是有地時今斷常煩惱將傾堪聞大法是地裂時次三時大通佛所堪聞是無地時中途迷失是有地時今日得悟是地裂時故繫珠中三初未酒醉時中途醉忘珠時後小醒起行乃至大醒見珠時第三重亦爾次因果門涅槃中大明二義一果德義二論佛性隱顯果德義中略明二果一壽命品明長壽果及壽命因二金剛身品明法身果及法身因一切諸佛唯身與命護法弘經為法身因慈悲不敬為長壽因今此經亦明兩果二因塔品明法身果涌出明壽命果從四命至持品亡身弘道即法身因安樂品正明智慧慈悲為壽命因也次明佛性隱顯者如力士額珠為隱後見為顯所以明隱顯為成上果義隱顯更無二體此經亦爾猶如一塔有隱有顯更無二體涅槃之體本自有之即隱顯俱名法身又云隱名自性身及如來藏顯名法身今亦隱則色等涌出開顯名法身故地下菩薩正喻佛性也問曰何以得知答曰道理必無千世界塵數菩薩聚在娑婆地下令在地下者因地下以為教門明一切衆生有佛性為煩惱地䨱故不現問曰前隱顯俱是塔可隱顯法身合隱顯俱菩薩亦應隱俱佛性答亦得如此故有因佛性果佛性攝論明三佛性自性住佛性弘出佛性果德佛性但借事為教門不必曲令合之又明菩薩一人兼二義一明佛性在於地下二為欲將所化開能化故出猶名菩薩問曰隱名佛性顯名法身此因果義足何故須護法慈悲為因答曰因有二種一正因二緣因如種子為正因外土為緣因故互得生佛性是中道種子正因慈悲護法是緣因故法身互得生問曰但是種子成互水土不成互但佛性成法身萬行不行不成法身則萬行並應滅同舊來地論及攝論師習滅義若水土亦成互則同令轉習因成報佛答曰安此喻不得種獨成互水土不成若種獨成互應不須水土若習因作報佛水土應作互故二師俱失今所明者二師立定性義別有佛性異衆生別有緣因異正因故取相作義今說一偈半衆生本生衆生是菩薩隱顯開䨱涅槃寄貧女寶藏等譬明隱顯開䨱問曰法華已此經已明身壽緣正因果與涅槃何異答此經就能化所化菩薩明隱顯開䨱涅槃寄貧女寶藏等譬明隱顯開䨱問曰法華已明隱顯開䨱竟何須涅槃答曰若一部明般若及八部勝鬘等明一乘之何用法華今示般若無量門一乘隱顯亦有無量門又此經為利根略說便悟涅槃為鈍根未了故迦葉數十問佛次第答之即是廣說亦是料簡法華又利根於法華中並悟解隱顯開䨱不須涅槃如燈明及迦葉佛不說涅槃也就品中大開有二初正說二流通初是智慧後明功德又初明果後辨因兩門各五初章五者一明涌出菩薩開顯壽量二者疑間三略答開權顯實動執生疑四執動疑生申疑致請五廣開權顯實斷疑生信一一章各二合十段也初章二者一明涌出緣由二正辨涌出緣由有二初請持二止持總論有三初大音普告二他方請持三釋迦止持以三因緣發起出佛答中六萬恆沙者實有千世界塵數菩薩但云六萬者略舉初人與六萬恆沙眷屬二顯此菩薩起六趣薄地中令已成就欲顯釋迦得佛久也佛說是時下第二正明菩薩涌出於中又二初明千世界塵數菩薩涌出顯釋迦證法身次別明四大菩薩問訊顯埀應久初有十章前明涌出時者欲顯今是開壽權時娑婆世界地裂者明涌出處欲明此菩薩昔於此處初發道心又顯此土菩薩為釋迦眷屬開釋迦久成佛虗空中住者一顯法身無始終不為惑染二表佛性雖在煩惱性常清淨不為惑染三顯法身住實相土四顯菩薩常行畢竟空華嚴云菩薩清涼月遊於畢竟空聞釋迦發音來者聞上塔品大音普告也質樂二佛住二佛前者多寶已開實身今開實壽不滅彌顯欣樂二佛釋四大菩薩問訊問曰何故別明四大菩薩問訊釋迦答曰上通稱嘆多寶釋迦及分身佛今欲顯涌出意正為開釋迦壽量故別問訊釋迦此是所開別又顯是釋迦眷屬非餘佛故能開別問曰何故問訊能化所化耶答曰欲明衆生易度則有千世界塵數並成既有此菩薩則得顯成佛久四人普稱行者行安樂行故能發教弘經但一妙行隨義立四名如來安樂者衆生受化德無不圓故如來安樂示衆生受化纍無不盡故如來少病又衆生得度二死苦諦故如來安樂衆生得脫五住惑業故如來少病諸菩薩隨喜者前明千世界菩薩成就則顯成佛有十二種益故菩薩而生歡喜佛答於如來起隨喜心者諸菩薩隨喜本為開佛壽權實但前所化開能化次問所化還成能化都為成佛壽權實故隨爾時彌勒菩薩下方他下第二大衆疑問有二初此土疑問次他方疑問所以二人問者佛說應化兩身同歸不二法身故化身侍者及應身侍者皆問也又欲令穢土衆生淨土菩薩同入法身故淨穢土人同問應化又二身既歸法身淨穢二土同開不二彌勒問二意一據實行既是窮因欲趣佛極果令餘人亦然二下方涌出上方彌勒同欲開壽量故一人涌出一問所由以共弘通利物也彌勒偈為二初總問總請第二偈去別同別請即二就別問中前問弟子次問師問弟子者問所化涌出意問師者以所化開能化意問弟子中前問來處來意即明弟子德稱積數多開久成佛此並是彌勒顯發密教調伏衆生問曰分身佛何故不答令釋迦答釋云今正欲開釋迦壽為釋迦緣故彌勒前問分身侍者後問意亦如是第三釋迦告彌勒下佛略開權實亦二一緣由二正答各有長行偈頌初長行四意偈頌亦然長行四意者一歎二勸三誡四許宣示諸佛智慧者若未開壽權實則佛慧未顯今既開之則明理盡之法暢佛神慧亦用佛慧以為身壽故開壽即開慧也偈云甚深叵分別者若實長壽何故不可分別良由說長斥短短息長廢乃至五句故叵分別名為甚深次正答中前長行次偈長行正答發心問以初從釋迦發心故知成佛已久次答來處問而釋來處不釋來意者若釋來意則妨壽量廣說次第四彌勒執動生疑申疑致請亦二初疑次問餘並如舊也
