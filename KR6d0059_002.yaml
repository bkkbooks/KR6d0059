body:
  text: 胡吉藏法師撰昔在會稽著此經玄文凡二十卷中居京兆錄其要用裁為七軸但余少弘四論末專習一乘私眾二講將三百遍但斯經言約義富更有異聞撰錄大宗復為此三卷敘其疏意略有六焉一二本所無今文方有如四土之說及七會之文二全癈舊通用今新意如合大車及火宅之譬三新舊兩用可適時而說如六序及十方便之例四昔言隱昧今則顯明如釋妙四門索車七意五大宗乃一而轉勢不同二本雖明今須重述六改舊分章依今科約如方便品六雙之例也釋經題具足應云妙法蓮華教菩薩法佛所護念經今釋此一題即為四別初論妙次釋法三解蓮華四辨教菩薩法竺法護稱為正法蓮華羅什改正為妙本疏已詳餘未盡者今當略敘然開一題為一部合一部為一題一題若成一部則成一題若壞一部都壞又一題若成釋迦一化便成一題不成者又一化不成又一題若成十方三世佛法則成若不然者一切不成良由此經窮深極大故後經云如來所有一切之法如來一切自在神力如來一切秘要之藏如來一切甚深之事皆於此經而演說之故此經近攝能仁一化遠該十方佛法矣然立妙名凡有四義一者妙是顯至道之嘉名二是伐累根之巧稱三窮讚美之淵府四極引物之幽致顯至道之嘉名者夫至理不可名今立妙名者欲顯理無名也故經云是法不可示言辭相寂滅中論亦云諸法不可得滅一切戲論無人亦無處佛亦無所說肇公云言之者失其真知之者反其愚有之者乖其性無之者傷其體但至人欲令物識道無名故於無名相中假立一妙名令因此妙名得顯理無名所以然者理若可名則非是妙既其稱妙則知理不可名故立妙名顯理無名矣又立妙名者非但得顯理無名復得顯名無名所以然者既稱妙名寧有名耶故維摩經序云非但妙顯無言即言寂滅如天女之詰身子汝乃知解脫無言未悟言即解脫若立正等名者則不得顯理無名及顯名無名也問所表之理絕言能表之言亦絕欲明何義答所表之理絕言為明於理能表之言亦絕為辨於教若然非但一題成一切佛法皆成即一妙字成者亦可一切成矣第二伐累根之巧稱者前義為顯理今除累根累根者謂取著也由取相故生煩惱由煩惱故起業由業故致苦是故金光明云如從妄想思惟故生煩惱則知著是六道之本亦是三乘之根十方三世諸佛出世說法正意為伐羣生累根累根若傾柯條自壞令六道反流三乘徙轍故此經初品云以無數方便引導眾生令離諸著滿願歎云善哉世尊拔出眾生處處貪著涅槃亦云住十地故見不了了無所住故見則了了皆是其事問曰云何立於妙稱能伐累根答既稱為妙不可作四句百非取之則受教之人一切取相心滅取相心滅故回六道之宗改三乘之轍也第三窮讚美之淵府者佛道所以超九十六道及二乘之道者良由微妙故也若不作妙名者無由得顯佛道超勝一切諸道又十方三世佛但為明佛道故出現於世當知皆為明妙道故此妙名於眾經之中最為美矣第四極引物之幽致者若聞於玅法乃至書於妙經則起極敬之心發難遭之念便有五種法師獲六根清淨故立妙名矣問曰羅什立於妙以何文為正答乃處處有文故方便品云又告舍利弗無漏不思議甚深微妙法我今已具得唯我知是相十方佛亦然明九道不知唯佛能知故斯文為正意也次釋法義此經總唯一妙別開二種一者果妙二者因妙然既稱為妙實不可論其因果乃至四句故下文云諸法寂滅相不可以言宣文殊十禮經云諸佛虗空相虗空亦無相離諸因果故敬禮無所觀但無名相中為眾生故強名相說開因果法門約果人所證名為果妙因人所行稱為因妙就經初後分之從初竟囑累正明果妙傍明因妙從藥王訖普賢正明因妙傍明果妙初分經正明果妙略有四種一所乘法妙二能乘人妙三壽命妙四國土妙一一妙皆有四重所乘四重麤妙者對昔二乘之法非究竟故非玅一乘法究竟故為妙二者三之與一皆墮二邊故不名為妙不三不一中道之法故稱為妙三者經云遠離二邊不著中道則中之與偏並皆非妙若中偏兩捨乃稱為妙四者二取為二是二捨為二非既墮在是非則不名為妙若百是不能是百非不能非方乃為妙故大莊嚴王菩薩歎佛非是非非非得非失非此非彼非去非來即其事也次明身麤妙亦有四重一對二乘所見生滅之身非妙佛所見無生滅身為妙二者生滅無生滅並非妙非生無生乃稱為妙三者生滅為二無生滅為不二二與不二並皆非妙非二非不二乃稱為玅四是二是不二為二是非二不二為二非既是是是非悉皆非妙不是不非乃稱為妙第三壽命妙者一對二乘伽耶之始雙林之終非妙無始無終乃名為妙二者始終無始終並為非妙非始終非不始終乃名為妙三者始終為二無始終為不二二不二並非妙非二不二乃稱為妙四者有是有非不名為妙無是無非乃名為妙第四土麤妙者一者對二乘所見迹身穢土非妙歎法身常寂光淨土為玅二者穢之與淨並皆非妙不穢不淨乃稱為妙三者垢淨為二非垢非淨不二二不二皆非妙非二不二乃名為妙四者有是有非不名為妙退不著是進不染非乃稱為妙問曰此之四妙為是一體為異體耶答體更無二隨義不同如一體三寶約覺義為佛軌義稱法和義為僧今亦爾也理更無二約運用自在故名為乘至人以此為身秤為法身無始終義目之為壽聖所栖託稱之為土問由來有此義不答南方往諸法華師似有乘麤乘妙無後三也就乘麤妙中但有初重無後三節又初重義亦不成所以然者二乘為麤麤是無常一乘為妙妙亦無常無常既同有何麤妙故初重亦不成也今明既分麤妙則妙名為常麤是無常故得分麤妙也又總論四種麤妙亦有四重一者以二乘為麤以累未盡德未圓故二乘為麤佛乘累盡德圓故佛乘為妙二者若麤若妙皆是二邊所有為麤非麤非妙是中道為妙三麤妙為二非麤非妙為不二二不二皆麤非二非不二乃名為妙四二不二非二非不二皆是名言故皆麤言忘慮絕方是妙也問妙名為在果為目因耶答果累無不寂德無不圓可得稱妙因義不然故妙正目果問何以得知耶答初從定起讚佛慧甚深明六道不知三乘未達則因人未知於妙何猶有妙故妙名目果又經云無漏不思議甚深微妙法唯我知是相十方佛亦然既唯佛能知則獨佛有妙又大名主果不在於因妙亦如是故下經云菩薩求此乘故名摩訶薩即知所求之果為大因人從果立名亦名為大故大唯是果也問前分明因後章辨果可是相生先果後因有何次第答前因後果此相生次第前果後因謂說門次第所以然者要先示妙果欣此妙果方乃行因是故先果後因又此經正明三果權實昔明三乘之果此是究竟謂閇方便門隱真實義今明二果為方便一果是真實故方便門開真實相顯是故先明於果後方辨因次釋蓮華具如玄章今為抑毀法華之人明此經辨因不足明果猶無常略引誠言驗此通為謬蓮華得生凡有二義一者假緣二有種子眾生成佛亦具兩義一者緣因佛性二本有佛性所言緣因佛性者即是菩提心由菩提心方得成佛是故經云諸佛兩足尊知法常無性佛種從緣起是故說一乘二本有種子即是本有佛性方得成佛雖發菩提心若本無佛性不得成佛故經云是法住法位世間相常住於道場知已導師方便說即是本有常住佛性也故知此經具明緣正兩佛性本始二有則明因具足果非無常更釋法華論釋蓮華二一出泥水二開敷微妙出水二義一出二乘泥水令離二乘心二出二乘泥水即是發菩提心如諸菩薩出二乘心菩提心現前名為坐蓮華座也諸聲聞因菩薩出二乘心即是坐蓮華座然法華實無不有蓮華座菩薩座也開義可知又蓮華有出水不出水真如有垢無垢無垢真如如出水有垢真如名不出水又有垢真如有不染而染染而不染如蓮華在泥亦有染不染也又斯教一乘之理四十餘年在三乘泥水之下而不為三乘泥水所染問他亦云蓮華不有而已有則華實俱含此經不說而已說則因果俱辨與今何異答今明唯有一理唯教一人唯有一理是果唯教一人是因不異前分明因後分辨果為異也次喻理教義者教如華理如蓮蓮約一如理一華喻教教本表理理一故教亦一說無量義皆為顯一理故一切教皆是法華也次釋教菩薩法問題云教菩薩法佛所護念教何等菩薩答菩薩有二一者直往二回心入大自昔已來化直往今次教迴小入大問昔亦教迴小入大以不答寂滅道場頓化不得故昔四種密化今方三種顯教四種密化者一說人天乘令入佛慧故經云我此九部法隨順眾生說入大乘為本以故說是經次誘引方便謂說二乘令入佛慧故經云眾苦所惱亂為是說涅槃我說是方便令得入佛慧三命說大乘令入佛慧故有長者付財窮子受命四為說大乘令入佛慧故有陶練小心之譬問陶練有幾種答依信解品略明有二一者以大行陶練但封執小乘不受大行故經云我等若聞淨佛國土教化眾生而不喜樂二者以大果陶練而保執小果不受大果故經云我等長夜於佛智慧無貪無著而自於法謂是究竟故寂滅道場已後法華之前用四種密化令迴小入大三種顯教者即三周之說以四種密化調柔其心令小志得移大機成就然後始得三周顯教令入佛慧初以法說門顯教令入佛慧次以譬說顯教令入佛慧後以宿世因緣顯教令入佛慧故三根咸悟現前獲記未來成佛此四密三顯該攝一化始終教迴小入大之人義無不盡又昔五密教菩薩今五種顯教菩薩一者乘密故云密遣二人二者身密即垢衣長者三者壽密伽耶成道四者土密在娑婆穢土五者逆密謂提婆示逆惡今五顯謂乘真實身真實壽真實土真實逆真實此該攝一切教門問此五種顯教既是法華五種之密亦是法華以不答法華教中說此顯密故皆是法華又昔密說法華今顯說法華又昔是法華方便今是法華正體又昔是法華之用故從一佛乘起於密用今收諸密以歸一乘若爾則法華網羅眾教眾教皆以法華為宗藥王稱最為深大豈不皎然問迴小入大既有顯教直往應有密化以不答但有顯教無有密化但顯教有今昔不同是諸眾生聞我所說即入佛慧謂昔顯教也菩薩聞是法疑網皆除今顯教也問何故有二顯教答有二教門及兩種菩薩一者經云始見我身聞我所說即便信受謂華嚴教具足明權實法門此中菩薩即解權實便入佛慧二者華嚴已後如大品之流未癈二乘此中間菩薩聞法華開權顯實則疑網得除也又昔利根者昔皆已悟鈍根者至今方解問何故迴小具顯密二教直往但顯教耶答直往利根是故但顯教迴小既鈍則前密後顯故方便品云菩薩有四早聲聞有四晚四早者一菩薩早習大乘故經云有佛子心淨柔濡亦利根無量諸佛所而行深妙道二早為說大乘故經云為此諸佛子說是大乘經三早與授記故經云我記如是人來世成佛道四早生歡喜故經云此等聞得佛大喜充遍身聲聞四晚對此可知也問今顯教菩薩既是法華昔顯教亦是法華不答二種顯教同令入佛慧故同是法華則法華攝華嚴等一切大乘深大之言其事彌顯也又稱教菩薩法者一者教昔菩薩令因權悟實二者教今菩薩令因實悟權教昔菩薩因權悟實者昔於一佛乘方便說五欲令五乘之人因權入實而執教之流聞五住五不能因五悟不五至此經開方便門示真實相始知五為方便不五為實故得因權悟入於實復一乘菩薩聞法華有一無三但知理一於緣成五又失方便教五是故今明理雖是一而於緣成五實雖是一方便說五如雲雨是一於草木成異令因實悟權故得入佛慧問此是何物人耶答猶是迴小向大之人其根既鈍昔聞三失一今聞一失三亦得二人自有假名初心一乘菩薩聞有一無三起此偏執以教今昔二種菩薩令入佛慧是故名教菩薩法問波若教菩薩與法華教菩薩何異答波若正教直往菩薩法華正教迴小之人問二經用何物教耶答同用二慧教之但二慧不同略明五異一者因果不同二前後為異三淺深差別四空有義異五有境無境不同因果不同者波若以因為經宗正是因中二慧以因為宗故論云波若不屬佛但屬菩薩又云在菩薩心名波若在佛心變名薩波若則知是因中二慧以因為宗法華明果德二慧以果為宗唯此一事實餘二則非真照佛果乘之實名實慧能起權用目為權智故云佛力無所畏及佛諸餘法佛力無所畏謂佛實智及佛諸餘法即權智也故知是果中二智也問波若何故就因法華約果答昔未說菩薩行今欲為彌勒等說菩薩行故說波若是故波若正明因行法華欲分三果權實明佛乘是究竟故是果二乘非究竟故是因故以果智為宗也二前後異者大品前明實慧後辨方便法華前明開方便門後辨示真實相所以然者波若為體方便是用故前明波若後辨方便又波若劣方便勝論云波若清淨變名方便故前明波若後辨方便又波若為六地方便是七地又波若超凡方便越聖故分前後法華要前開方便門然後始得示一乘真實是以命初題方便品故前權後實又要先破二乘是真實相故明二乘是方便然後示一乘為真實又以二乘為方便是因一乘為真實是果前因後果此是教菩薩法之次第也若從佛實智起於權用亦是前實後權但約化物次第先權後實空有異者波若照空為實照有為權法華明照佛果空有皆是實照二乘空有皆是權則波若開空有二境開空有兩慧法華開權實兩慧而合空有二境也有境無境異者波若有真俗二境空有二慧法華則實智有境權智無境以無二乘究竟果故問何故法華名教菩薩而波若正屬菩薩不名教菩薩耶答通而辨之各互例也法華但顯一理唯教一人故明教菩薩法題中具合二義妙法華經謂唯顯一理一教菩薩法謂唯教一人波若雖屬菩薩而未癈三乘不得云唯顯一理唯教一人故不得云教菩薩法也但歎美大士所行顯小乘之劣故有摩訶之稱又云教菩薩法以三門教之一攝耶歸正門二攝異歸同門三攝因歸果門攝毒虫惡鬼愛見二耶歸聲聞緣覺兩正故方便品具敘愛見後明我為說方便說於盡苦道示之以涅槃即其事也攝異歸同門者攝二乘之異同成菩薩汝等所行是菩薩道也攝因歸果門者攝於菩薩令成佛道即後分經是也次教菩薩三種法輪遣傍人喚子不得令識根本法輪也更遣二使謂支末法輪教也後委家財攝末歸本法輪也問曰後三與前三何異答前三敘鹿薗已去至於法華但明穢土教耳後三長敘華嚴淨土教門故前三但是二輪所攝自上已來教菩薩所乘法竟今次敘教菩薩能乘之人迴小入大之流不識佛身佛壽佛住處故不識佛何猶能解禮念歸依所乘法中唯有三乘能乘之人亦有三佛一者法身二者應身三者化身多寶明不滅正示法身分身是淨土之佛名為應身釋迦居穢土稱化身所乘法中三種破病一者用一破二故經云唯有一乘法無二亦無三也次借二破三緣覺第二之勝尚無聲聞第三之劣寧有三以權破實三乘皆是方便非是真實將法例人者亦具三一者將一破二唯有一法身無有應化應化非是實故金光明經云是二身者是假名有也次將二況三淨土分身之佛尚是化穢土化身佛寧是實耶又應身是本本尚非真化身是末末寧是實三以權破實明三身是實者方便說耳身實無三也解此三門則識佛矣次將身例土義亦同然明能栖應身之佛既非是實所住淨土寧是真耶淨土尚非是真穢國寧當是實非應非化方是真佛不垢不淨乃為實土則識佛住處名教菩薩法也次教菩薩識佛壽命既有三佛即有三壽法身無始終其壽則長應身淨土佛其壽則次化身居穢其壽即短故涅槃云唯佛覩佛其壽無量猶如夏日菩薩見佛猶如春日二乘所覩喻如冬日今亦作三種破二乘執佛短壽一者唯法身之壽為實餘二非真次將應況化應身之長尚其不實化身之短寧是真耶三以權破實說有三壽實此是方便非是實說問昔為二乘人說有三乘亦得昔為二乘說三身三土三壽以不答此非類也昔為二乘說三乘明佛乘即是化佛故但化身化土及以化壽垢衣長者即其事也問昔為菩薩說於身壽及以淨土與法華何異答若三乘之人與菩薩共聞者亦未分明如此經開權顯實所以為異設令開身土及壽權實三乘權終自秘之問昔何處開身土權實答且據淨名佛身無為無漏謂真身也出於五濁現行人法示於身權土亦然也釋章段此經言約義周非一意之可盡又大聖適機演教變文轉勢義亦多方昔已敘一途今更陳異意大明此經凡有三分一說經因緣分二正說分三信受奉持分初六事謂說經因緣分爾時世尊四眾圍繞竟普賢之末為正說分從佛說此經已第三信受奉持分經初六事可兩望之一為未來生信為證信分二望現在是說經因緣分一切諸佛要備六緣方得說經一眾生有信心即如是也二有持法之人即我聞也三根緣時熟即一時也四有化主謂佛也五要須待處謂住處也六所為之人及證明眾故有徒眾要具六緣方得說法也如是即是信也藥王品云此經於一切諸經中窮深極大法師品云於三世說中最難信解今略敘之以驗佛語也所言大者彌倫太虗稱甚深者眇然無際大義有四一明四實四權四因四果即一經之大意也二近該華嚴之始竟雙樹之終也三攝釋迦過去成佛逸多不見其始未來湛然不變群聖莫惻其終時長化廣莫不入其內也四總括十方三世諸佛從一切實起一切權攝一切權以歸一切實謂窮大矣雖復教彌六合而無言通現十方而不動眇然無際謂之深矣若不樹此信心則未有如是又若信法華深大謂己身心不深大與法華異者蓋是窮子受財謂是長者物耳今寄如是一事可將萬義類之明明法華既深大即己身亦深大且就一無生釋之明此身本自不生即本不凡本不凡故本非六道若是凡可轉凡成聖故有三乘既無六道凡可轉何有成三乘聖耶故此身超三乘越六趣即是本來一相名為一乘諸佛用本不生為身名為法身既不生何有於滅即是無生滅壽既本不生一切生心動念畢竟清淨即是淨土若達一身四果便辨即此不生亦具四因故智度論云順忍名乘動無生忍為乘出順此不生漸息生見名之為動無生現前出離於生名為乘出故了悟無生即一乘因也故無生現前是內弘義防令不起生念謂內護法義若如行而說是外弘亦令他防生心動念是外護如此內外弘護是法身因故得無生法身果也無生長壽因者經云慈悲是長壽因也世間但悲於物而不自傷以理言之先須自傷始可悲物如身子歎息云何而自欺自欺者諸法本不生而我謂有身生無生已是顛倒復欲滅之令入涅槃倒中之倒故謂有生滅名為自欺今令不起生見是大悲拔苦令不生常現謂大慈與樂於自身既爾化他亦然作此行者即長壽之因次行無生是淨土因者得無生之壽曉夜常淨一切生心即除穢土之業恒令無生現前謂淨土因自行既爾他化亦然次將明無生作後四行者弘無生是弘佛道行經云無生即是佛也弘無生度生見之人是度眾生行降起生見眾生是降耶行護無生妙觀是護法行也次就無生起四權者然了生宛然即無生亦悟無生宛然而生故能起生用故有二乘生滅方便所以昔於捺薗說五眾生滅法身無生無處不生故王宮示生即身方便既無生而生即無始而始故有始自伽耶謂壽方便既無始而始亦非穢而穢謂土方便故信一無生則具四果四因四權四實謂無生之大也無生之深者既稱本無生則無有生何有不生亦生無生如是五句故無生深矣若作無生觀者十方三世佛法並是身內如此則於身有益如是一句既爾竟歡喜奉行皆須入觀故下經云法華是良藥服者不須老病死也陰入無主為我聽受非情曰聞眾生心行可一之時名一時佛者授藥之人也住處者窮子服藥處即是得子之所也王城者昔摩竭提界寂滅道場救子不得處今還於此處救子得也昔是說根本一處今還於此處說攝末歸本一然本末乃異一道不殊如今昔處不異也與大比丘眾者依此經前列聲聞者命其子也列菩薩者召集證明眾也諸方等經列聲聞者凡有五意一者欲密教令迴小入大即波若之流二欲顯教迴小入大謂法華之流三欲舉小之劣顯大士之勝如華嚴等經明五百在座有若盲聾四表二乘將應悟入五欲顯法界不隔二乘二乘自隔法界法界不隔二乘故列之在座二乘自隔法界故有類盲聾後之三義並約華嚴又三種法輪列之各異根本法輪謂不密不顯二支末之教密而不顯三攝末歸本顯而不密五百在座既不見聞故非顯教亦非密化名非顯密今說大法密欲付財謂密不顯此列之唯顯非密比丘名乞士手持應器表內貯功德身服袈裟外示福田余深慚於鉢重愧於衣問何故前列羅漢答除糞已後方委家業故得羅漢竟乃為說法華也諸漏已盡者先雇子除糞也逮得己利者倍與汝價即除糞已後得一日之價也問婆沙云解脫通於果因涅槃唯是果稱何故爾耶答涅槃名滅度滅於大患之果度四流之因故獨在果解脫名不爾故通也盡諸有結者前離現惑後離於當惑亦先離於因後離於果問初離現惑後離當惑有二體耶答唯是一惑不復現行於心名離現惑無復感未來生惑名離當惑耳心得自在者上正與其直謂得羅漢今與涅槃果外諸餘功德如瓫器米之物也釋摩訶迦葉問增一阿含經云迦葉不值佛成辟支佛今值釋迦故成聲聞應勝身子云何飜是中根人答三世得聲聞極速也六十劫證得者極遲也四世緣覺極速百劫者極遲今迦葉不及身子此從四世已上六十劫已還緣覺人也六十劫已上者則勝身子也緣覺有三一劣聲聞如五十九劫已還人也二等聲聞如六十劫人也三勝聲聞六十劫已上人也問云何名緣覺答果人或藉非情而覺悟如見華落得道或藉人緣而悟無如因獼猴若是因人則必稟十二因緣教也問二種緣覺一本是初果迴心證緣覺二本乘緣覺迦葉是何人耶答迴心證緣覺本是初果聖人佛初出世迦葉猶是凡夫故知是本乘人也釋迦旃延者是性智度論兩文證之一云三百年有婆羅門道人性迦旃延次云以是故名迦旃延若是釋子則不作如是說扇繩是其別名余親見天竺僧云此土無物可以譯之故存梵性本行經亦云性迦旃延離婆多者此云室星母就星乞得從星得名也劫賓那此云分別時薄俱羅此云菴羅菓以一食施辟支佛得五不死報又名多忍辱依禪法秘要摩訶𤘽絺羅難陀是一人非兩人佛初為說禪法起在此人其人憍慢放逸通達一切異論四皮陀十八經以慧多定小佛於迦蘭陀竹林初說不淨觀經一及夏始證羅漢備為其說本緣故方得道列菩薩者上是而命其子今是并會親族召集證明也又上是當機眾三周說法正為聲聞故云為聲聞說法華也今是發教眾如彌勒之問文殊之答發起佛教也又約昔言之上是能教眾今是所教眾如命說大乘教於彌勒又上權行眾以我同物欲引物同我今是實行眾實行大道欲引小歸大又上是失鄉之子今是不失鄉子不失鄉子前已得悟失鄉之子今方改迷釋菩薩摩訶薩者智者見空及以不空見空則越凡見不空則越聖故有兩名二乘但見於空不見不空故唯有一稱又二乘不求大道當體立名菩薩求於大道從所求受稱釋不退轉瓔珞經二文解一云十信中第六信名不退心勉於位退次文云十住中第六住猶退第七住不退二文相違今以兩義融會一約利鈍二就權實利鈍者利根菩薩六信已能不退鈍根之人至六住猶退積習善根至於七住方勉位退次約權實行論之六信不退權行之人則六住猶退故龍樹十住婆沙云言十住退者為怖地前菩薩令速入初地故云退耳其實不退也皆得陀羅尼者持不生觀令恒現持生觀常令不現也樂說辨者內精知欲樂外巧說諸法也問曰何故上嘆二乘斷惑不歎菩薩斷惑答有二種依小乘教則二乘斷惑盡菩薩都未斷惑也依大乘教二乘斷惑是生滅觀除糞人也菩薩無生滅智惑本不生無所斷也淨名經云不斷煩惱而入涅槃然不斷應不入但悟惑不生故即是涅槃故不斷而入前歎斷惑是毀二乘今明不斷明美菩薩也釋菩薩別名凡有三義一者聞此勝名獲大功德如聞彌勒名滅百億劫生死之罪等也二勝人依德立名既聞其名可學其行三者此是體道之人道既無名則人亦如是無名強為立名耳然菩薩既無名強為立名眾生亦無名強立名以眾生本來絕四句故強立眾生耳今聞菩薩無名強為立名移置己身者即悟眾生便成菩薩有此大益也若聞菩薩名作菩薩人見者則菩薩便成我見也釋初列文殊大品經雖是大乘猶未癈三乘猶符昔教其言易信故佛自說不假菩薩弘助故列菩薩依客舊次第此經既癈三乘反於昔教其言難信必須佛菩薩共弘物方信受故列菩薩依賓主前後韋提希者此云雄身其本是提王女應云提何此云雄身以其國別是一州住故也釋爾時世尊四眾圍繞敘四處七會義此經有一義二義三義四義七義十義十二義一義者文雖七卷二十八章統其大歸但明一道清淨故下經云三世十方佛現通說法諸有所作皆為一佛乘故二義者有兩種經一無量義經二法華經所以說此二經者無量義辨其出生法華明乎收入要須先明出生後方辨收入二教相成故一處說也所言出生者略有三種一從得生失二從體起用三從實生權出生失者謂失一道清淨故有六道不同故無量義經云一切諸法猶如虗空無有二相而諸眾生虗妄橫計輪迴六趣莫能自出如涅槃云是一味藥隨其流處有六種味二從體起用者謂諸佛體悟一道清淨欲化六道眾生出生一切身一切教故經云眾生根性無量教亦無量教無量故義亦無量無量義者從一法生始從華嚴終竟法華之前一切諸教皆從一法生是以經云初說人天二乘乃至摩訶波若華嚴海空及菩薩諸行也三從實生權謂從一佛乘出生三乘問無量義經但明出生法華前一切教當教亦有出生耶答無量義欲融會諸教故當教亦有出生故有井池不同而水無異譬此明理實無異約眾生根性別得道不同也次對上三種出生即明三種收入一收六道同歸一原故會一豪善並皆成佛二攝用歸體始從寂滅道場終竟雙林之說同歸一道是故經云如來說法一相一味究竟涅槃常寂滅相終歸於空三者攝權歸實即會三乘入一乘也然雖通明三種出生三種收入正為三乘人明三從一生寧不歸一次判今昔昔但當教明義未辨出生一切一切收入此經是結束融會故從體起一切用攝一切用以歸體也次辨二名從體起用用有多門名無量義從用歸體體無有二故受妙法之名次分略廣從體起用則略但有一會說法一卷之文攝用歸體則廣故有多會之說者此經正明收入故也又三世佛以歸一為正意故廣明之出生非佛正意故略辨有昔未辨收入故今廣明之昔已廣辨出生今但略說也次引喻既有二經明出生收入今引兩喻出生如阿耨達池出四大河收入如四河合流同歸大海等一醎味也次明三義即是三段初六事謂說經因緣分二正說經分三從普賢品末信受奉持分次明四義者即是四土初在穢土說法二在淨土說法三住淨土普為十方淨穢人說法四還在穢土說法所以明四土者欲明一切諸佛土權實義一切諸土不出五句一但穢非淨即初說處是也二但淨非穢第二說身權實處是也三亦淨亦穢處即神力品已去也住於淨土現通說法名為淨土令十方淨穢同得見聞故復有穢土也第四還住穢土分身已散土還復穢囑累品末已去也此即含有非淨穢義斯法華經是諸佛秘密神通難信難解今當述之若如淨名顯現法門初穢次淨後還復穢今是甚深秘密望前欲明收入非淨穢義後淨土雖隱不明其現故知隱無所隱雖淨非淨穢土雖現而不明其現故知現無所現雖穢非穢故欲收入非淨非穢實相之土望後復有出生之義雖非淨穢出生淨穢故淨穢雙遊故分身還淨釋迦住穢妙音來時遊於穢土皆是甚深難思議事也次明四處一有處說法即初分經也二從見塔已去昇空說法故佛住空接眾亦在於空三亦空有處說法即神力品此會佛及上眾俱處虗空十方同見具空有二處四還住有處故佛從塔起歸於本座大眾亦然此中亦有收入出生之義望前則有收入所以然者釋迦經雖從空住有而不明其事當知雖空不空雖有不有即收空有入中道非空有也望後即出生義雖非空有而空有雙遊多寶住空釋迦居有一切佛土雖多亦不出空有二處也問後明空有與淨穢何異答此即有三身三土謂化身住穢土應身住淨土法身住空即非淨穢土也次明七義者謂華嚴七處八會此經四處七會初會說無量義經多人得道二會說乘權實法門直往菩薩疑除迴小之人蒙記三會說身權實法門無量眾生得大法喜種大善根即見塔已去也第四會龍宮不思議眾集說法界違順大用淨穢二土蒙益者多即提婆品已去也第五會千世界塵數菩薩集說壽權實法門十二種人皆得受道即踊出竟常不輕也第六會住於淨土現五種神力總說法華十方眾生皆蒙法利即神力品也第七會說一切菩薩行法門無量眾生皆悟道迄藥王去也次明十義有二種一者文十二者義十初文十者即成十段仍生起七會無一豪乖越七會有二次第一次機緣次第故會會中有人得道佛應機而說二義次第者前如是六事明說經因緣具足今第二正明說法將辨攝多歸一故先明從一生多故初會說無量義經也既明從一生多義顯次即明攝多歸一故第二明乘權乘實法也乘權乘實者但明所乘之法次明能乘之人故辨身之權實也自上從一生多攝多歸一所乘之法及能乘之人明十方佛及釋迦法界順用法門但釋迦一代有兄弟二人作違順兩用上已明順用故次辨違用釋迦既爾十方佛亦然自上已來辨於違順但明釋迦現在一期之事耳故今次明久證法身未來不滅逸多不見其始彌勒莫惻其終不慮而知照窮法界不動而應十方現前無言可吐教彌八極無權不開無實不現十二蒙益八種瑞相故有第六會明壽權實也自上久近諸事但利淨穢二生之緣別明權實之教未暢眾聖之意故現五種神通總說一切權實令十方同益二世咸聞故名有第七會始自一會終竟利於十方皆是明十方佛及釋迦佛果事竟又故第八宜付屬也付屬佛法既竟次明十方三世諸菩薩行化法門故有第九會即第九章也說果明因一期事竟一切菩薩一切二乘一切凡夫歡喜禮佛而退故有第十信受奉持分也次義十者有十雙義然此經具一切義震領提綱略舉其十初總明十方佛從體起用攝用歸體一雙也次從體起用攝用歸體明法次辨身權實辨人人法一雙也上人法是順用下明其違謂違順一雙也違順是一代之近次明久遠之事謂久近一雙也上久近多是說法輪下明現五種神力滿百千歲救度眾生謂神通輪即神通說法一雙也自上二輪皆明果德次辨因行謂因果一雙也次明治病初出生收入明乘權實正破眾生執三乘異病從身權實竟經乃至雙林之教破眾生執佛無常病一切病唯此二也執異病亦是自迷執無常病謂迷他初二是迷因次二是迷果初亦是非常謂常後是非無常謂無常本疏已釋也即破兩病一雙明七會說法之意也次約三世佛說不說一雙諸佛多說前乘權實法門既明出生收入於義已圓何者二乘非究竟即是無常佛乘究竟名為常住既辨乘權實即身權實已彰不復須說後分亦不須多寶佛塔多寶佛塔為破惡世鈍根無常執故踊現耳故燈明朝說法華夕即取滅都不明身權實事大通智勝佛亦然即說不說一雙次明根利鈍一雙以成前義利根聞乘權實即解身權實不須更說後分中根者更須說後分無常執乃除下根者於法華不悟乃至涅槃教方乃解耳問曰何以知上根者初分已解身耶答曰身子開乘權實即解佛權實故云如今者世尊從生及出家得道轉法輪皆以方便說乃至中根人亦悟三身故有垢衣長者之喻即知諸佛不必具說後分經也自上所明三種權實謂正果法次明五種之土謂依果報耳即依正一雙也十方三世諸佛所說施為皆攝十雙故神力品以四一切攝之謂一切法一切神力一切秘藏一切甚深事皆顯在此經也次明十二義者說果門有六會說因門亦六會始自藥王本事終竟普賢勸發是以品品之中皆明悟道也次釋開章門中經雖有七會大分為二初六會明佛法即是果次一會明菩薩法謂辨因因果是眾義之大宗立信之根本也又譬喻品云為諸聲聞說大乘經名妙法蓮華龍樹釋大乘凡有二義一諸佛大人之所乘故故名為大二觀音彌勒諸大士等之所乘故故名為大今具欲釋大乘故前明諸佛法後辨菩薩法也果分為二從初竟神力品正說次一品明付屬宣通初分又有二一明三世佛所乘法二明能乘人具此兩門乘義乃足約三會說之初會別明所乘法次會別明能乘人第三會總為十方具明人法也以此經正明一乘宜作此判也又初會但明乘權乘實法門次會明四種權實謂身權身實壽權壽實違權違實土權土實也第三會普為十方具明四種權實以此經具開一切權實故作此判也就處論者第一初會在穢土第二會在淨土處第三會在亦穢亦淨處又初會在娑婆一佛土處第二會八方各四百萬億那由他土處第三會十方通同成一佛土處又初在有處說次在空處說次住空普為十方空有處說約人論者初會為小眾說次會為多眾說第三會為十方眾說又初會正為二乘人說故經云為諸聲聞皆說大乘經名妙法蓮華第二會為菩薩說所以然者三根聲聞並迴小入大聞法華經一念隨喜悉與授記並成菩薩是故從第二會已去但為菩薩說第三會通為十方五乘人說又初會雜為五乘人說低頭舉手悉皆成佛會人天善根明同歸義故為人天說汝等所行是菩薩道會二乘成佛即為二乘說菩薩聞是法疑網皆除為菩薩說第二會獨為菩薩說既會五乘同歸一極則無復餘人但欲令其人進悟身壽權實故為菩薩說第三會十方世界既有五乘眾生故通為五乘人說又初分前悟即是上根故為上根人說次會為中根人說第三後悟為下根人說次明利益者初會三根聲聞皆迴小入大入十信位名為淺益第二會通淺深益始發菩薩心終一生成佛第三會還明淺益謂十方眾生隨喜供養故為淺益又初二會親承音旨名為近益第三會遙得見聞名為遠益約時論者初少時說次多時說如五十小劫問訊等次無量時說後云滿百千歲然百千歲望五十小劫應短但後既明化廣宜總相辨長時也就第一初會明乘權乘實又開為三初明乘方便門二正說門三歎法美人辨流通門從初竟方便品至舍利弗願樂欲聞已來第一章也從佛告已下竟授學無學人記品第二章也法師一品為第三章也乘方便門者從寂滅道場頓化子不得無緣大悲故起四調柔及十種方便至於靈山方化得子四調柔者華嚴已後靈山之前教也一以世間方便調令離十惡二以出世方便調令離三界三以大乘自方便調令漸欣大道稍鄙小心四以大乘他方便令小志頓移大機成就前二方便調令超凡後二方便調令超聖又前二方便調令得方便實慧後二方便調令得實慧方便又前二方便調令離分段火宅後二方便調令離變易火宅後當具釋之次明十方便者雖昔用四調柔但一乘難信二執難傾將開正宗復興十種方便亦名十種密說將前明顯說前須密說用前之密開發後顯故名方便方便之言出下誠文故經云今相如本瑞是諸佛方便又云更以異方便助顯第一義也言十種方便者初召集證明方便將命其子故前召集證明如信解品云先告其子并會親族亦如化城品云便集諸菩薩為說是乘所以須召集證明者勝人雲集證佛語非虗明實是長者之兒非貧賤客作此即證一乘是實有證二乘為實無亦證一乘為真實二乘為方便故有召集證明方便即四眾圍遶是也然此中間實具四眾一發教眾二影嚮眾三當機眾四結緣眾取前二為能證後二為所證又列眾望前是第六同聞望後即是證明文句是大判為言耳為諸菩薩說大乘經下第二明說教方便後會之經為明於人則以人開人故有多寶分身及踊出菩薩開顯釋迦身壽權實今正明法故以法開法將明攝多歸一故前辨從一生多從一生多開發攝多歸一故名方便佛說是經已下第三入定方便總統法華凡有二義一者明開謂於一佛乘分別說三二者辨會明我設是方便令得入佛慧前從一生多密明於一說三為開印方便令如來入定捨多住一密說會三歸一為後會作方便所以然者佛既捨多住一表三乘諸子同歸此原故下經云佛自住大乘如其所得法以此度眾生令入定中自住一後從定起還說佛所行亦令眾生行佛所行得住佛所住又如涅槃云我自安住秘密藏中亦令諸子及一切眾生安住其中故名方便又如來入定現瑞發動疑情待彌勒之問文殊之答預杜疑心逆開信解方得起定說法是故聖嘿為聖說方便問何故說無量義經而還入無量義處定答法華論云無量者明如來㝡勝境界今應入㝡勝境定後說佛乘也還說㝡勝境界法也又㝡勝境定者有四種㝡勝自在力一身心不動即身心俱靜寂靜故鑒極方能說極法故極病照極藥也是時天雨華下第四明現瑞方便諸子有受悟之期未得明言顯說故雨華動地放光現土示還原之相表說歸宗之經名現相方便又大聖益物凡有二種現瑞則生於信心說法發其慧解故生信之瑞為發解方便又諸佛利物復有二種一令種福二使殖慧現瑞殖福為說法生慧生慧之由漸故名方便又諸佛令物歡喜凡有二時一者現瑞明將說歡喜二說法明正說歡喜故三根踊躍十二儛蹈用物歡喜開發後門名為方便又凡說奇特之法必感非常之瑞覩非常之瑞必信有奇特之法故以能表之瑞開發所表之法名為方便爾時彌勒菩薩下第五明疑問方便如來以此光照彼彌勒廣頌彼曉此故名疑問方便爾時文殊下第六答問方便佛與菩薩彌勒將彼顯此文殊引古證今明古佛說之於前釋迦敷之於後預杜疑謗之萌逆開信解之漸名答門方便爾時世尊從三昧起明第七稱歎方便將說究竟之乘前揄揚諸佛大道如欲救患必須前美藥功能謂稱歎方便舍利弗當知諸佛語無異者明第八勸信方便既稱歎一極敘三乘不知言與昔相違恐物驚憚故略開權實勸使信之名勸信方便爾時大眾中有諸聲聞下明第九勸請方便前歎佛智甚深二乘淺劣動其舊執生彼新疑大眾遂執動疑生身子騰疑致請讚人美法抑小揚大今時眾尊人重道捨小欣大以此顯發密教調伏眾生為正說之由漸故名勸請方便爾時佛告下第十顯鄣方便顯封執小乘障隔大道現在不聞法華未來不得成佛使二世眾生捨小崇大現在聞經當未來成佛開正悟由漸故名方便然約義為十據人唯三從初至勸信謂大乘人為方便勸請一事小乘人為方便五千退席惡人為方便又前九為順後一為違後正說中釋迦調達亦具斯二今次別釋其文說無量義經有十因緣如彼疏今略有三意初上根之人聞從一生多當教受悟二此經示三乘六道失原至法華方得歸原三動封執之情後方可得拔也為諸菩薩者密顯唯教一人說大乘經下密顯唯有一理也教菩薩法者從一生多令菩薩歸根本一道即是教菩薩法也又從一生多即是體用具足照此體用四智便成了雖多而一生如來智識雖一而多生於佛智任運成就為自然智不從師得即無師智教主四智則入佛智見故得成佛釋佛所護念者菩薩分生四智行與佛應為佛護念但應有二種菩薩學佛四智即超凡越聖不著生死不染涅槃此是護因故得為佛護果次行中道因發生正觀得佛念果餘人不具二因故佛不得護念又悟雖多而一得於波若為佛念之因故得佛念之果了雖一而多得於大悲為佛護因得佛護果釋入無量義處定無量者能表之教非一也義者適化不同教門非一各有所以故稱為義印師以萬善為無量義基公以空為無量劉公以無相一法含於多義皆失經旨處者無量文義出生之處即是實相法身故名為處身心不動者既入實相則內外並䆩緣觀俱寂故不動也釋現瑞就現瑞文自開為二初現所化眾生成佛相二現能化佛說法華相以此二相助開一極故云方便如下經云今相如本瑞是諸佛方便今佛放光明助發實相義現此二相各開兩別初文二者前明現瑞次明覩瑞現瑞相說於法華天雨四華地六種動此表所化眾生成佛之義即以此事為說法華但斯言有通有別所言通者既說非常之法天靈歡喜故天雨四華地祇踊躍故地六種動又依文殊偈釋雨華表供養能說之人大地動表說於大法又雨華表供養能化之主動地覺悟所化群生又雨華供養已成佛動地表所化當成佛所化當成佛故地神得主歡喜大動所言別者正就雨華動地說於一乘天雨四華表四生行因得成佛也地六種動者六道聞經得成佛也又天雨四華地六動者上天下地其有聞法者無一不成佛亦如譬喻品云汝等若能信受是語一切皆當得成佛道下列覩瑞之人即是總明三乘六道皆成佛也又正對昔封教之人謂二乘六道不定成佛故今現相示之四華表二乘四眾必當歸本作佛地六動表人天六道定當成佛故下文別舉四眾及六道之人明覩瑞也又四華者表說四智謂如來智佛智自然智無師智問何以得知故答下偈云說佛智慧故諸佛出於世又初從定起即歎佛智甚深多寶稱善云大慧平等又雨華是供養法華教主及聽法華眾生聞經眾生當成佛教主已成佛也釋爾時佛放光此第二表能化佛說法華相就此相中具足說一部經亦具足明十方三世能化所化事若解此中意者方悟彌勒說偈旨歸及如來起定說法之意所以然者彌勒及佛起定就說法輪說法華經今就神通門說法華經就文始終凡有十句始自是時終竟上照天宮以此十相即十種義說法華是時者謂放光時即表說經時節如下經云今正是其時決定說大乘亦後云涅槃時到也言佛者明第二故光人表說一乘教主亦是能乘之人也眉間者第三明放光處對教主即一乘教也對能乘之人即所乘法也累無不盡不可為有德無不圓不可為無非有非無即是中道也然所乘之法既是中道能乘之人亦是中道人故涅槃云中道之法名之為佛又佛住中道之法還欲說中道之教故眉間喻於教中住中道即是理中所說之教既其是中說教之人亦名為中道故涅槃云說中道故名大法師白豪者明第四上辨眉間是通處今敘別處表所乘之法無漏清淨猶如白豪能乘之人亦無漏人故下經云無漏不思議甚深微妙法我今已具得下又歎佛於諸怖畏乃至無明闇弊永盡無餘故知表無漏清淨法也又普賢能乘之人身白玉色所乘之象如白頗梨普賢既爾諸佛亦然所住之乘既無漏清淨所說之教義亦如是又此經開一切權顯一切實義最顯明故稱白豪藥王品云眾明之中日明最盛即其證也光明者第五正放光也上眉間白豪表佛乘無德不備今別表平等大慧乘雖萬德而慧為其宗後品云佛起定說法具歎總別故今以相示之光有二義一者顯物二者破闇表大慧經亦具二種一滅三乘執闇二顯一乘理實故藥王品云如日天子能除諸闇此經亦爾能破一切不善之闇照東方下明第六相光所照處也上之五事表能乘之人所乘之法及總明眾德別敘大慧謂此方事也今欲將彼顯此故此光照彼能照之光表一乘教也所照萬八千土即教所表理也東方者所照處也何不照餘方但照一方者表說法華明一乘事究竟二者舉一方十方皆例如釋迦一佛既作此說十方佛爾是故後經文皆引十方三世佛為證又一方者表唯為一事因緣出現於世一方之中而舉東方者東為眾方之本表一乘為三乘之根又東方為始舉始攝終及中間也表始自華嚴根本法輪中則三乘支末之教終則攝末歸本也一萬八千者明第七第八相故也問餘經放光尚照多方此經最大何故但一萬八千答今是相說不論多少若照多土不得顯一方化訖今欲明土有限極得顯一方化周故不照多也問既表一化始終何故但照萬八千耶答一化雖多不出因果果圓如一萬因不足同八千是故此經以因果為宗顯在於此問何以得知故答曰彌勒見佛現通懸解瑞意故後偈釋之佛坐道場所得妙法即是果也為當授記所謂辨因又一期出世教雖萬端統其大歸但明權實此經顯實究竟猶如一萬開權未足八千表之彌勒偈文亦含斯意佛坐道場即顯實耶為當授記謂開權也問曰乃知一萬表果何故古佛今佛同以八千表因不多小耶答長者之父無二唯有一萬世子五百人故成八千約前所化瑞論者能化無二故放一光猶如萬也二乘及六道故有八千約大眾覩瑞論者六道二乘故成八千化主唯一猶如一萬約九道分之即三乘及六道也八道為因佛道為果也又此中有以同表同以異表同以同表同者古佛今佛同放光照萬八千故知諸佛道同也以異表同者古佛今佛雖有一萬八千土異同表一道清淨也勿不信此語別有深見也問涅槃經云流離光佛放光大眾之中非青見青乃至非見而見今云何耶答正爾同也今佛放光此是非青青非色色耳說法亦爾非說說耳今大眾覩光亦是非見見聞法不聞聞耳乃至一部經一切佛法並須如此解也靡不周遍者是第九相也表自上已來若此土他方明因辨果顯實開權教無不周理無不備即歎法華結束融會一化始終圓滿究竟下照阿鼻地獄上至阿迦膩吒天者明第十相也自上已來表諸佛相此之一章示眾生相所以此土他方開權顯實明因辨果者為欲化六道眾生令六道迴宗同歸一佛果也上能化相總而論之謂因果權實四種義今所化事亦明四種舉地獄示諸苦顯天宮示無常又舉地獄誡令息惡示天宮勸令修善以誡勸之言即世間教自上已來明出世教此相之中世與出世義無不顯又雖開為十相合唯成二從初至放光即此土事東方已去謂他方事各有二義此土二者初謂教主放光即是教門何以知之佛既放光如教主說教他方二事者初明諸佛事下照地獄辨眾生事所以示此二者大品云波若為大事故謂示道非道示諸佛事示是道也明眾生事示非道也示道之中略唯因果非道之中苦與無常是故放光表說一切事盡又依文殊偈前瑞有二初雨華二動地如向釋之今亦爾二謂照諸佛事及示眾生事照諸佛事即是引門示眾生事所謂通門引門令欣佛常樂逼門厭苦無常又照諸佛事即是大慈與樂門示眾生事大悲拔苦門又即是下救子不得中二事照諸佛事謂勸門說一乘示眾生即誡門說一乘初成道時不得用此二門今始得用故現相表之於此世界盡見彼土第二明覩瑞前現瑞有二種能所一者此光照彼此為能顯即表於教彼為所顯以表於理二者將彼顯此彼為能顯即表於教此為所顯用表於理今大眾覩瑞具見二種能所一者因此見彼謂因教識理二者見彼顯此又是因教悟理取一種理教為說經之相取二種見義為後了悟作相至彌勒偈中自了了分明勿疑之也總統此文有一義二義三義四義六義七義十二義言一義者始自六道終竟起塔明他方一化始終究竟義也即表釋迦說大慧經亦明一化始終事所言一化始終事者初明失於一道故有六道紛然既有六道紛然便有諸佛出世既有佛出世次說教門既有教門便有稟教之眾既有小乘四眾次轉成菩薩化菩薩既竟便入涅槃戀仰情深所以起塔故一化盡矣又一義者雖有七事意終歸一道清淨故文云如來說法皆是一相一味也言二事者前明六道謂眾生迷事化主已去敘諸佛悟事又二事者從初竟於四眾辨諸佛事從菩薩竟起塔明菩薩事敘諸佛事即是明果辨菩薩事即是明因此經以因果為宗故示此兩令眾見之此義現彌勒偈文勿疑之也又二事者從初竟於四眾辨從體起用次從菩薩已去敘攝用歸體亦顯後偈文又二事者從初竟菩薩明乘權乘實事從涅槃起塔辨身壽權實事又二事者從初至菩薩化不失心子事涅槃起塔化失心子事次明三事者在事雖七但有化主教門及以與徒眾敘佛及涅槃謂化主事說法即教門事自餘四種皆是所化徒眾又三事者從初至說法明根本法輪事敘四眾即支末法輪事菩薩已下辨攝末歸本法輪事言四事者法華前有二事從初竟說法謂根本法輪敘四眾明支末法輪法華已去有二事一明法華事即菩薩是也二明涅槃教謂涅槃已去事是也言六事者從佛出世竟於起塔唯有六事也又即是六譬見六道謂總譬化主即見大譬教門即根本法輪謂救子不得譬四眾謂三乘救子得譬菩薩即等賜大事譬既等與大車得車歡喜於事究竟是故涅槃及起塔欲見此意可觀火宅偈及彌勒偈文以釋迦說法華將明六事故此光照彼將彼顯此也十二事者諸佛出世既有六事所化眾生亦有六道合十二事也佛現瑞中含此諸意今令大眾並覩見之至彌勒令了聞起定說法了了心悟也爾時彌勒第五明疑問方便問何故大品現七瑞而眾無疑此經現二瑞有於疑問答大品為直往菩薩無自保之執現瑞召集竟即說波若是故無疑此經為迴小入大之人其根既鈍又有自保之執故久住深定發動疑心待彌勒之問文殊解釋方得起定說法故有疑也又大品雖是大乘而未癈小言猶扶昔是故易信此經癈小言與昔違難可信解故生疑也問何故彌勒懷疑答依舊義釋此經初分明因為因經作相故現瑞者彌勒是窮因位之人何所疑哉假令俯同於物事亦不成今明初分經正明果乘現瑞為果乘作相因位未了是故生疑也而問文殊者佛說果乘故現於果相唯果人能知彌勒居等覺之位住於十地見未了了是以致問文殊是妙覺之地無所住故故了了見是以能答更有餘義後當述之釋彌勒問前明問意欲自決疑自欲成佛也為眾決疑令他成佛正問中初長行次偈頌長行與偈異者長行略說偈則廣明前略後廣為解義故二長行前明所化瑞後辨能化瑞謂前感後應即感應次第義也偈前頌能化後頌所化辨前有佛出世說經後眾生聞法成佛作諸佛出世次第義也三長行現兩瑞為一類二都瑞為一類即有兩感兩應也偈中各明現瑞各明覩瑞欲顯瑞有能所見亦不同此明轉勢說法故其言各異四長行總相而說偈分彼此不同前明此土之瑞次辨他方之瑞謂總別不同亦是解義之體諸師皆謂彌勒是問今明彌勒帶解而問佛就神通門開權顯實辨果明因今彌勒以說法輪顯實開權明因辨果可用斯意以尋偈文文殊師利呼質疑之主導師何故歎現瑞之人大光普照敘所疑之事普照者照此土也雨華香風一如本疏明所表二將說妙法前莊嚴處顯在人則人尊居處則處貴三明大眾見處改常必知應說異法所以前問此土者欲釋佛正為此土之緣說大慧經也雨華已下此問所化瑞由佛說經故眾生成佛故次問所化瑞也時四部眾者問所化覩瑞人也偏問四眾不問六道者以此經正為二乘故下經云為諸聲聞說大乘經故也論三瑞廣狹普動十方明佛道同故廣也光照萬八千次也雨華但云而散佛上及大眾狹也問何以知動十方答論云震動無量世界經云普佛世界文殊云一切諸佛土即是普震動三引證也彌勒約偏化此土又是略故但明四眾歡喜也問光何處中答表因果權實又萬八千佛土正釋迦化大同故偏引也眉間光下第二問他方瑞也既正為此土說法故前問此土但引他方為證故次問他方皆如金色此是彌勒頌所見事釋佛瑞旨謂帶解為問顯在於斯他方雖有七事同一金色事一欲顯十方道同使物生信二既同一色表十方同明一乘三欲明乘有二義一者乘有一相門謂究竟涅槃常寂滅相終歸於空二種種相門謂無量億千解脫三昧總具眾德以為乘體同一金色表一相門萬八千土示種種相門也三欲辨放一光具生四智今且就六道作之雖有六道同一金色雖同金色而六趣宛然即表雖有六道常是四絕謂如來智雖有四絕於緣六道宛然如斯悟者名為佛智此二任運現前謂自然智不從師得即無師智乘雖萬德智為其宗故恒須用四智也問文何故但明萬八千土同一金色不明六道同一金色耶答光既普照理同金色但文不說耳又此有深旨照萬八千土同一金色表於道未始二而不明生死同一色者欲明於緣未始同也諸世界中第二明覩他方瑞上有七事彌勒欲釋佛語開三節頌之一者頌前三事次結前生後三頌後二事頌六道可兩望之望前即屬前照眾生事望後屬見六道事也頌教門為二初頌一乘根本法輪次頌三乘支末初亦是隨佛意門次是隨眾生意門東方諸佛唯有此二將彼曉此義亦同然二門各三初三者前明一佛說根本法輪次明多佛說三總明一佛多佛說教之意此三門各有四句即十二意也初四句者一演說經典謂能表之教二微妙第一所表之理三其聲清淨嘆宣教之聲四教諸菩薩下明所為之眾梵音深妙下第二例於多佛亦有四句初明教稱機次句機稱教三明其處彌異第四其道彌同種種因緣下第三總明諸佛說教意亦有四句初敘機不一二教門有不同三上弘大道四下益群生上弘明唯顯一理下益辨教一人也下三乘支末教中亦三皆前敘機然後明教得有餘除苦因際得無餘盡苦果際無二死五住為淨道也文殊師利我住於此第二結前生後所以結前生後者欲顯前是法華前事後是法華已去事二欲明法華之前從體起用從一生三法華已去攝用歸體會三同一要前明從體起用後方得攝用歸體故結前生後也三欲明三輪之義法華之前有二種法輪從演說經典至開悟眾生明根本一乘法輪若人遭苦已下敘三乘支末之教是故結前生後者欲顯法華已去爰至涅槃明攝末歸本法輪是故後文明二種菩薩一佛在世時菩薩即法華教二佛滅度後菩薩謂涅槃教四者欲明因果法門結前者顯前明諸佛法生後者顯後欲辨菩薩法明諸佛法即是辨果明菩薩法所謂辨因彼方既爾今頌彼曉此則辨此經亦明因果故前明佛法藥王已去次辨於因五者欲明四教結前明二教謂根本支末生後亦二教法華教及涅槃教他方一化唯此四教頌彼曉此明此亦同彼六者欲總敘諸佛大意復唯為顯一理唯為教一人結前即明唯為顯一理生後但有菩薩明唯教一人他方既爾此土亦然七者欲釋斯經之題題云妙法蓮華教菩薩法前章釋妙法蓮華故云演說經典微妙第一生後即釋教菩薩法如後二種菩薩之行相八者開權顯實辨果明因凡有二門一用法開二用人開結前明法開也辨一乘根本謂顯實三乘支末謂開權開權即是辨因顯實謂明於果生後用人開者敘菩薩法謂明因也為求佛道即辨果此二即顯實也下明或見菩薩而作比丘謂開權也九者諸佛菩薩說法常儀多前略後廣結前者顯前是略說菩薩生後者明後廣說菩薩所以廣略明菩薩十者欲讚揚大道抑毀二乘使未信大者皆信已信者增長未捨小皆捨已捨者不退皆是彌勒善巧方便助佛揚化故帶解為問初頌六度行菩薩者此經正明因果六度即是因乘故頌六度菩薩菩薩即能乘之人六度謂所乘之法能乘所乘故因乘具矣又此中具明因果敘菩薩行即是明因章章之中皆云為求佛道謂辨果也此中六度次第者初明在家布施第二捨家出家第三出家已後而作比丘誦經以生聞慧第四精進思惟次生思慧第五因思生脩故明修慧第六因禪發慧即是波若名為證慧故十地論中有四慧此中四施三施二施一施無施四施者即從易至難第一一切皆捨第二唯有自所乘車最後施之捨外財既盡唯有妻子身宍故第三捨之妻子身宍既已捨竟唯有頭目故第四最後施也又攝四為三初二捨財次一捨身後一捨命即修三堅法勝鬘云捨身命財建立正法捨三不堅脩三堅法又攝三為二初兩外施次兩內施又攝二歸一總攝為檀又攝一歸無竟無所捨也問何故頌諸王捨國土出家答彌勒欲令大眾聞所未聞諸奇特事前內外傾捨已顯其一今棄國出家復為希有故重敘其二又欲讚揚佛道抑毀二乘前捨內外後棄國城即佛道可崇二乘鄙劣令捨小欣大也又敘生死可厭故捨國佛道之可崇故出家生死可厭謂苦無常佛道可崇即常樂我不爾者不得棄國出家也問曰忍度中何故明菩薩而作比丘答曰亦是奇特實是大心方便為小又前頌二人以密顯一今頌第三次密開權故彌勒頌六度行人具明因辨果顯實開權又見佛子此第二頌三業利益行菩薩即頌長行中種種信解次前生者第六上問諸佛聞悉受持即是自行今次辨說法謂化也問既稱為眾請法何故云化諸菩薩答言囑四眾意在菩薩即是唯顯一理此明唯教一人東方西土果人因人凡有所說皆明斯事並是彌勒密說法華又見菩薩寂然宴嘿者前是言益此明嘿利又上如行而說此如說而行又見菩薩處林放光者上明口意利緣今辨身業益物又見佛子定慧具足下此頌上種種相貌以菩薩循行內成故相現於外此中六度無方行與前異者前是因中六度即地前菩薩今明果中六度即初地以上人也又六度義含已上明其一今次辨其二義乃圓足問何以故前是因後明果答初直明思惟為淺今未嘗睡眠所以為深問云何要備前後二義答前端坐思惟今經行精進要動靜常有懃進度方足問何故次前明於精進答前明救惡道苦謂下度眾生行既未圓故精進上求大道次精進明持戒者懃為萬行之根戒為眾德之本雖又懃行要須戒足也與上異者上明出家為始今持戒為終即淺深相成又要具始終戒度方備次明忍者既精守淨戒喜有羅剎來乞浮囊宜須抑忍又持大乘戒多與小違故增上慢人喜來打罵宜應忍受與上異者上自抑制五情為安苦忍今忍外辱名他不饒益忍忍內為易是因忍外為難是果又要具內外二忍則忍度方成問何故忍增上慢答六度次第行中明或有菩薩而作比丘密開方便門今忍增上慢密斥封執小病是以彌勒頌彼曉此具說法華又明菩薩能忍則讚揚大士敘增上慢斥封執小乘並是密說法華也次因忍明禪者菩薩或出或處出能忍外惡處則一心行禪與上異者上明因禪發動凡聖皆有是故為淺今明住定生慧其義則深又要備生淺深功德藂林義乃圓足此中明禪度菩薩兩義釋之離諸戲笑則口靜也捨癡眷屬謂身業不亂下明一心禪寂即三業皆靜也又初偈明身離所謂離身次偈明心離所謂離心如淨名云不於三界而現身意是菩薩宴坐也次禪行施者入禪以求慧行施以殖福又上明住靜服藥今明患差身康報恩供養與上異者上明四施下施眾生辨次第行今明四施上供養三寶即無礙行即上下一雙亦必須施悲敬二田檀度方滿故前後兩說又前通施今別供養佛僧問前四施云何淺今何故深答百種湯藥千萬寶舍下位所無上地方有故知淺深次施明般若者上明財供今辨法供又前獻財上供今施法下益與上波若異者上是略說今則廣說又前明上問諸佛聞悉受持今明如行而說如說而行又前辨集法藥今辨授法藥習藥是自行為易故是因授藥化他為難故是果故前後六度含成六雙二懃動靜一雙兩戒始終一雙二忍內外一雙二禪通慧一雙二施悲敬一雙二波若自他一雙若不作此明之後出便是煩長初明說波若人者明說寂滅法即說法華智度論云法華是波若異名也次行波若二人異者初人不二觀顯一乘之實次人無著觀破三乘之執又前人顯道本後人拔累根累根者則取著也取著若傾九趣自息又前人明實慧次人辨方便慧言不二觀者中論云如來絕於四句又云如來性即是無間性當知眾生亦絕四句故即是佛華嚴云心佛及眾生是三無差別又云不生差別種種念是人能見佛菩提次波若明起塔者二慧行成功由佛力欲報佛恩故修二行一供養舍利二起塔此之二人皆是菩薩者欲明法華已後無復三乘故也問菩薩起塔與凡塔何異答菩薩了達雖造不為雖成不起具識二諦兩慧俱生為物故起復是大悲一事之中權實並生福慧具備末世造經像人宜學其行也雖寫遍群典而不盡一言彌勒非但頌彼曉此亦留古化今如斯尋文方覺於他於己為益問何故敘寶塔高妙答既得二慧從無漏業興必是高妙問何故云嚴飾國界答起塔多是在家菩薩或閻浮主或轉輪王故嚴國界釋請答文為二初名同人請同人者之五情未惻如來現瑞之旨後稱異情異人者之神明故以髣髴其相又前歎放光美佛神力佛坐道場明說法歎智慧力既歎二力即揄揚佛乘發後信也又明請說意者自上已來彌勒但頌見聞之事以示大眾略釋法華今恐未解更敘瑞意作二周釋之合前所明有三周釋現瑞意是三周說於法華皆示說法由漸從晦至顯第一周頌彼曉此釋第二總釋第三別釋三章各三初章三一頌三事釋次結前生後三頌後二事釋次章三者初歎一光照於他土次歎光表上弘大道第三明下益群生初正表說法後二敘說教意照此土者為此土說一化七事故云種種殊妙光照他方將彼顯此故也並稱一光者表說一乘理也又是歎佛神力我等見此得未曾有者上為說經作相今為領悟作相故後章三者初歎佛智慧力謂說佛因果法門次歎神力能示佛依正二果並是明佛法也後託眾未解請文殊決之釋文殊答彌勒頌彼曉此謂十方同文殊引古證今此明三世一所以明十方同三世一者欲勸信故也若信法華則信十方三世佛法若不信法華則不信十方三世佛法矣所以有文殊答者都是敘釋迦一代事由文殊昔弘法華經匠成八子八子匠成釋迦釋迦匠成彌勒是故文殊為釋迦一代本故彌勒致請今便答之又既是敘釋迦一代並由文殊即是歎文殊道高令信其所說又為成歎法華弘法華故八子成佛乃至釋迦彌勒並皆成佛故法華功用難思令聞佛後說不生疑謗也而云語彌勒者據迹論之釋迦為師文殊為資文殊為師彌勒為資言告上失敬師之禮稱曰復乖下資之儀於二盈之間故云語也問文殊引古證今明說法華與上何異答佛與彌勒皆是總相歎釋法華今則別相說也上總明諸佛總明教謂總相說今別引燈明即別說也別明欲說法華從總至別以示說法階漸故也又彌勒總明三輪文殊別敘經之二分初別敘乘權乘實從燈明唱滅已後別敘身權身實又文殊初總敘通因通果從唱滅已去別敘釋迦因果是故為異欲說大法者此文三句初明教體次辨教用三明教所表理言教體者總一部大乘教也雨大法雨明教用略有四種謂生滅遠聞歡喜生用有四一未發心者令發心即此會二乘及五道眾生也二已發心者令增長謂菩薩聞是法疑網皆已除也三已增長者令成就即八生一生得佛者也四應退者不退下經云聞是經乃善行菩薩道及去佛道近者也又顯天雨無私不潤枯木即五千退席者又顯雖說無心欲令雖聞而不聽又欲說一味之法故則如雨又示平等義如雨又示誨而無惓故如雨也滅用有四如本疏述之言遠聞者初一會穢土聞次會淨土人聞第三會十方同聞又敘燈明過去世聞明釋迦是現在世聞佛滅度後明未來聞總而言之十方三世並皆得聞謂遠聞也上生滅二用亦通十方三世也歡喜用者明盡理之法既暢眾聖之心故十方三世佛普皆喜也即下經云今我喜無畏又云諸佛皆歡喜現無量神力約緣喜者穢土人緣得悟歡喜淨土緣歡喜十方同聞歡喜又三世十方眾生聞生歡喜如身子踊躍彌勒儛蹈即其證也若以此經為無常及覆相者未明盡理之法不暢眾聖之心能化所化皆不喜也演大法義者即因果俱寂權實並忘不生不滅何憂何喜是法不可示言辭相寂滅以終歸此處故最後說之次釋引過去世答者佛及彌勒以將彼顯此令意在引古證今欲明十方道同三世理一預杜疑謗逆開信心故也欲令成聞知難信法者者釋古今將說經前現瑞意為法難信故逆現瑞也此語即是勸大眾信如過去下前所以略說過去者欲總明過去一切佛皆說法華明法華是三世佛舊法即是歡信也如過去無量下此釋法華已去事彌勒章亦然所以明此二事者法華前謂三乘事法華已去一乘事又法華前從體起用法華已去攝用歸體又法華前明根本支末法華已去辨攝末歸本又法華前根本支末二輪法華已去亦明二輪謂法華教及涅槃教此二章大判十方三世佛終始二意故文殊與彌勒皆悉明之也問過去一切佛皆說法華何故乃引久遠時耶答法華經是諸佛舊法欲明以難得值時乃說之以發大乘難遭想故下經云億億千萬劫時說此經聞亦如是問過去久遠一切諸佛皆說法華何故偏引燈明答不深見者止言趣引設有餘意未究其源今明此有深旨餘佛正與釋迦文殊彌勒及今聽眾相開故不引之燈明正是三聖源由及今大眾始末之事故引之耳如燈明為八子初說法華次文殊於佛滅度後重為說之則燈明善其始文殊成其終故八子得成佛燃燈成竟授釋迦成佛釋迦成佛後記彌勒則燈明為三聖之本師是故須引問乃知燈明是三聖本師今引將來意在何處答三聖皆由法華匠成若信法華則信三聖意在勸進是故引之耳名日月燈明佛者用日月為燈明不同寸炎之照灼故云日月燈明也顯群生無智示佛有大慧之明故以為證也又如日月能生成物佛具二慧義亦同然又如後云月取照明以顯理日取滅闇以破迷譬大慧之經具二義也又日月晝夜常自益物如來諸有所作常為一事釋演說正法彌勒已廣敘東方諸佛三輪是故文殊今略說也即廣略互現彌勒未說七善今明之三輪則廣略互明七善有無相類此七善為讚一乘根本法輪不得用餘義釋之平等大慧之經始自如是終竟奉行其文雖殊一道清淨義無有二故三時皆善至妙之道理超四句為深橫絕百非為遠又凡夫淺識不能故為深二乘近情不能量為遠又二乘絕分為深大士未窮為遠又六識不識為深十智不知為遠無名相為物說之其言稱大機為巧合至理為妙又無名為物立名如綵𦘕空為巧雖名無名事如佛影若有如空為妙又妙顯無言為巧即言寂滅稱妙純一大乘為一無有餘乘為無雜究竟無餘之教故云具足南土法華師明此經雖是大乘猶為半字故不得稱具足是無所得法故云清淨本來寂滅名為菩薩故稱為梵佛子行寂滅之觀為行而行義顯彰故稱為相又行是果家之相故云相也離凡夫十黑惡為白非有漏之善為清問此七善凡有幾義答初三就時論善次兩約理教明善純一無雜簡耶明善具足之義就正備論善後之二善就因果論之梵即是果清白行相所謂因也雖有七善意在因果故後明之次復有佛者此中二對初道名俗姓同次對人法同人則有通別二號法則有根本支末欲明二萬佛法華之前同明一乘為實三乘方便從一起三明三無一有故也次明最後佛者第二法華已去事將前例後俱有根本支末將後例前同有攝末歸本問二萬燈明佛皆是釋迦本緣不答詳文正是最後佛也但二萬佛既相繫出世故具敘之例如威音王事問何故引八子答略明十義一是近眾二為佛親屬三例十六或是請法華之主四說同歸正為其人五是召集燈明之眾六具得開經前後二分七為釋迦彌勒本緣八顯文殊道高令眾信受九欲推功法華十示文殊昔高今下其既不定三乘丈六豈是實哉釋時有菩薩名曰妙光昔答不異今答故不明其答昔人名異今人名故敘其名所以云名妙光釋六十小劫前辨說經歎佛智慧今敘延促美佛神通皆是讚揚佛乘便小心欣慕又示大乘有此奇特小教所無即是美法華也又示長短無定故三一非恒又欲歎法華義富文多故須長時而說又古佛說經既有長時猶如食頃欲明今佛義亦如是發起大眾難遭之心次釋燈明唱滅問彌勒但問現瑞所由今答瑞竟即應結詶其問何俟紛紜敘佛滅耶答佛與彌勒明東方現在佛始終七事文殊欲辨過去佛始終七事古佛今佛同明七事者以說法華結束融會一化義備例釋迦後說亦爾自上已辨其始是故今次明其終又自上已來開燈明乘權乘實今敘燈明身壽權實又自上化不失心子今化失心子又自上說經生歡喜之善今唱滅發戀慕之心又自上已來正明說教今唱滅則是歎教諸法實相既已說之無復餘言是故須滅則歎教意也此並就燈明佛意作五對釋之若就釋迦意者古佛說法華即便取滅將古例今義亦同然使時眾會於釋迦起戀仰之心皆聞同歸發難遭之意又古說同歸例今說同歸則於法起歡喜之善今將古佛滅例今佛滅則使大眾於人預起戀慕之悲又從初引燈明佛開發法華初分經從此已去欲開發釋迦後分經開發後分經宜取八子但不可懸引燃燈要須敘彼佛滅乃至妙光弘經始得明燃燈耳具如本疏說又上引燃燈敘十方三世佛通因通果今別開釋迦久已成佛謂別因別果問若爾一切佛不具四權實耶答若久已成佛論權實者一切佛則不必具也若一切佛皆久成佛則破現證當成二世佛也若就現證論身壽權實則燈明佛亦具足也所以然者二乘非究竟故是無常身壽佛乘究竟故是常身常壽故諸佛說初分經即是明常無常竟便入涅槃不須說後分教也即用此言斥於舊說若明佛乘由是無常則一還是二何名一耶又一二俱無常者一無引二之能二無入一之理又若初分經明因未辨果者則燈明佛但說華經不明蓮教名既一半義豈圓哉他問若此經已辨於常更說涅槃則有徒勞之弊答若爾但明一波若於義則圓八部五時應成虗設玄義已辨後更敘之釋妙光弘經問何故明妙光弘經答一欲敘釋迦本緣二歎法華三開經後分四歎文殊高歎文殊高者長行始終敘妙光凡有三時初明時有菩薩名曰妙光謂發經時次敘佛起定因妙光說此中即含領悟經時今敘流通經時又上敘親聞今明親說則古實有斯事使今眾聞不驚疑問何故八十劫說答燈明略說故但六十妙光廣敷是故八十問燈明六十猶如食頃妙光可例之耶答就力用自在則妙光亦能但妙光久住弘經故須廣八十同十六王子八萬四千釋匠成八子一欲述釋迦本緣二證歎法華三明文殊道高四開經後分問今八子與上何異答上例八子為因今明八子成佛為果也釋述彌勒本緣明八子之善求名之惡此二成佛功由法華即歎法華教也又示善無多少並至菩提故經云一切成佛又八十劫說明唯顯一理燃燈入室慈氏昇堂皆成佛者辨唯教一人釋爾時文殊於大眾中說昔未開經二分是覆相之言有如私說今開經始終其義顯彰有類公灼故言於大眾說又釋迦為九世之資彌勒十時弟子文殊處眾無畏為大法師故於大眾中說又文殊為大眾故言於大眾中說問彌勒亦為大眾何故不言為大眾說答彌勒住十地故見未了了欲自決疑故不得云為大眾文殊無所住故見則了了一向為他故言於大眾中說也釋偈文長行四段偈但頌後二者文殊引古證今正為勸信前二為總其義則隱是故略之後二分明所以偏頌總頌一切佛四句一時節日月燈明下明化主次辨教門度無量下敘徒眾此攝一切佛盡徒眾有二初明三乘眾次無數菩薩下辨菩薩眾問何故教一而緣明二答互現又顯理一故教一於緣有二故緣二如一地一雨於草木不同問上廣歎八子今何故略之答略廣互現但今歎為成出家明形心兩離出家明形離修梵行歎心離亦初出形家次出心家頌彼以化此留古以訓今使諸出家人形心俱離天雨曼陀華文殊頌現瑞都為釋上來現瑞意總其釋意凡有二種一釋次第二釋瑞意釋次第者雨華放光皆瑞應故為一類覩雨華放光並是感瑞故為一類也釋現瑞意雨華動地二義放光亦二義所以雨華者佛將說非常之法故感幽靈供養也將說大法故動大地又覺悟群生故動大地又無量眾生成佛故大地動也問彌勒偈但動一方今何故一切皆動答互顯也又上表為此土人說故一方動今表十方道同故十方皆動又正為一土說故一土動遠被十方故十方動釋迦初會則一土動第二神力品謂十方動也釋現光瑞亦兩意初云現諸希有事謂示諸佛事示一切眾生下示眾生事又初示大慈事次示大悲事又初表同歸之教次示失原之人釋流璃波梨色此因光見六事一國土二人物三化主四教門五比丘六菩薩此六事與彌勒並不同互相顯釋問彌勒云何同一金色今何故有種種色耶答乘有二義一者一相門故經云皆是一相一味二種種相門故經云無量億千諸力解脫彌勒顯一相之義文殊敘種種不同具此二門乘義方足是以兩文相間出也又前據諸佛道同今約化儀各異又前表其理不可異今表其教不可同又前表實同今明權異釋又見諸天人彌勒明理未始二六道宛然常四絕故同金色今辨雖同四絕而於緣則六道宛然達前後二義則四智俱生又彌勒顯理同故萬八千土及六趣眾生同皆金色今欲辨化儀異故國土異及人物異也問彌勒何故略歎化主廣歎教門今何故廣歎化主略歎教門答互現耳但以教為正故前略人廣教然教不孤運弘之由人故文殊今復歎人又上廣歎所乘法今廣美能乘人又上廣歎教今略歎教者上明從理起教故教異今示攝教歸理表理同問彌勒何故不明見比丘耶答彌勒明趣一乘機說一乘教次為三乘機說三乘教欲辨一乘根本三乘支末辨於二輪今則大小兩藏舉比丘明聲聞藏見菩薩辨菩薩藏皆互現耳又上開緣開教明隨三一兩緣故說二教今合教開緣合教表理同開緣明於機異如天雨唯一於草木不同又彌勒從初說教至菩薩明三輪今從說法至菩薩辨二藏問何故頌比丘二章頌菩薩三段答略小廣大為符此經問彌勒何故明因果六度今不辨耶答廣略互現又雖有因果不出六度故今但明六則辨上義問應具頌六何故作三章頌之答亦二處互類又今攝六為三初三為戒次一是定後一為慧攝論明六度不出此三又示初三為福行後一為慧禪具生福慧故三節頌之釋從三昧起長行既略今廣釋之開為二別一明緣起二敘正說各有三章初章三者一歎妙光有能發教之功一切所歸信下二歎妙光未來有通經之用如我所說法下三讚妙光有現證之德後章三者一正說法華二敘說教時節三明妙光領持釋唱滅問何故前明令眾歡喜而後唱滅度耶答正子已悟是故歡喜狂兒未醒所以唱滅就一人言之前生歡喜之慧後發戀慕之福問何故授德藏記答即壽量品留此好藥彼明所留之法今敘傳道之人問何故正滅答壽量品中遣使還告汝父已亡此中二事一正滅二利益各二初正明滅次簡滅利益亦二初利俗後益道即兩狂兒俱生福慧問何故云如薪盡火滅答表佛迹身一代永謝瞻奉無已增大眾戀慕之深如父定已崩亡慈顏不可覩問何故頌文殊弘經答自上已來狂兒正子與佛結緣皆已度竟今明與菩薩結緣故菩薩度之又至此已來有三根性一者入正子聞佛現在說法即便得悟謂上根也二者狂子要待唱滅方乃得道謂中根也今是狂中之狂二時未醒待文殊弘經方乃得悟謂下根也問何故頌彌勒求名之失答總佛菩薩四品謂聞佛說悟為上根唱滅方解為中根文殊弘經得道為下根求名久方受悟為下下也佛菩薩中各二品聞佛說得悟為上唱滅方解為下八子因文殊而成為上求名在八子後成佛為下釋諸人今當知問何故有此二偈開㢡物心答上引古證今此以當驗過佛從定起必如我言則古非虗說二偈異者初偈預生其解次偈逆杜其惑又初明唯顯一道次辨唯教一人又初明顯實次明開權也
