body:
  text: 胡吉藏撰譬喻品第三領解義一科就身子領解中有一門二門三門四門八門十門一門者謂迷教故憂今悟解故喜也二門者一領解昔教從初聞佛所說已下次領解今教所以有二領解者還領解佛上說也上有四門初明一乘真實門次三乘方便門三得失門四勸進門初領解者昔三乘方便門次領解今一乘真實門既領二門即是領解得失門既領解得失門即捨失從得信受佛語謂領勸進門也但佛前明一乘真實後辨三乘方便是從體起用今先領解三乘方便後領解一乘真實謂因用入體師資之道義顯於斯師則為化於物故從體起用資受化故從用入體也又佛就今昔次第正辨今教故先明一乘次明昔教故次辨三乘身子就迷悟次第先於昔教起迷故前領解昔教後於今驚疑故後領解今教也次領解三門者佛上自說有二初長行二偈長行四門敘今昔教意身子長行還作今昔而領偈有三乘教意今還領三乘教意佛偈中初明昔小乘教意次辨昔大乘教意後明一乘教如說九部及涅槃即小乘教意有佛子心淨者出昔大乘教意聲聞若菩薩已下明今一乘教身子偈文還領解三乘初敘見諸菩薩聞說大乘而生疑悔領解大乘教意從我本著邪見已下領解小乘教意初聞佛所說領一乘教意佛欲明三乘次第先小次大後一今作迷悟憂喜次第聞大乘法見諸勝人受記作佛故心生疑悔為憂聞今開權顯實故喜故先敘領解大乘失大由執於小乘故次領小乘領小謂領昔教次領今一乘故師資各示一義也次領解四門者一領解同邪教即我本著邪見為諸梵志師二領小乘三領解昔大四領解今一所以有四門者佛一期出世亦有四門一示同外道受學二定及苦行六年二初說小乘三說大乘四說一乘身子還領一化始終故有四門但領佛昔同外道今以身子同外道為異而大宗終是方便同邪次明八門者邪中亦二一初邪弟子二邪師我本著邪見是邪弟子為諸梵志師謂邪師小中有二初聞頞得於初果二聽長爪論義證於羅漢大乘中有二初聞說大乘見諸菩薩受記成佛現在不預勝流未來喪於果德是以生悔二者理中生疑為失不失一乘中有二初疑一乘教主為魔人二疑一乘教法為魔法次十門者八義如前於大乘中有理事兩悔出處二疑故合成十也此十並顯在文恐尋之難見故撰為玄意耳問身子何故示此十耶答曰就迹而言自昔爰今於十事中皆有疑悔是故致憂聞今一乘悟解故心大歡喜二者助佛揚化即以十門說法華經也於中有三初內心歡喜二外形致敬三發言自述領解內心歡喜者謂解今昔兩教生權實二智故生歡喜又領解小乘大乘一乘三教故心生歡喜又領解四門教乃至十門故心生歡喜也餘如本疏問曰身子初明悔次辨疑此有何異答曰初悔是自責愚癡次疑佛心不等又初悔明毀小揚大以取小失大是故悔也次疑令捨小歸大以法性理同則乘不應二初位據迹後約本身子是化人故也問曰云何除此疑悔答曰下明二事皆是自迷非佛不等以我癡故不待大癡故取小非佛不與大非佛獨與小又法性理同乘無有二但我自不待說大忩忩取小於我自成三乘異也又初不待大顯大是真實即法性理同次取小即明三乘是方便故方便有異耳問曰云何名待說所因答曰常不輕品云以菩提果為所因因為求菩提果故說於六度今亦爾也終日竟夜已下第三結歡喜中有二初重明昔憂次釋今喜今喜中有二初明歡喜從真是佛子已下次明自慶也身意泰然者本謂是小果則現在不預勝流未來喪於果德故生疑悔今知小果即是大因故現在預勝流未來不失果故身意泰然又悟小果是大因故是佛子也得佛法分者涅槃經云汝今值我正法寶城云何取是虗僞之物故知取二乘道果不得佛法分也次釋偈文頌長行三章皆廣頌之初中有二前頌歡喜次頌嘆佛頌釋中義含多意一者就今昔領解分之為二初領解昔教二者領解今教以佛方便品中長行與偈皆敘今昔教意身子還領解今昔從初文至疑悔皆已除領解昔教意初聞佛所說領解今教意二者三教辨之一者領解昔大乘教二者領解昔小乘教三者領解今一乘教從初竟令衆至道場是第一文我本著邪見是第二文初聞佛所說是第三文所以領解三乘者釋迦及一切佛辨出世乘唯有於三謂小乘大乘一乘故今悉領解之則悟佛教意盡此三章中各有三初中三者一明兩悔二我常於日夜已下第二敘兩疑今聞佛音聲已下第三領權實則疑悔除也次文三者我本著邪見明昔執也而今乃自覺已下第二執破也佛於大衆中第三敘執破所由也後章三者初聞佛所說述驚疑也佛以種種緣第二領解疑除也世尊說實道已下第三結魔佛有無自悔責也問曰何故前明大乘悔疑答曰昔於小乘法中未知小劣大勝故不生疑悔既聞大乘則知小大勝劣是故生疑悔也問曰今昔俱大何故聞昔大則迷聽今大便悟答曰昔雖顯大實未聞小權是故生疑今顯大實復開小權是以得悟問曰偈兩悔兩疑與長行何異答曰長行略但明一悔一疑偈廣即具二也又長行約事明悔就理辨疑今廣即理事俱有疑悔問曰兩悔何異答曰初據理生悔次約事生悔又初約獨處生悔次約在衆生悔斯則理事出處攝生悔義周問曰悔失幾事答曰始終論之凡失八果不能於未來失化他果次兩偈是自德果自他一雙也自德中前失略次失廣略廣一雙也略則失小乘佛德廣則明失大乘佛德則大小一雙也自上已來失盛德內充從我獨經行時失嘉聲外滿謂名德一雙也問曰下明兩疑何異答曰初據理生疑見諸菩薩已下就事生疑又初獨處生疑次在衆生疑還是理事出處一雙也攝疑事盡矣問曰就理生疑疑何物耶就事生疑復疑何事答曰據理生疑為失八果為當不失約事生疑為失八因為當不失今聞佛音聲已下此明悟開權顯實故兩悔除二疑斷二乘無漏之因不至道場之果則喪果失因故兩疑兩悔二乘無漏之因至道場之果故不失因果疑悔便除我著邪見敘昔執邪執小問曰何故敘此二執答曰前是自敘今述同他自敘者四十餘年獨有兩疑餘中下根人無此事也今述同他者中下根人始終自謂究竟今敘自執則同之也問曰何故自敘復同他耶答曰一欲分三根不同上根有於疑悔復有自執中下根人但自謂究竟不能推求故無疑悔也二者自敘疑悔令物同我我取小失大故生悔者餘亦應然我推理同不應有三乘教異亦令物爾也次述同他執者我初執小乘既是愚癡顯封小執小者亦是癡也問曰但應敘執小乘何故述著邪見答曰一意明執小之緣由故前述著邪二者欲明外道二乘俱為顛倒昔著外故乖內道執小乘故違大教意欲令凡聖俱棄故述邪小二執釋而今乃自覺非是實滅度小滅滅三界分段故非真滅大滅滅無明變易乃為真滅此得此分兩滅之異若如舊說辨佛無常及䨱相常者便不得分二滅不同無由得釋身子領解釋初聞佛所說問曰上已敘領悟竟今何故方述驚疑答曰欲敘身子於釋迦一代皆悉癡迷一於小乘中起執二於大乘中疑悔三於一乘中驚疑欲示三乘次第故追敘初驚疑也又欲辨於三乘中有二種失一於佛大小乘迷二魔佛顛倒前已敘內教迷悟今次明魔佛得失故追敘前事也又於三乘作四種方便敘疑悔作生方便今封執小乘者生疑悔也二滅方便令小乘人滅小執也三勸信方便即前二事生於疑悔勸進求大四遮謗方便即此章是也遮謗者勿謗一乘教主為魔人一乘教法為魔法又敘悟法華破三病一於大乘中疑悔斷二於小乘中執破三於一乘中謗息其心安如海者上半明外能巧說內安如海非魔所有故知是佛也釋從生及出家乃至亦以方便說身子云我見佛從生乃至法華之前七十餘年已來皆是佛非魔今說一乘之佛亦非魔矣大衆不須驚疑又因法開人為成法者一乘既是真實三乘為方便則無生滅身為真佛丈六為方便若不明生滅身為方便者方便是垢衣長者乘七寶大車能乘所乘不相稱也我墮疑網故者佛有實道而我言無魔無實道而我言有是故悔責則例餘人問曰安住實智中頌長行何文耶答曰安住實智中頌長行身意泰然領解文也我定當作佛頌長行真是佛子自慶文也釋述成章問曰何故云於大衆中說答曰昔說身子本學小乘是䨱相今欲開身子本學大乘是顯露說故云於大衆說二欲釋大衆疑疑云昔毀二乘人聞大遂領悟成佛則知小乘無過今欲為大衆釋此疑也三欲令大衆早習大乘得如身子領解成佛也問曰何故述身子本覺大乘答曰前身子自敘明悟解之果今佛敘悟解之因由本習大乘今得大解二欲勸大衆習於大乘如身子得於大解餘如本疏問曰何故述身子中忘斯意答曰一欲因言釋疑身子既聞久學大乘何由昔取小果是故釋云中忘斯意故取小也二欲令大衆牢固大心使不退轉故述取小問曰何故云為諸聲聞說於法華名教菩薩法答曰教菩薩凡有二事一令發菩提心二令修菩薩行本願即菩提心也所行道謂菩薩行行也問曰說法華云何教此二事答曰唯有一乘無有餘乘故唯得發大心不得發小心即是教發菩提心也又凡夫如火宅二乘類惡道並非所求之處故不得起凡夫二乘之心過三界火宅度五百由旬乃是安穩之道故使發菩提心教修菩薩行者法師品云若菩薩未聞是經未善行菩薩道所以然者未聞此經未識道之權實又執有三乘則回遑進退故未善行也今聞道之權實則精識於道有一無二則唯進不退乃名善行故為說法華名教菩薩法雖言屬聲聞意在大乘釋授記章為二第一從初入偈正明授記從其兩足聖尊竟後敘授記之意兩文中各有二初明二者一長行二偈頌後二者一令自慶二大衆歡喜也釋身子請章自陳已悟無復疑悔者一欲生信智人已解則理必應爾故生信也道理必然我今已解則知不達出自愚迷非理不爾故遮謗也釋五衆之生滅若今若昔亦論此身昔說此身生滅為小乘今悟此身本不生滅為一乘昔謂此身生即六道滅之即三乘今悟此身本亦不生故非六道凡夫今不滅異三乘賢聖也世人相與云吾是凡夫身別有三乘賢聖作此說者四阿含教意也依一乘教明者此身非六道衆生亦非三乘賢聖既不兩世是寧當有二非下云佛道叵思議正在於此頌曰身外求明悟終自是昏欲知一乘處還歸七尺中釋佛正說中亦四章經如疏中說又四章來意者第一章經佛自開權顯實第二章經聖弟子開權顯實第三章藥草喻品釋成師資之說第四章若領悟二說堪與授記又四章經者初破凡夫病次破二乘三破菩薩三病既除行與佛應故得佛記就初章中有二初明正說二勸弘經初中又二前長行次偈頌長行中又二開譬合譬開譬中有二初騰前許後二正開譬騰前者長行與偈並為四門一一乘真實二三乘方便三得失四勸信奉持偈四與此大同合總提四門之意用以示之雖有四門唯有兩意所謂但顯一理唯教一人許後者逆抽後六譬大意但顯一理唯教一人譬喻得解者若未能於法說四門領二意令識譬喻六門解顯一理教一人釋立譬喻意一依文為中下根人未悟故立譬喻二為破凡夫保著三界樂故立譬喻三為增上慢人未究竟自謂究竟故立譬喻四為菩薩令識佛說三乘教意及知佛有不可思議功德故立譬喻也釋六譬自古爰今釋此譬文少多不定少則四譬多則有為十今謂六譬為定不可增減第一總譬嘆佛無極苦有極樂第二見火譬見衆生有極苦無極樂第三譬初成道時即欲為說一乘頓拔極苦頓與極樂但聖雖能授物不堪受第四譬既不可頓拔極苦頓與極樂故但拔重苦與其小樂第五譬既拔重苦與小樂竟次拔輕苦與其大樂至第六譬子便同父無極苦有極樂但昔明與小今便賜大大小相違如似虗妄宜融會之故有第六不虗妄譬次約車譬作之初嘆父有極樂無極苦無極苦則父有大車次見子有極苦無極樂則子無大車第三即欲授子大車但未堪乘是以不堪授第四既未堪授大權與小車第五令息羊鹿便駕以白牛但許賜相違宜須融釋故有第六不虗譬次就開示悟入釋此六章初嘆父無極苦有極樂謂開佛知見第二見衆生失佛知見故無極樂有極苦第三頓欲為示衆生令得悟入但物未堪是故息化第四既不得為示佛知見令得悟入且示二乘知見令得悟入第五既示小竟方得示大第六融會如前所明又依下合喻就二果三德釋之下文舉大涅槃果以合大車次舉菩提衆德之果以合大車初嘆佛無極苦則纍無不寂謂佛有大涅槃果也次嘆文有極樂明德無不圓謂菩提果也故初譬嘆佛有二果第二子有極苦無涅槃樂無極樂無菩提果第三譬欲授二果以衆生未堪第四譬權授小涅槃果小菩提果第五譬滅輕苦與大樂令捨小樂得大樂賜菩提果第六融會不異前明若就三德合之初嘆纍無不寂即解脫德德無不圓合法身般若故初明佛具三德次見子無三次未堪授三次權與三德未竝次方堪示以伊字第六如前次就中道作之纍無不寂不可為有德無不圓不可為無非有非無即中道也次見子失中道佛性故六道紛然次即欲便六道回宗歸一中道但衆生未堪次未堪授中且示偏觀次以偏調心後授中觀許偏賜中似如相害故融會之以衆義推之定唯六譬不得增減問依舊得作此釋文以不答不得釋於一句況六章耶以舊宗未明此經具於三德及二果中道則德未圓纍亦未盡何由賜子故不得釋經一句也非但不得通經翻為毀謗所以然者父纍無不寂二死已傾德無不圓則四德圓備而謂猶是無常則五住未傾三德未備豈非謗耶玄章已明今略不具述釋初總譬中有六一化主譬二化處譬三教門四所化五化意六根性亦不得增減此不異舊就總譬中舊釋不開今分為二一者嘆人第二美德國邑聚落舉處取人謂嘆人禮書云四井為邑鄭曰四方里也國語云三十家為邑尚書大傳云八家為鄰二鄰為明三明為里五里為鄉十鄉為都十都為師十師為洲聚者字林云聚積土也韋召云小鄉云曰聚落者說文云草曰零木曰落廣雅云籬也居也邑落之名耳合譬如本疏說其年衰邁已下第二美德於中有二初嘆自德二美化他各分為兩自德中二者其年衰邁依下合意即纍無不盡惑因既斷苦報將傾即衰邁也惑因既斷無復因纍苦報將傾則無復果纍故下文云於諸怖畏衰惱憂患無明暗弊永盡無餘即其事也衰減也邁行也往也財富無量第二嘆德無不圓即是下文無量知見力無畏等也多有田宅已下第二嘆化他德於中有二初嘆本德二嘆迹德各分為二本德中二者一田二宅大慈與樂為田大悲遮苦為宅而言多有者即釋大義也又當欲披苦與樂亦名為多及諸僮僕已下第二美於迹用上明田宅謂拔苦與樂之心事現神通化物拔苦果與樂果如僮運口說法滅苦因與樂因如僕運五通七辨故云諸也又依信解品非止有僮僕亦有牛羊故云諸也此之一譬為下合譬及大車信解中窮子歎父皆用今譬文句為本不得參差宜留意觀之其家廣大不異舊釋唯有一門第三明教門譬問曰三界火宅云何乃用佛教為門答曰三界本來常是四絶故說四絶之教門得出三界以義既相關故用佛教為三界之門也多諸人衆不異舊釋乃至五百者欲明回五趣故有乃至之言堂閣朽故第五化意譬於中有二初明舍之垂崩次火起燒宅前是無常次是衆苦又初是六道舊迷後明三乘新惑也問曰何以得知然答曰此中有新舊兩人五百人即五道舊人三十子謂三乘新衆人既新舊迷亦爾也余昔不觀前後依舊通文多謬上其家廣大總敘火宅總喻三界今別敘堂閣別譬一身前總後別蓋是聖說常儀解義恆法就一身內復開為二初總誘別如堂閣為總柱梁為別以柱梁之別成堂閣之總以七尺之身為總四支百體為別在譬若明合文自現總身有二別亦兩種總身二者一堂二閣同受大患之身為堂而升沉不同為閣雖有同異皆有十時改易念念無常名朽故也墻壁已下第二別明一身諸分依後偈廣頌凡有十物以成一舍長行略舉其四略亦是前略廣意也開則有四合成二所言二者墻壁為外柱梁為內筋宍為身外諸骨為身內所言四者墻為外壁為內如宍為外筋為內柱為下梁為上身下分骨為柱上分骨為梁此之內外皆是大期無常念念生滅故喻頽落乃至傾斜書云外墻為垣內墻為墻墻猶城也宅中垣謂壁也周匝已下第二火起凡有三雙周匝明無處不苦俱時無時不苦也時處一雙也忽然者敘苦因也火起者明苦果也即因果一雙也此四為體焚燒舍宅辨用也體用一雙也長者諸子第六根性譬據昔三根回流不定是故安或約今昔者雖有三十終成一兒故云或也第二見火譬於中有三初見火驚怖者見身火燒樂盡但有苦受智度論云若無菩薩六道中唯有三惡道三受中但有苦受心火燒善根成一闡提喪慧命失法身是故怖也於所燒門安穩得出門有二種初被燒門二出燒門說三界而常四絶即是出門於緣四絶而常三界謂被燒門即四絶不為諸邊所動名安穩道因安穩道而出名安穩出也父常行四絶以自娛而子何遊五塵而求樂故云樂著嬉戲也下云無求出意者自不作實相絶四之觀皆是不求出意也釋救子不得譬具如本疏衣裓者字誥云𧜅𧛾戒音衣上羅也相傳裓音居德反長安女人用衣前分褁子稱為衣裓也問曰不知何者為火等明何義耶答曰上明不信今辨不解火者八苦舍為三界即是無常無常與苦謂果也失是前之二因即毒蟲惡鬼也衆生迷於二果不識兩因問曰東西馳走戲明何義耶答曰上明不信不解今明起惑即是於火宅內覓樂為戲也視父而已者上明無解有惑初成道時不可化耳今明後時可化故視父也釋三車救子得譬問曰三車在門外可以遊戲明何義耶答曰戲是樂以出世樂代上火宅內世間之樂也釋諸子出宅文定四章適其願者第一敘教稱機也即是下文內有智性也心各勇鋭者第二聞教信受也禾芒利為鋭此明即能信為利互相推排乃至竟共馳走者前明信受今第三辨修行文殷勤精進也諍出火宅者第四前既修因今出宅求果即是下文欲出三界自求涅槃釋父見子免難初敘子免難次明父歎喜明子免難大意明有宅可出無車可得也余昔依舊釋四衢喻四解可約昔教出三界證四諦便得涅槃此是見車得車不應更復索又舊明四衢及露地明無五濁亦同上過也望今度教釋者四達曰衢則四方皆空覔車不得露地者仰觀亦空不見有車以五處皆空故不見門外有三車也而坐者亦是顯無有車若門外有車則乘之而遊既五處無車是故端坐也都是為成門外無車及生後索車之譬即是顯有宅可出無車可得也解索車譬此文近接上生以五處求車無從故就父索也昔以索車為難今觀甚易亦美意非一作七義釋之一為成等賜明道理有一故賜子一將欲明道理有一必須前辨三無三無若成有一便顯索車者顯三無也門外有三即乘之而遊不就父索以其索三故知無三以其無三方得賜一舊謂賜索相違今觀為符契二者欲明索少賜多稱嘆佛德索三即賜小也賜一者謂賜多也如涅槃云汝今從我求正法寶值我多有能相惠施三明索僞賜真如子索魚目父賜夜光亦是稱嘆佛也四者用子釋父前明虗指門外權說有三子出門外遂見有三父權便壞以其索三則門外無三則權三義成五者欲分利鈍不同上根領於父意知門外無車是故不索則身子之流中根之人不領父意但執空言是故有索也六示二種聲聞一者愚法不知權有實無是故有索二不愚法知權有實無是故不索七者欲顯子始終三愚嘆父三智道理有極樂之一與之謂父一智也而子愚戀於極苦不從父化謂一愚也二父虗指門外明有三車意在有宅可出無三可與謂父一智也而子謂有宅可出亦有車可求謂二愚也三父智無三可與有一可賜父之一智也子有一而不求無三而反索三愚也讚三智即揄揚大道敘三愚抑毀小乘釋等賜大車先與小樂今與大樂先拔重苦今拔其輕苦前令其越凡今使超聖故有賜車之譬也就文有二初明能賜之人二辨所賜之車能賜之人即能乘之人所賜之車謂所乘之法能乘之人猶是上國邑聚落有大長者所乘之法猶是上其年衰邁及財富無量嘆長者之德但前作是人法之名今立能乘所乘之稱是時長者謂能賜之人各賜下所賜之法就所賜中更分為二初開二章門次釋二章門二章門者一等賜章門二大車門如舊所釋其車高廣已下第二釋二章門初釋大車次釋等賜餘者依舊釋大車譬凡有五失一無文證二依文所明但是果車作因車合之問曰以何文證如是果耶答前總譬中明長者之德猶是今能乘之人所乘之車前既為果今豈因耶又合三車大車並舉果地智慧功德用以此合之大車既爾一車亦然又下合一車用大涅槃果及菩提果以合一車乃至偈文頌合大車皆舉衆德故云無量億千諸力解脫又總而言之斯經正明佛乘能乘既是至人所乘必為極德不應用因合也三依舊合之未窮其理性所以然者依文乃用二果三身及中道法身而釋者乃用無常及覆相等此亦乖傷事深四者依舊所合論佛德未盡所以然者車莊嚴具其事極多少義合之嘆德未盡五依舊所合失其次第然此譬文前後相生具有詮序亦是乖傷事重今所明者離此五失就釋大車文三義二文三者一車二牛三賓從也義二者明大車即是自德餘之二種謂化他德前長者譬中亦前嘆自德次嘆化他就釋車中又開為二初釋大二釋車釋大有二初明纍無不盡二辨德無不圓纍無不盡者即是高廣下偈合云是乘微妙清淨第一於諸世間為無有上是乘微妙清淨第一對二乘之小因為廣也於諸世間為無有上對世間之下以為廣也以五住因傾二死果盡故超凡越聖故名高廣衆寶莊挍者即果地衆德也前明纍無不盡今辨德無不圓即下文無量知見也上歎長者德中亦明纍無不盡德無不圓後合文亦爾故作此釋之周匝欄楯者第二釋車亦開為二前明車外莊嚴喻佛外德次辨車內莊嚴譬佛內德周匝欄楯即是下文十力無畏十力內照如欄無畏外用如楯內照無不周外用無不普義言周匝問曰何故初明有力無畏答曰方便品及下合大車皆明力無所畏故前說此二德方便品云佛力無所畏後偈合云無量德千諸力解脫皆是前嘆力無畏故今前明為欄楯也舊用總持合之一無文二者總持是一德今力無畏為二德以合欄楯二事也四面懸鈴者即是下文有大神力上已明內有十力外無所畏今次為物現通故明神力四面明其大懸鈴喻神力放光動地雨華現土驚悟衆生如鈴覺物故下云為覺悟群生振動於一切舊用四辨一無文二四辨非竝說法神力則覺悟一切也又於其上張設幰蓋者即下文及智慧力也神力則回邪入正智慧滅惑生解故次明智慧力也又於其上者既稱平等大慧今先釋大義故云其上也張設者開示悟入也亦示教利喜也幰蓋者平等大慧也平等大慧最為高顯猶如幰蓋也又幰蓋上遮下覆智慧上弘大道下益群生又幰蓋能有所遮能有所覆智智慧亦爾能摧於邪能顯於正亦以珍奇雜寶而嚴餝之者一修妙因得此妙果以因嚴果故方便品長行與偈並舉妙因嘆釋妙果二用妙戒莊嚴妙慧三用妙定莊嚴妙慧雖照而寂雖寂而照是以文云定慧力莊嚴四以別智共嚴平等大慧謂佛智如來智總名大智是以文云究竟至於一切種智即以別嚴總問曰何故明四種莊嚴答曰即是譬文明雜寶也寶繩交絡者幰若無繩遐持飄鼓飛揚以繩交絡安固不動寶繩者權實可珍喻之如寶若無二慧則墮諸邊以權實枷持不為有無所動譬之繩也得於實慧不染於有用方便慧能不滯無故云絞絡為欲枷持幰蓋故明寶繩交絡為成平等大慧故辨權實即次第也即是後文具足智慧方便波羅蜜也垂諸華瓔者上明智慧內充今明為物外用七辨巧說譬華五音美妙如瓔七辨非一五音不同因之為諸符順群生悅物來衆故云垂也即上品中如來能巧說諸法言辭柔軟悅可衆心從幰蓋至華瓔廣嘆智慧者乘雖萬德以慧為其宗也重敷綩綖者自上已來明車外莊嚴嘆佛四德內有十力外用無畏內外一雙神力現通智慧說法即衣裓機案一雙也今明車內莊嚴也綩綖者為所坐之物謂如來坐解脫床綩綖者此間字書未見其事云是外國槃縮繡大富家重敷蓐上也解脫有四義一安穩義二清淨義三定慧具足如繡義四寂照調順如柔軟故喻之綩綖也解脫有二初有餘二無餘故云重也如下云於諸怖畏及無明永盡即二解脫也又解脫有八故稱為重也安置丹枕者上嘆解脫今美三昧是故前云解脫諸三昧安枕欲臥如入三昧寂照不動又具八解脫住三三昧乃得安穩坐臥涅槃云誰得安穩眠謂住大涅槃及空三昧即其事也問曰何故敘車外則廣車內略耶答曰車外歎外德大乘以外化為正故廣歎車內明內德故略嘆也駕以白牛者自上已來嘆於自德今第二次美化他自德即是智慧化他所謂功德即是下文大慈悲也生公採淨名經意用六通無垢為白牛衆師總望經宗用平等大慧能導引衆行喻同白牛如斯等釋並未尋經始末故有此異通今依前後法譬及文義往推用慈悲為牛義推者車之運動必由於牛大乘化物要是慈悲依前總譬中前嘆智慧自德後嘆慈悲化他下合譬中亦如是說又合三車中大車佛自分明作如是合前將四智合於大車從愍念安樂已下舉慈悲以合於牛大車一車同明果德義無有異詳此一文驗舊通為失又涅槃經嘆佛為大悲牛又智慧居前明於自德慈悲在後即化他德如前有於車後將牛運即是相生次第衆事證據勿守舊迷上自德有二初釋大二明車今明化他中亦二初牛二賓從明牛即化他之本賓從辨化他之迹前長者之譬及後合文義亦如是上開慈悲為二本故有田之與宅今欲譬於一牛故總歎之就文為二初總標白牛二者嘆釋既是大慈大悲故稱為大無緣無漏目之為白引自化他故稱為牛膚色充潔已下第二別嘆釋牛於中有三初釋名二辨體三明用外譬內合義唯有三膚充者明其圓滿釋上大也色潔者嘆其清淨釋上白也形體姝好者第二明體以無相為形體物愛為姝好有大䈥力者第三嘆用初嘆拔苦與樂二用能拔二死之大苦能與三德之大樂異小慈悲故名有大䈥力行步平正者嘆平等用普濟於天下無私於一人其疾如風下嘆速疾用不待作意亦不經時一念即能拔四生之苦與六道之樂故云其疾如風又多僕從而侍衛者第二嘆化他之迹現通說法遍滿十方故稱為多屈曲適心喻之為僕迹不及本猶如後從現通說法能顯於正為侍能防於邪為衛釋長者是財富無量立此一章正為明父有車方得賜子前與三車則拔重苦與小樂斷其四住謂拔苦因令離分段除其苦果令修三學謂與樂因四智究竟與小樂果令斷無明謂拔輕苦因離變易生死免於苦果令回小入大十信行成謂與大樂因證三德涅槃謂與大樂果而四時五時釋此經者但得拔重苦與樂不得拔苦與大樂則父無賜大之義非唯無賜大乘車彼明此經之佛五住未傾四德不備則父無大車以何賜子又父無大車則無有開佛知見無以賜子無示悟入此則破十方三世諸佛究竟之道既破於實亦復無權無權無實破出世間亦破世間依今所明權實義成世出世立問曰立半滿義者云一切小乘經不究竟大乘究竟則法華是究竟教父有大車復用賜子與今釋何異答曰有所得人齊此前語住今明至第五等賜大車則九道衆生俱證一極法身無復九道之異本對九道異是故有一既其無有異寧有一耶如是五句言忘慮絶故不同半滿所釋也釋不虗譬所以有此譬者一為勸信昔許三今遂不與昔不許一今遂與一則今昔相違便不生信又今昔相違則今昔教並不可信昔許三遂不與三今許一何必有一故須融會令物信也又此譬來者欲嘆佛故也如問他云本許少物今遂與多此是虗不作此言者不明不虗乃欲令前人歡喜嘆施人大恩故是嘆佛問曰世人許少遂不與之佛許二乘亦復不與將世人何異答曰世人許小而不與之不能令前人得益佛許二乘乃不與小果令得大益故得出三界及作大乘因也問曰前明與小果後與大果此有何妨答曰若與小果便不得與大以其人便謂小果究竟故不得更與大乘果問曰若爾亦應不得前拔小苦後拔大苦答曰實有分段變易二苦故前拔小苦後拔大苦道理無有小果故此非類又有不虗譬來者為欲抑揚小大故來如前許魚目而遂不與不許夜光而以賜之即是欲明小僞大真復是稱歎佛也又不虗來者欲明有無義許小而不與明無小也不許大而與大明有大也釋身子答中有二初明昔不虗則釋許而不與意次釋今不虗釋與而不許意此釋今昔權實一切諸教並無虗妄非止局釋迦遍通餘佛昔不虗中有二初正釋二舉況余講多遍於此一句時暗時明今詳文正意者初正釋明文但令子免難全身已是不虗次舉方便況者前明不現通說法令子得益尚自不虗況復方便著弊垢衣密遣二使令子得益豈是虗耶故前文不云方便後況舉方便意在此也又一意泛論初文就子明不虗次舉子況父就子明不虗者昔無三說三今得四益是故不虗一實出三界二全身命即大乘因三行大乘因得出變易四出變易便證法身是故不虗舉子況父者夫疑父虗正是於子子今得四實益已自知父不虗況復父心令子得四益而是虗耶就今不虗中亦有其二初舉昔次況今言都不與車而不虗者父知有苦可出脫無車可與有失可出意令出苦無車可求意不與車故都不與車無有虗也況本有大車本意欲與復令子得益寧是虗耶釋得車歡喜問曰今賜一車為與一為不與一答交與一因賖與一果現與一因當與一果所言交與一因者令悟此小果即是大因故云汝等所行是菩薩道既與現一因必得一果故與其當果問曰得車歡喜定是何時答曰乃通因果二時當現兩得而意正是就後得佛時為得釋合總譬還依譬文開之為二初正合文二合嘆文德則為一切世間之父者合上舉處取人也此中合二種世間一國土世間二衆生世間故云一切也國土世間即合上舉處取人也衆生世間者諸佛為三聖之尊六道之父故言一切世間父也於諸怖畏已下嘆父德也於中有二初嘆自德二嘆化他德各開為二初中兩者一歎纍無不盡次嘆德無不圓纍無不盡又開為二初無果纍二無因纍此二則合上其年衰邁也又即是其車高廣而悉成就無量知見合上財富無量謂德無不圓即大車中衆寶莊挍也力無所畏者無量知見總嘆佛德總合大車德無不圓今別嘆佛德別合於車力無所畏即大車中周匝欄楯有大神力即大車中四面懸鈴及智慧力即上張設幰蓋具足智慧方便即上寶繩絞絡大慈大悲已下第二合化他德於中有二初化他之本次化他之迹化他之本即合上田宅大慈與樂為田大悲拔苦為宅即大車中大白牛也而生三界已下第二明化他之迹前明慈悲二本今明慈悲兩迹慈悲之本即是白牛慈悲之迹即是賓從從初至三毒之火明大悲迹教化已下合大悲迹此二合前總譬中及諸僕僮也兼合餘五譬者而生三界合上化處為度衆生謂五百人及三十子生老病死合上化意教化之言合上一門竟釋見火譬譬文有三今但明能見所見所見中四苦一現世苦二生報苦三後報苦四總結衆苦此四為後火起作譬本今廣明其法後廣作譬喻宜須憶之合救子不得譬初總明慈悲者初明父有極樂無極苦次敘子有極苦無極樂是故即明欲大悲拔苦大慈與樂也釋合三車譬上為說三車有四今具合之而不次第初明為說三乘即辨試義次合第三勸速出以明勸義試令捨苦勸令求樂欲以試勸相對次第四保與不虗者雖勸出宅求乘恐未必得故明保與不虗次稱嘆乘合第一示車處雖復保與不虗猶恐不取故次嘆所與之法故超頌之以相成也自在無繫無苦已下明有樂又初是自在後是富貴次釋諸子出宅求車上總今別明三乘人出宅即三初中有二初別二總結別中合上四即有四內有智性合第一適其願故從佛聞法信受合第二心各勇鋭殷勤精進合上第三競共馳走以辨修因欲速出三界自求涅槃合第四出宅求果合緣覺人但無內智性餘三同上合菩薩求大車亦三聞法信受合上勇鋭殷勤精進合互相排權求一切智合上爭出火宅此中有二初明所求之果從菩薩求此乘故明能求之人所求果中有一二三六所言一者總明一大車也言二者前明智慧愍念已下次辨功德以極果莊嚴為大車體也所言三者一車二牛三賓從也所言六者此三各有二車中二者一別明四智如來知見已下總明諸德別明四智即上幰蓋等總明諸德謂欄楯乃至丹枕之流愍念已下第二合牛亦開為二愍為大悲念為大慈愍念為慈悲已下明無量即是大義三車中大車猶是一車但昔對小故名為大後大車廢二故稱為一故猶是白牛安樂已下此釋賓從上明慈悲之本為牛今慈悲之迹為賓從也初明慈迹度脫一切以明悲迹故開成六事也釋見子免難等賜大車二譬所以雙牒二譬者見子免難脫重苦而得小樂等賜大車次拔輕苦而與大樂故雙牒合也問曰上何故索車方賜今不索而賜答曰上示子愚乞小父知與大又具有七義如上明之今明若子求方與則父本無與意今示父本意欲與不待子求又上示待請方說今雙示真友不待請如慈母之赴嬰兒雙合二譬即二合子免難譬中有二初明見子脫重苦得涅槃樂已下見子得小樂合等賜中開之為四初明父有大樂故應等賜二明皆是吾子故應等賜三辨不應不等即是上譬中愛無偏儻皆以如來滅度已下第四正明等賜就等賜中對上二章第一對上脫重苦故明等拔輕苦是諸衆生對上第二見子得小樂今明等與大樂此中則是極地二果初是大涅槃果次大菩提果以斯二果等賜諸子與涅槃經不異又初是解脫德後是般若法身亦與涅槃三德不異而光宅等乃言壽量終入無餘還是小滅既是小滅猶是拔子重苦未拔輕苦但有與小竟無賜大開善莊嚴明此經未是顯了常住並無大滅云何得等賜大車拔子輕苦又總四時五時謂法華非究竟乘有四大罪也一者十方三世諸佛證得此中道乘而言此乘非是究竟破十方三世佛法也二者寂滅道場初成正覺為此菩薩還說此乘此乘既非究竟則華嚴非究竟三者佛初成道即欲以此乘而賜諸子若此乘非究竟則應發旨以為不究竟法而與諸子便傷父子恩情乖諸佛本意四者靈山之會復與諸子不究竟乘則違世尊法久後要當說真實又衆師多言三車一車並是因乘今依文及義悉皆是果三車所以是果者欲示逼引二教令欣厭觀成說火宅是逼門嘆三果車在門為引門令諸子厭三界苦欣三界樂而出火宅也一大車是果亦是逼引欣厭小乘非究竟為逼佛果大車是究竟為引今厭小而欣大也又說小車非究竟令厭變易生死嘆佛果車究竟引出變易若作因車皆違此義又假令此車是因者亦非究竟因佛初成道華嚴之會亦說此因則華嚴之因亦非究竟又是初成道時即欲以究竟因而賜諸子亦乖父子恩情也問曰大品何故辨因乘答曰般若中不作逼引門明義直作因果之名令菩薩修六度因乘得至薩婆若果也譬如長者有一大宅法華玄心迷悟義一科窮深廣無教不統無理不攝無視不照無纍不忘宜遊之在心諷之於口今先敘佛出世大意長行與偈大宗略同轉勢說法明義各異長行一周作諸佛出世化物次第故前嘆法身纍無不盡德無不圓然後垂應入於六道教化衆生衆生受化乃至得於大車還同於佛今偈中作迷悟次第廣敘生死過患即是敘迷次作諸佛出世化物次第即是返迷從悟故分此偈為二車初頌總譬即是敘迷次頌四譬明返迷從悟前亦是失一道成六道即出原義後收六道歸一道謂還原也一切教門不出斯二矣問曰偈與長行何故作此二意答曰要具斯二義乃圓足復若不作感應次第者前何由即有諸佛出世耶問曰何故前作諸佛出世耶答曰要須前明諸佛出世示衆生得失然後乃有感應義耳故前四句之中要前明諸佛自開法身然後乃有示悟入也就迷悟中先各開四次合四成二次合二成一所言四者一明舍形相二五百人三毒蟲四惡鬼次合四成二者一生死果二生死因敘三界舍形五道差別謂生死果毒蟲惡鬼謂生死因果中竪論升沉不同故有三界橫論優劣故有五道因中起愛為毒蟲起見為惡鬼此二攝一切因果事無不盡矣次合二成一雖因果不同同是生死顛倒故前云示一切衆生生死業報處次出世間亦開為四合四成二合二成一初開四者一種三乘種子名三十子次修三乘行得成三乘人謂昔稟教人也三聞一乘教並成菩薩四究竟了悟即名為佛謂長者是也總論因果者前之三種並皆是因長者即是果也次合二為一總名出世間也今次約此一人具此八事即釋三十子始終迷悟也有此報身即三界舍形既是人類即五百數攝於報身貪著五欲更起於愛名為毒蟲若稟邪教起於諸見即是惡鬼值諸佛菩薩說三乘教即三十子修三乘行成故成三乘人聞一乘教即成菩薩究竟了悟即是長者是以一人有於迷悟故成四種此八事似如十勝相苞攝迷悟事無不收若如有所得人齊此語而住言有迷即是生死無常了悟法身常住則成斷常二見故中論云有所受法者即墮於斷常又云涅槃滅相續是則為斷常若是斷常還成牛頭鬼耳故知有所得生死涅槃並成生死然識涅槃方識生死既不識涅槃亦不識生死何由得出宅耶今明本對迷故有悟耳在迷既捨悟亦不留如是亦迷亦悟非迷非悟五句自息佛不能行佛不能到是法不可示然未曾有何示云何有不可示故肇公云注忽恍若存若亡五目莫覩其容二聽不聞其嚮但無名相中假名相隨義立之且舉一經一論在經名為妙法在論稱中實說妙法名經明研中觀稱論又說中故名妙研妙名中佛菩薩言異顯道意同也次釋偈文頌五譬意者第一頌總譬廣敘生死過患第二頌見火譬作諸佛出世法身照機以本垂迹度脫群生頌第三譬初成道時即欲說根本法輪頓欲拔其極苦頓欲與其極樂而物不堪受是故息化頌第四譬既不堪受根本法輪且拔其重苦與其小樂為說三乘支末教也頌第五譬以三乘法調柔其心次拔輕苦與其大樂今纍無不盡德無不圓謂攝末歸本法輪也此五攝一切能化所化迷悟事周雖頌五譬合成二章初敘衆生事次頌四譬明諸佛事釋迦放光文殊引古皆明示此二事故佛今頌此二也示衆生事即示非道明諸佛事謂是道前令厭生死次欣法身前是大悲門後是大慈門前是識門後是勸門前是苦集門後是滅道門又長行先總譬次五皆是別譬先總後別為解義故今偈頌中亦二如向所明就廣敘生死過患復開為三初敘六道舊迷次敘三乘新惑後雙結兩邊就初有二初前明生死二果後辨愛見兩因初亦是先敘身過次敘心過就初中又二前竪論三界升沉亦是辨所栖之處後橫論五道差別能住之人譬如長者還頌前化主但長行舉處取人嘆佛乘之德使物欣求今將人取處敘生死過患令物生厭離故有逼引二教令欣厭觀成是以偈與長行各有深旨就初中有二前總論三界無常堂舍高危下別明一身過患初總後別蓋是聖說常儀問曰長行中何故不爾答曰長行中欲示化處及分化意不同是故離說今欲明同是過患俱為舍形一處辨之就初總中有二前明廣大顯三界難出次辨無常宜可厭離久故謂無時不無常頓弊明無處不磨滅堂舍高危下第二別明一身過患於中有二初明身無常二辨身不淨無常中有三謂總別釋總結同受大患之身為堂而受身不同如所栖各異故名為舍皆是無常非安穩法故稱高危柱根已下別明一身過患就中有三初明身內過二辨身外過三總明內外過成於堂舍略用十物始從柱根終竟椽梠基陛者舍之下分如足骨踝骨也柱根者舍之中分如腳骨已上至於腰骨從腰骨已上至於項骨稱之為梁髑髏在上擬之於棟以筋宍為墻壁脂血為埿塗皮毛為䨱苫兩𦟯為諸椽𮌡兩膂宍即以為梠椽在下梠在上勒骨在下梠宍在上並是念念無常十時改異故有頺毀乃至差脫也從基陛至梁棟明身內之骨有四分從墻壁至覆苫明身外筋宍脂血乃至皮毛亦有四分椽之與梠骨宍雙辨合明內外也長行中先明䈥宍後辨於骨此從外以至內也今先明於骨後辨䈥宍從內至外又長行以末至本今從本以至末立舍之法先備柱梁後方覆蓋身舍亦爾骨親宍疏骨本宍末也周障屈曲下第三總結無常古經為周章周章者舍之將傾不正之義亦是不安之像身亦如是老至則衰病來便惱死至即滅故是無常雜穢充遍者自上總標別釋總結並明身外事今敘身內謂三十六物及垢汗淚涕故言雜穢充遍若三觀釋文者從初至差脫明無常觀也周章是不自在明無我觀也雜穢者釋不淨也不明苦者下火起中別廣說也又三意者從初大宅總明無常堂舍已下別明無常周章已去總結無常雜穢充遍下明不淨也有五百人第二橫論五道愚癡衆生住此身中身既無常無我不淨為緣所成無有實體即是辨空而衆生居此身內而起常樂我淨見此實有不能厭離即愚癡人又總敘五道衆生住三界舍中也鵄梟已下第二辨三界因亦是明心過也果粗故前明因細故後說猶如苦集身心亦然就文為二第一別明愛見過患第二總結就初中復二初舉毒蟲譬起愛次辨餓鬼喻起諸見一切惑中唯此二也生起前後如本疏具說就起愛中又開三別初明意地三毒二明從三毒起業三明從三業感三界報初煩惱道次業道後明苦道又初是總明三毒次別明第三總結身過亦有總別下諸見中亦先總後別蓋是聖說法常體及解義之方也又總標者總攝正使及一切纏垢別釋者但略出正使之過也又前是略說後是廣說也就初中有三初明三毒正使二辨纏垢不同三總結過患明三毒即成三章初舉貪鳥以喻貪使次引瞋蟲以譬瞋使三取癡狩以譬癡使將鳥喻貪略有二義一者鳥在舍上喻色無色愛在三界之上對毒蟲但在下如瞋但居欲界二者鳥在一舍之上如貪居三毒之首諸鳥不同者凡有三義一示品數輕重二辨所貪名字各異三所貪非一中論云貪欲有種種名如見一色初起想念為愛心遂連矚為著纏綿深固為染狂心發動為淫方便欲得為己物謂之貪欲此五即是重輕次第前三尚輕通於三界後二遂重但居欲有即喻諸鳥前輕後重故最後明鴿也所貪各異者鵄正喻食貪鵄常飢故也字林云梟不孝鳥食母乃飛此亦取食貪兼內貪起大過也鵰者廣雅云鵰鷲也郭璞注云能噉獐鹿也此亦以食貪也鷲者璞注鷲猶是鵰說文鷲黑色多子師曠云鷲黃頭赤目五色鴿取色貪總而言之餘鳥多取味貪鴿取色貪以色味偏重故次所貪不同或財或色或著利求名故舉衆鳥也蚖蛇已下第二明瞋舍上有貪鳥下有瞋蟲如愛居上界瞋在欲有又前明於貪如鳥在上後辨於瞋譬蟲在下諸蟲不同者亦有三義一示瞋有輕重二所瞋各異三名字差別如諸蟲形名各異此中明三品瞋初辨重品蜈蚣已下明中品守宮已下敘下品貪使之中從輕至重瞋從重至輕牙現故也又欲明從上界已至下界上界貪輕下界貪重故前輕後重瞋使之體初起心重復稍輕就相生次第故前重後輕蚖與蚖與蛇異經云黑蛇最毒狁已下此明癡使亦品數不同所迷各異名字差別如諸狩形名不同狁者三蒼云似狗赤色食鼠鼷鼠者小鼠穴居是小狩食人及鳥狩至盡不覺痛亦云甘口鼠諸惡蟲輩已下第二上別明三毒今總結之兼明纏垢交橫馳走第三總結過患違理為交橫易起為疾走又亂起為交橫疾利為馳走屎尿臰處已下第二明從三毒起三業前明三毒即方便品中煩惱濁今明起三業譬方便品中煩惱濁今明起三業譬方便品中衆生濁以三毒起三業成惡衆生故名衆生濁方便品中二濁相次今廣為設譬釋成上也起三業即三初從癡使以起三業次從貪使以起三業以因瞋使以起三業問曰前明於貪次瞋後癡今何故前癡次貪後明瞋答曰有文有義所言義者生死有二本一者無明二者有愛前明從貪至瞋示貪為本今明由癡起貪用癡為本如淨名經云從癡有愛即此經云癡愛故生惱所言文者上列三毒最後明癡今示鈎鎖相生故續癡辨貪經論之中常有此勢就文有二上半敘所迷之境下半辨能迷之使癡蟲集糞上具起三業愚癡衆生居不淨三界之中亦具起三業狐狼已下次明因貪起於三業前舉三獸喻意業起貪狼獸正貪故舊云貪狼於財色狐獸貪而帶疑要名求利疑得不得野干亦貪而復諂曲求財色者常曲取人心一貪之中備於三義故舉三獸喻之煩惱猶輕故譬以鳥成業即重喻之如獸從貪起口業如咀齚從貪起身業如踐踏貪境深重如䶩嚙沒齒為䶩所貪不淨如死尸貪必積聚如狼藉既貪前境必起慳心故如狗貪境既多慳心不一如群狗慳惜守護如搏撮自上已來於自境起貪次明於他境起貪貪心無厭如飢羸康僧會云衆生起貪如餓夫夢食常無厭足懼不稱意如慞惶自欲不足更求他欲如處處求食己國不足更求他國如頂生王遍四天下乃至貪求諸天五欲色無色染其義類然鬬諍已下明瞋起三業彼此俱有慳貪互相違反又貪著追求多不稱意是故生瞋起意地瞋如鬪諍起身業之瞋或打或害如齟掣起口業之瞋綺語兩舌如啀齜惡口妄語如嘷吠次總舉前後各二癡中二一所迷二能迷貪中二初一處貪次處處貪瞋中二初是意地次暢身口也其舍恐怖下第三總結又初起三毒次從三毒起三業今從三業感三界初煩惱道次是業道今是苦道受大苦惱故可怖畏妄想因緣變成煩惱煩惱因緣變起於業以業因緣變感苦果故云變狀如是處處下第二次辨諸見前為在家衆生起愛設譬今為出家外道起見設譬前為天魔設譬今為外道設譬又前喻迷事之惑後譬迷理之使又前舊迷今喻新惑前一失今喻失中之失又前喻不知厭不知出今喻知厭不知出問曰愛見應當相次何故前明煩惱業苦三道竟今方敘見過耶答曰此品興譬還譬上方便品五濁上品明煩惱業竟後方敘見今還依此次第也就文為二一總明諸見二別明諸見前總後別為解義故又欲總攝一切見故處處皆有顯諸見通於三界則三界諸見皆是苦因悉感苦果不應起之夜叉餓鬼食噉人宍下第二別明諸見就文為三一明有無二見二明因有無成於斷常三辨從斷常生六十二見所以作此三者還譬方便品中事方便品云入邪見稠林若有若無樂依止此諸見具足六十二入邪見稠林用總標鬼神喻之此下已去別明鬼神喻前三事初喻有無二見者由有無是衆見之根鄣中道本故初敘其過喻有無二見即成二別第一舉有食之鬼以喻有見次舉無食之鬼以喻無見又初舉有樂之鬼以喻有見次舉無樂之鬼以喻無見所以然者有見但破涅槃不破世間得少安樂如有之鬼起於無見非但破於涅槃亦破世間一切時苦故舉無樂之鬼以喻無見就有無二見各開為二有見二者一明計我二辨計法此攝有見事周無見二者一破果二者破因此攝無見事盡就計我計法復各開二計我二者一計涅槃常法為我二計生死常為我此二攝計我事周法見二者一者非因計因二者非果計果此二攝計法義盡初計涅槃為我者涅槃是常是勝故前計之如人宍諸宍中貴勝故鬼食之鬼人宍損害於人計涅槃常法為我則破於涅槃毒蟲之屬下第二計生死無常法為我所以知是生死無常者無常不及於常如蟲獸劣於人也既稱孚乳産生則知是生死無常計生死無常為我破於生死如鬼神之食蟲獸正計生死果法為我不計集諦法為我如鬼神噉蟲獸所生之子不食於母又母生於子而護惜之今食於子乖傷事深生死之因還生生死之果計生死之果以之為我亦乖傷事深食之既飽者依攝論文計我有四一者無明二者我見三者我愛四者我慢前辨計生死涅槃為我此是不了生死涅槃故是無明令起我心圓足如食之既飽喻於我見惡心轉熾者從於我見更起我愛此是從見生愛名為轉熾鬪諍者從於我愛次起我慢即陰離陰二種相違乃至二十身見及二十五我見互執不同故名鬪諍各懷之在心述之於口因之為聲違生死無我鄣佛性真我雙迷二義可怖之深故名甚可怖畏又鄣無我理令不得小乘初果大乘十住故名可怖又初計涅槃為我破於涅槃次計生死為我破於生死佛欲顯計我過失故云可怖也鳩槃荼鬼第二明起法見就文亦兩初非因計因破出世之因次非果計果破出世之果各開為二初開二者一計欲界法為出世因故云破出世因二計色無色界法為出世因破出世因鳩槃荼者謂狂鬼也如諸外道不識正因非因計因故是狂也土埵者欲界之善高出十惡猶如土埵小高於地又土埵非是坐處而狂鬼坐之如人天之善非道外道狂故謂之為道又土埵是卑下之處外道計下法為上蹲踞者計無色之法為出世因自謂得理慢而無恭猶如蹲踞又蹲踞非是正坐謂外道是邪計故又蹲踞非安穩坐顯外道不得安穩正觀居心也或時離地一尺二尺第二計色無色界善法為出世因四禪四空小出離欲界非究竟之道如一尺二尺又一尺二尺是下法如外道計下法為上雜心云非第一為第一也又顯外道所離蓋微故云一尺二尺也計色界四禪為道如一尺則阿羅羅是也計無色界四空為道猶如二尺𣠵頭藍弗即是其人也而言或時者外道多墮欲界小得生上地也往反遊行上明計色無色為道如一尺二尺今自謂得理如往反遊行縱逸嬉戲欣上厭下如往反心攀緣三界如遊行淨名經云何謂病本謂有攀緣三界即顯外道常起病因也得小謂自在如縱逸得小安樂如嬉戲也又升墮不恆故云往反如修得無想定生無想定為往五百劫壽盡墮惡道中如反修得非想定生非想天為往八萬劫盡墮飛狸中為反迷理之心故云縱逸無所尅獲故云嬉戲也捉狗兩足此第二非果計果破出世果前是戒取今明見取謂非樂淨計樂淨如狗實不淨捉以為淨即無淨計淨如狗如苦於狗用以為樂即無樂計樂就文亦二一欲界無樂淨計為樂淨二上界無樂淨計為樂淨欲界人天二果如狗雨足天人之果實非是淨而計以為淨譬如捉也撲令失聲者前不淨謂淨今明非樂謂樂撲狗實苦於狗實苦於㺃而鬼以為嬉樂故是非樂謂樂以腳加頸者頸是上分喻上二界之果亦開二句一者不淨謂淨如腳加頸二者無樂謂樂如怖狗自樂又總顯外道以下法為上故如無樂淨計樂淨又計下為上違損下法如苦於狗也又鬼撲狗是狂鬼外道計生死有淨樂是狂癡也復有諸鬼其形長大第二次起無見亦開為二一撥無果二撥無因其形長大者邪見是諸見最大之惡喻如長大撥無三界之果為長撥無五道之果為大又撥無世間之果為長撥無出世之果為大又邪見之因得無間地獄八萬由旬長大苦果故名長大裸形黑瘦者起邪見斷善盡如裸形有極惡如黑瘦又上明起邪見因今明得邪見果畢竟無有外樂如裸形無有內樂如黑瘦又無身樂如裸形無心樂如黑瘦常住其中者起邪見因常受惡道苦如常住其中所以然者起餘善得欲界人天如土埵或離欲界或離色界如上一尺二尺起邪見因畢竟無有出惡道苦義如常住其中前明其大苦今敘其常苦發大惡聲叫呼求食者起邪見因受大苦惱欲離苦求樂如欲求食復有諸鬼其咽如針第二撥因邪見撥於粗果如長大鬼撥於細因如細咽鬼又撥果義輕撥因義重撥果義輕如長大鬼雖復飢餓若與其食即便得食是苦中之輕細咽之鬼設與其食而不得食是苦中之苦如撥於因是惡中之惡又撥無諸法猶如初鬼執撥無為是不受他見如細咽鬼不受外食又撥無義輕猶如初鬼執撥無義重猶如後鬼此二攝無見義周復有諸鬼第二攝有無為斷常見即是方便品中依止此諸見牛者癡也頭者我見也角者斷常也由癡故計我因我故起斷常此是見體也或食人宍者明斷常之用起斷常破涅槃中道如食人宍破生死中道猶如噉狗而言或者起於斷常不俱所以安或又具破生死涅槃中道故言或頭髮蓬亂者第三喻方便品依止此諸見具足六十二斷常為首喻之如頭生六十二見如髮蓬亂六十二見多所乖傷如殘害凶險計六十二見當欲乖傷如飢渴所逼常欲噉於人狗以得苦果猶如叫喚輪轉生死不得解脫譬同馳走是故上云於千萬億劫不聞佛名字亦不聞正法問此喻幾種邪見耶答初是我見次鳩槃荼鬼是戒取次捉狗兩足是見取次黑鬼是邪見牛頭鬼是邊見也夜叉餓鬼已下自上已來別明愛見過患今第二總結凡有二義一者法種衆苦樂求涅槃如物極則返故云飢急於生死中一切處遍求脫苦猶如四向不知出處猶如窗牖但有求脫之心而無出苦之行喻同窺者二者飢急者起於愛見常欲傷害也四向者一切處欲傷害也窺牖者覓所害境如噉狩者覓狩食人者覓人是故下云甚可怖畏此總敘愛見過也是朽故宅已下自上已來敘六道舊迷今第二明三乘新惑問長行何故舍形火一處合明今前後別頌耶答長行欲明生死具有無常與苦一人具二故辨舍之垂崩及火起燒宅故一處合說今欲明二人具二敘六道舊迷前明無常次辨三乘新惑後說衆苦又今欲辨二因二果二因者愛見也二果者無常苦也上已廣說無常今廣說苦也又三番因果初明三界五道之果次明愛見之因今明以愛見因更感苦果又前明兩果次辨二因以過患為次第猶如苦集今前明兩因後辨二果以相生明次第兩因者一感苦之緣次感苦之因感苦之緣即佛在世也感苦之因謂妄想分別即歘然是也總四者一四面明無處不苦次一時辨無時不苦雖無處不苦無時不苦猶謂苦輕故云俱也猶謂未極重苦故復言熾也棟梁已下舊法華師常以三界苦合之余雖復誦講讀講尋經始終佛自有法譬不須人合方便品偈已略說四苦癡愛故生惱即現世苦墮三惡道生報苦輪回六趣中後報苦衆苦所逼迫總結苦此略說四苦次此品長行廣明四苦上略廣但是法說明四苦今次譬明四苦也苦果二者一總果次別果總果有四別苦亦四合喻上明四苦即為四別一者喻上現世三苦二者喻上生報三苦三者喻上後世三苦四者喻上總結諸苦明五盛陰苦上現世苦中有三種苦一生老病死憂悲苦惱之所燒煮二五欲財利受種種苦三明貪著追求現受衆苦今備喻之棟梁椽柱者謂生苦也𪹼聲者喻老苦也振裂者喻病苦也摧折及崩倒者喻死苦也揚聲者喻極憂悲也大叫喻極苦惱也鬼獸不能自出喻上受燒煮也惡獸毒蟲已下喻上五欲財利也蟲鬼以避火故入孔穴以求樂衆生為內身有老病死苦求外五欲樂也毗舍闍鬼亦住其中者前明貪瞋衆生求於五欲既有貪瞋即起於慳毗舍闍鬼即慳鬼也又求於五欲必望安樂惡鬼墮之顯無安樂也又前是求不得苦今明怨憎會苦薄福德故為火所逼者雖求外五欲財利之樂而恆為內身老病死苦之所燒逼求五欲財利時互相偷劫如飲血更相殺害如食宍問此中何故明此諸苦答長行云五欲財利受種種苦種種苦者即如此文所明謂求不得苦怨憎會內苦外苦及劫盜相害也野干之屬第三喻上貪著追求現受衆苦野干之屬喻貪著追求並已前死喻上現受衆苦非理貪求必現受衆苦如並已前死諸大惡獸喻上後受地獄餓鬼畜生之苦野干雖死惡獸競來食之起貪之人雖現在受苦後更入地獄餓鬼畜生三塗苦重如大惡獸臰烟已下喻上後報三苦謂若生天上及在人間貧窮困苦愛別離苦怨憎會苦今前明人間苦次辨天上苦華嚴以覺耶現為烟以瞋為火涅槃經以煩惱為火以苦果為烟今文宜以烟喻外苦火喻內苦如烟在火外火在烟內外苦是物所不喜猶如臰烟外苦深重如熢㶿無處不苦如四面無出苦路如充塞蜈蚣已下為火所燒爭走出穴者此諸蟲等為火所逼及烟所勳即喻人間內外二苦火所燒謂內身老病死苦烟所勳即外貧窮困苦愛別離苦怨憎會苦以烟所勳無有樂處即貧窮苦不喜烟來而烟強至謂怨憎會苦苦至與樂別離即愛別離苦爭走出穴鳩槃荼鬼隨取而食者喻從人間生於天上亦受衆苦蟲等為烟火燒逼爭走出穴衆生亦爾為內身老病死火及外苦所勳厭離人間求生天樂猶如出穴而生天上不免無常如為鬼所食又佛寄從人生天喻於衆苦衆生受苦時苦如穴內弊於烟火求樂亦苦如出穴為鬼所食又出穴騁散如愛別離苦為鬼所食如怨憎會苦又出穴騁散如生離苦為鬼所食如死別苦又出穴離散失其所居為貧窮困苦欲求富貴不免無常故富貴亦苦如為鬼所食此總喻人間天上皆有三苦故前文云若生天上及在人間備受衆苦佛既總明法說今亦總設譬喻復有諸鬼頭上火燃喻上第四總結明五盛陰苦火從外來猶可逃避衆生亦爾外苦可離而此五陰舉體是苦何猶避之成實論云將此苦器何處覓樂又火從身出無身乃免有身有苦亡身乃離故老子云大患之本莫若有身吾若無身乃無可患耳釋迦滅度義亦類然而言頭上火燃者七尺之身頭為最勝勝處尚苦況復劣耶又位極人王上窮非想尚皆是苦況此已下而有樂耶又前明衆生內苦辨極下人間苦今明窮上非想苦此文明四種畢竟一明有身畢竟是苦如頭上火燃二明有身畢竟無樂如飢渴熱惱三明有身畢竟無避苦處猶如周慞四明有身畢竟流轉喻如悶走其宅如是已下第三總結六道舊迷三乘新惑若因若果皆是過也此中明四苦現苦生苦後苦總結五盛陰前亦四無常初明骨無常次明筋宍無常次雙明骨宍無常次總結過患又今明十苦現在三苦生後亦然及總結為十前明無常亦有十謂骨無常有四肉筋等亦四合明復兩亦具十也敘身過既爾心過亦爾為令衆生厭患身心以求佛道故佛委曲敘其過患也是時長者在門外立頌見火譬所以有此一章者近釋方便譬喻二品之意遠釋三世佛及六道衆生感應交接大宗上品直明佛見六道即便起化長者見火仍欲救子今明所以得救者由機感相應也總釋諸佛出世意者自上已來敘生死過患今明佛出世欲救生死苦也亦可自上敘衆生事今敘諸佛事具如上釋然頌諸佛事雖頌四譬合成二義頌見火譬明真應兩身頌餘三譬明三輪之義辨一切佛事義無不周初明真應二身即上明法身中先明照機者釋諸佛出世所由必有機扣法身然後方得起應耳大業六年三月一日更釋譬始終意五譬分為二章頌總譬中明生死過患頌餘四譬明出生死二段中各有三初章三者一明六道舊迷二敘三乘新惑三總結過患又初明無常次辨衆苦三總結過患後章三者一法身照機二垂應入於生死三辨說教又初是他心輪次是神通輪後是說法輪此極好後人可用之也門外立者法身絶四句之外出三界之表故在門外也聞有人言者法身照機也北土三身解義法身無照機南方本迹明義約教辨之此經未明常住法身居三界外但有照機無法身也一往並不得通此經文今始得明有法身有照機也聞有人言者此是譬耳有人來報父父則聞報如有機扣佛佛則照機也因遊戲來入宅者佛去世後生人天中受五欲生愛稟邪教起見愛見是煩惱由煩惱故起業由業故受三界身也又遊戲有二種一自境遊戲即學佛大小乘教起於愛見二他境遊戲即受五欲及稟邪教起愛見遊戲為因入宅為果如愛見為因三界為果稚小無知者前明起愛見之因以明受三界之報今於果上更造苦因未來受苦果故佛出世拔其苦因也長者聞已前辨法身今明應身此章具應真兩身感應二義也告喻已下次明三輪之教即為三別今頌救子不得即是不得說根本法輪若望前文更有三輪聞有人言法身照機謂他心輪驚入火宅謂神通輪也告喻之言即說法輪也六年制文就說法中作二種三釋之一者明諸佛為一大事因緣故出世說法而物不堪受故息化二不堪受一故於一說三三者以三調心然後說一即根本支末攝末歸本三輪義也二者初明出世時即欲拔其極苦與其極樂物不堪受次拔重苦與小樂第三明拔輕苦與大樂此釋易亦宜用也若望後從驚入以去屬救子不得但前是現身今明說法長行具有誡勸二門救子不得今但說生死苦者頌初總譬明生死過患次頌見火譬明見生死衆生機故應入救之今還說生死過患怖之令出此一類明義故相接也此苦難處況復大火者蟲鬼亂行為苦況復老病死火燒身樂受耶又身苦但破樂受心火則燒滅善根故舉為況也釋益我愁惱初勸門化不得是一愁次誡門化不得故云益也又一如本疏問曰誡勸是何義耶答曰勸門者令子求佛樂誡門者示子生死苦如今語他云汝須求佛道其亦不信又者汝即是死去後受大苦須努力精勤而亦有不肯行道也次頌說三乘救子得譬即第二支末法輪也諸子著樂佛前說苦令其捨苦終自保樂不肯捨苦今說三乘之樂以樂捨苦諸子貪樂故捨苦求樂欲顯諸佛凡有二門一逼二引上說苦令捨苦是逼門三乘已去是引門又自上是大悲門後去是大慈門又自上說化他門以化他以苦是衆生所有故名他今說自門化他謂三乘一乘皆是一佛乘中出故可以遊戲者因門辨乘為令出苦就樂果門明乘正以與樂引苦也到於空地者到空地顯無車可得離諸苦難明有苦可出上就父以顯權有今寄子以顯實無又上就父明無今寄子明無佛說二乘是無而二乘則不信若二乘人自見無乃信無有二乘故長行與偈二文皆明子住露地空地顯道理無二車也問曰子自知無不答曰終由父說乃知無耳釋坐師子座自初至此凡有四時並不得坐初在門外立居法身地照子機時即是知子病時不得坐次驚入火宅內垂應救子時亦不得坐三用一乘化子不得亦不得坐今三乘化子得始得坐也問曰雖出三界未免二乘云何坐耶答曰此是一期事竟故且坐又知子大機必動堪授之以大心不憂慮是故坐也師子坐者不畏三界身心兩火燒煞一子也釋生育甚難令發菩提心為生令修菩薩行為育菩提心是中道心而衆生多起有無見不得中道正觀是以云難也釋索車此第三攝末歸本輪此雖一章之經實一部之宗要講者多暗此譬今略釋空捲度一切以通此索車使靈然可解經云我初得道時空捲度一切然三界舍之垂崩復火起燒宅而三乘諸子於火宅內纏綿嬉戲父欲出之手內唯一金錢直為一子說者則得引一子出不得三子俱出今欲引三子俱出故父云我手內有三錢一金錢與太子銀錢與中子銅錢與小子若隨我出宅者必得三錢矣三子聞之欣然並出既居門外慈父欲俱與三子金錢開手示之吾手內唯一金錢實無有三為欲引兒出宅故說三耳諸子之中有利根者即解父言知一是實說二是權故捨於二想便取一金錢此即身子利根人聞一有三無捨二悟一不復索車中根諸子雖聞父明有一無二執昔空三之言就父索錢今欲顯索車是癡迷令中根捨三求一故有索車譬也又所以立索車喻者此總可一切凡夫二乘人令捨愛見也明二乘之人始終具足愛見初在三界愛著五欲今欲出三界保執空言故名為見非但昔愛可愍亦今見可傷使一切凡夫二乘聞佛此言皆捨愛見捨愛故不著凡捨見故不著聖則心遊中道入佛知見名得大車又敘索車意至此已三過明無三初明父空指門外明有三而門外實無二者父見子出到於空地而坐無三可乘三者子今索三故知無三所以三過明無三者以四十餘年保執有三乘甚失重故也次釋五乘權實昔明五乘可具三句一者大乘但實非權二者二乘但權非實三者人天乘亦實亦權佛乘但實非權者雖大小今昔不同同明道理有佛乘故但實非權二乘但權非實者三界內無有究竟二乘三界外亦無二乘究竟界內外不攝所以一向是權故前云但以假名字引導於衆生我初得道時空權度一切也又二乘究竟二諦不攝第一義門故無二乘究竟世諦中亦無究竟二諦所無而說有者故知一向權也故下文云生滅度想生安穩想想者但執佛空言起空得想耳智度論云二乘根鈍又復虗言得道也問曰若二乘不得道應不得道應不斷四住惑答曰不得究竟道耳非不斷惑故人天乘亦權亦實者若說三十三天常樂我淨此但權也若說五戒十善得人天報真諦乃至無世諦故有所以為實又界外乃無界內則有所以為是實也次論菩薩然菩薩之人今昔始終都無有索如父手內實有一金錢復為子說有金錢本意復欲與錢而子聞有金錢遂便出宅出宅則得金錢何所索耶又三車喻三果二乘至果處求果不得故有索菩薩無有至佛果處覓佛果不得就佛索佛果故知無索也問曰今日大車既是白牛昔大車是何牛答曰四車者弊此一問也今明如上釋之三世佛制出世乘唯有三則今昔俱明佛乘今昔俱是白牛如今昔俱有慈悲慈悲即是白牛若昔車無白牛則昔佛無慈悲昔小乘中有慈悲亦是小乘中白牛也又上金錢喻初為子說金錢出宅亦金錢中間亦金錢金錢不異在牛恆白也問曰菩薩不索車今聞索及賜有何益耶答曰菩薩則悟一實三權唯進無退故得大益又悟解權實得於二慧入佛智如來智名入佛知見也長者大富已下次頌賜車問曰長行中何故前明大車後方釋有車今前釋有車後方賜車答曰長行中欲明子愚索三父惠賜一以愚智相對又顯子求僞珍父賜真寶又子求少物父賜其多如貧人乞少而富者惠多是故前明大車後辨有車今欲以有無相對子求索三欲顯無今對子無三欲明有一故前釋父有車也又顯子愚不知三無今顯父智明有於一造作大車者可具作有無二義若對三無決定須明有一若望正道三一俱忘為衆生故方便三一故並稱造作衆綵雜色十八不共也繒者帛總名也纊者綿也茵者三蒼云重薦也蓐也釋名云車中所坐物也釋白疊長行明重敷綩綖綩綖者繡也繡有多色喻解脫不同或有餘無餘乃至八種解脫今明雖多同是無漏猶如白疊釋遊於四方可具二義一者顯子成佛遊佛境界常樂自娛如涅槃經子住祕密藏即今文是也二者示子分得因車如下直至道場以前意為正告舍利弗此頌合譬然明義大同但轉勢為異至此合譬以四番說法長行開譬合譬為二偈文亦爾望震旦文章似如煩重俱天竺大聖有無緣之大悲內有無㝵之智外具無方之辨適無限根性能於一法四義說之各有深旨非煩重也今頌合五譬一一譬中皆明二義合成五雙初明父子一雙次見火能所一雙次說大教及無機一雙次說小教及受化一雙次賜車得車一雙即是轉勢說法令人樂聞及適機之用初明父子一雙各開二義父中二者初總次別別中初明三聖之尊次辨六道之父良以道超凡聖故為凡聖所崇即頌前長者也子中二者一敘子二明子過也敘子即攝五百人三十子也明子過有二初明子二因次明兩果深著世樂所謂愛也即合上毒蟲無有慧心所謂癡也合上惡鬼三界無安下次明二果三界無安合舍垂崩謂無常果也衆苦充滿合火起燒宅謂衆苦果也初有半偈敘無處不苦故明充滿即上四面次有一偈明無時不苦稱為不絶即合上一時也如來已離下頌合見火初歎能見人德次行敘須化之意即能所一雙也而今此處多諸患難已下頌合救子不得初正明救次無機不受次是方便已下頌合三乘救子得譬初明說三教次敘機信受汝舍利弗下頌合等賜大車亦初明賜車後合得車歡喜合賜車為二初合等賜二合大車合等賜中又二初正明合賜次勸信受是乘微妙已下第二合車依前譬文開為三別一者合車二者合牛三合賓從合車為二初合大二者合車初偈上半對二乘之小合車大義下半對世間之下合車高義佛所悅可已下前偈明超凡越聖即纍無不寂今此一偈合德無不圓但長行譬文舉所嘆之德故云衆寶莊挍今明能嘆之人故凡聖敬悅無量億千已下第二合車譬中車有二義一者車外二者車內今具合云無量億千諸力合車外也略合欄楯之初例後衆德解脫禪定已下合上車內解脫合綩綖禪定合丹枕智慧已下合上白牛問曰上辨慈悲為牛今云何乃明智慧答曰小乘以功德為慈悲體大乘以智慧為慈悲體又示一一德攝一切德也及佛餘法合上賓從神通說法方便化物並是為他非佛自用故明餘法告舍利弗已下第二大段勸其弘經就文為二初令識法次辨知人具斯二德方可弘道詳經文大意自此上合大車正論大小二菩薩果權實故最後結合車有無從此文竟我為法王論大小二涅槃果權實以一切果唯有斯二故也問曰何故最後偏論涅槃答曰長觀文意初頌總譬始自六道生死今最後辨大涅槃故一切攝也又藥草喻品亦明二果而後辨涅槃又大小乘正以涅槃為究竟小乘雖明四諦論宗歸一滅大乘三論人有為相一滅諦是無為故最後論之於中有三初約聲聞人論涅槃權實次約菩薩明涅槃權實大涅槃唯佛能盡故最後約佛論權實前對聲聞論涅槃權實大涅槃唯佛能盡故最後約佛論權實前對聲聞論涅槃權實者以聲聞正迷涅槃權實也問曰既明二乘涅槃非究竟即應明大涅槃方是究竟何故乃言今所應作唯佛智慧答曰方便品以明昔滅非真滅今滅是真滅今此中正明簡大小二滅小是孤斷之滅無有身智大滅即智體無纍故名為滅故舉智即簡別也菩薩中初泛明四諦後的明一諦一諦之中論於二滅昔小滅但滅四住故有餘未足但滅分段無餘不圓對昔辨今還翻二義則知具脫五住則有餘義圓備滅二死無餘滿足我為法王者前二章約大小二人論今昔兩滅於義已圓今舉法王但釋前小後大之義既為法王即解大小然大滅雖是究竟但昔宜說小今宜說大前令脫重苦今脫輕苦漸誘引之故衆生安穩與此相違則不安穩也然此經既具明二果權實教知前分非是明因又盛論二果權實不應名未了義也我此法印第二令其識人合大車明大小二菩薩果權實告身子者辨大小二涅槃果權實一往教中決定如此故名為印二者就道論之未曾大小何有權實亦道理決定言忘慮絶為印今有所得大小學人不識此二印設為說之未必信受故誡令勿說若聞此經上略誡明非器莫傳此略勸是器宜授就文中有二初嘆能受之人次美所受之法二中各三初三者一明聞經是不退人次明是見過去佛及曾聞此經即出不退往因三嘆信經之力阿跋致者就教中約初印有一無三無三故無退有一故有進約理悟非大小理絶一三乃是阿跋致人也第二文易解第三中云則為見我亦見於汝者以信理未曾一三身子與佛並諸菩薩皆是體理之人信理則見理人也斯法華經已下第二美所受之法亦三初明法妙深智方解次明至道場起凡凡不能解次明深理絶聖聖不能解初半行文是也凡夫淺識者第二文也但言低頭舉手成佛尚不知此經辨菩提果及涅槃果況復知忘大少非因果耶預是未達斯事皆稱淺識汝舍利弗已下是第三文也二乘信者若但言一豪之善並皆成佛凡夫尚解況二乘耶今此中所明路非近遠理絶小大二乘既是斷常庶人未得妙觀云何能解妙理耶正當仰信而已憍慢懈怠是學小乘人計無我部人薩衛之流計我見者是學少乘有我部人如犢子之例此二部是若聖人聞必生信若未證聖多執小拒大故聞而不受故不應為說以兩人異者初是外道及世俗博識而未悟佛法深理故名淺識第二見少樂忘大樂此人亦不堪為說即斷一切世間佛種者菩提心正是佛種此經明有一無二故不發餘心有一故唯發佛心則此經是菩提心本若謗此經則菩薩種不生名斷佛種問曰第四與初人何異答曰初人正據不信以明起謗又初直不信故謗後舉二世謗也具足一劫者涅槃經云一逆苦則一倍五逆則五倍今既多劫則亦多倍次明為十人說然大意上來就法門說法華今就人門說法華智度論云往生已前就法門說波若往生品明四十餘菩薩就人門說波若今亦爾上就法門者明所行道妙今就人門明行道人妙初人求佛道者佛道忘言絶慮求此妙法名為道人令一切人亦作斯求第二人過去久見佛來方能求妙道第三人勤行絶慮之道恆起無緣之慈欲以妙道授與衆生也次人捨惡知識惡知識者謂有所得凡夫二乘及有所得大乘法師律師禪師等苦到求道者皆是衆生惡知識也大品空中佛語常啼云能說空無所得法是善友也次入質直柔軟者離凡夫二乘有所得空有大小諸邪曲見名為質直心資順忘慮之道為柔軟持戒清潔者防一切生心動念惡而常求無所得妙經也於大衆中清淨心說法者近不為名利稱為清淨若深論之有所得說法皆是不淨又言滿十方知無一字可吐即其具四智名為清淨說又如法師品內安三事外勤說法名為清淨不求餘經及外道典籍者不起二乘心故不求餘經不起凡夫愛見故不念外道典籍也
