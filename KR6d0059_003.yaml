body:
  text: 釋方便品涅槃云明諸山大地藥草能為衆生病之良藥佛法亦爾能治衆生煩惱病藥但病有二種藥亦兩門病二種者一者凡病二者聖病失一原而成六道謂凡病也喪一理而執三乘謂聖病也藥有二門者昔説三乘真實治凡病令六道回宗今説三乘方便治聖病故三乘徙轍故昔是救凡之經今為濟聖之教斯則網羅聖化總病藥之門問云何是凡聖病耶答四住之因感分段苦謂凡身心病也無明之因招變易報謂聖身心病二十八章命篇顯方便品正授治病之藥也聖既執三為實是故為病今欲破此病故説三乘是方便故以方便藥以治真實病故云方便品問何故不用一乘真實治三乘病耶答亦得爾也但要先開方便門後方示真實相問開䨱有幾種耶答略明四種即四重藥病一者昔説三乘是實䨱三乘是權即䨱一乘是實具二也䨱今開二乘非實謂開二乘是權即開一乘是實具二開也次明道未曾三一若執三一為實則䨱三一是權亦䨱非三一中道之實今明三一皆權具二種開一開三一是權二開非三一中道之實三者道未曾偏中若執偏中則便䨱道亦䨱道用若明中偏俱是方便亦具二開一開中偏俱權二開兩捨之實四者道未曾有言若有一句之言則䨱道無言之理亦䨱有言之教若知一切言皆是無言言具二種開一開道用無言而言二開道體言無言也乘權乘實既有四種開䨱身權身實等義亦類然昔為二乘明佛身是實生滅即䨱方便生滅亦法身無生無滅故一䨱便成兩䨱今開生滅身是方便即是開方便即知不生不滅是實故具二開餘三節上可知由來但得乘權乘實一重開䨱餘重及身權身實皆不知也問曰無量義經亦有開䨱義不答有二種開䨱一者失䨱失開明衆生失一道而成六道謂䨱一道而不知覆諸佛為欲令衆生捨六歸一原故前敘其失原謂開失也二者開得衆生失一道成六道諸佛欲令其出六道歸一原故從一道出三乘教令因三乘之指得一乘之月即無量義經意也而稟教之徒遂守三乘之指喪一乘之月今法華時示一乘之月故重敘三乘之指所以稱為方便問無量義明從一生三與法華何異答彼直明從一生三不明道理無三唯有於一亦不言一是真實三為方便故彼經為密説此經為顯教所以為異也釋開文段此品是靈華始現實教初開言巧趣深不可輕然而説諸餘科段皆並異舊本疏已詳此品章門今復改易昔雖誦講常怢怢其言若如舊判凡有二失一者不足二者辭煩今文具歎因果但稱揄揚二智斯不足也又此中歎於佛乘無能不圓但云美智斯二不足也又已歎諸佛二智復歎釋迦二智其文則煩若言側復廣説章中有總別佛者此勇於取類而劣於尋文宜改舊心諦詳經旨十方便中此第七稱歎方便又開為二初長行次偈頌長行為二一寄言歎佛乘二止言歎明歎所不能歎方盡稱歎之美就初歎中文有五雙初別歎二智第二總歎衆德謂總別一雙所以有總別歎者乘具萬德智為其宗故前歎二智後美衆德則讚乘理盡若始終皆稱歎智則失斯意也二者初歎二智欲示唯有真智更無餘法可尋義宗所以有六道不同三乘異轍者皆由想謂心也謂想若已則九趣便息故唯有佛智故大慧經云一切法不生則般若生攝論云唯真智獨在無復餘法即斯意也問若唯有佛智應無餘德答即一智體萬義並圓智體無纍名為解脫智體寂靜稱曰禪那無慳即檀防惡名戒故具衆德也問若爾美智便足何須後章歎衆德耶答前敘其體後稱其義無所害也問智與如何同異答南土師云智是靈智如為頑境北方人説如是實相體非是智但生智名智故言説智及智處皆名為波若今所辨者未嘗同異適物用之且對南北異宗宜明不異即智不變異為如即如能照為智故就體無二約義兩分問為是義推為有文證答經論誠説豈虗稱哉中論云亦名如法性實證涅槃智度論云若如法界佛波若涅槃是三則一相而實無有二楞伽經略出五名謂如法界法身性真如皆是一體隨義立名就歎二智即為二章第一歎實第二歎權實為權體權為實用故前嘆實體後美權用謂權實二義第二雙也就歎實智復開為二初歎果二者美因所前果後因者果乘究竟又正主妙名初分之經盛談果德故前歎果但斯妙果必由於因故舉因釋果所以後美於因又既領妙果使修因故前明於果後敘於因即因果兩義第三雙也就歎果德又開為二初歎果德又開為二初歎果理次美教門理為教本故前美其本後歎其末即理教兩義第四雙也就歎果理復開為二初歎人二者美法人即能乘之人法謂所乘之法具能乘所乘乘義方備即人法兩義第五雙也今經家敘佛起定復開為二初明起定次出對揚之人即師資一雙合前有六雙也告身子者即信解品中前命其子又敘起定明文醫也告身子者述病兒也與大品初告異者大品初告即明正説今文初告乃辨方便大品化直往根又無自保執之病命初即明正説今化回小鈍根又有保執之病故未得開正宗但得辨方便諸佛者能乘之人智慧者所乘之法問何以得知然答後偈頌中自作此説故云世雄不可量諸天及世人一切衆生類無能知佛者即是歎人又云佛力無所畏等所謂歎法蓋是用後釋前非為虗搆甚深無量者佛智如海淺識不識其底為深近情不見其岸為無量又四句取之不得為深故波若如火聚四邊不可取也超百非故無量故云波若無壞相遍無所依止智者一切處求之不能得大莊嚴王菩薩歎佛云智恬泊慮凝靜意滅識忘亦寂永斷夢忘思想念無復諸大陰界入大莊嚴王將説法華預歎佛智慧者欲顯發密教調伏衆生使聞佛起定揄揚大智不起驚疑也問何故告身子歎佛智答寂滅道場即欲為諸子稱歎佛智但爾時未堪今方得説其智慧門者第二次歎教門但理教始終凡有二門一者即理虗通故名為門如長者居理內名住門內窮子居理外名住門外即以佛智為門此門即甚深無量故云難解難入及二乘不知又理能通智名理為智門又理能生教故理為教門二者用教為門就教門中有通有別所言通者現通説法諸所施為同為生佛慧故名為門所言別者一以人天之教名之為門故經云我此九部法入大乘為本次以小乘教為門故密遣二人以呼窮子亦經云我設是方便令得入佛慧三以大乘教為門故經云為此諸佛子説是大乘經四用一乘教為一乘理門佛智即妙法蓮華門即謂經也故經云正直捨方便但説無上道無上道謂理也説即是門謂理妙教妙名為妙法亦後云即遣傍人急追窮子亦是一乘之教以為門也若以一乘教為門此門難解難入故二乘不知若以小乘教為門如遣二使密呼窮子窮子不達從一起二藉二悟一亦名難解難入人天等教為門義亦如是次總論衆門凡有四句一密門非顯故云密遣二人及九部法二顯門非密印即一乘教三亦密亦顯則波若付財之教四俱非者泯上三門歸一寂也亦有四句一但理非教即是不可示二但教無理有三乘之教無究竟之理故經云但以假名字引導諸衆生三亦理亦教理教相對理有生教之能教有通理之用四俱非者泯上三也亦有四句一理非教謂理也二教非理謂教也三亦理亦教妙顯無言為教即言寂滅為理四非理非教泯上三也問此經云三乘人不能知者約何時耶答寂滅道場二乘人不能遊一乘之門入一乘之理也從鹿薗已後二乘之人不能遊五乘之門入佛慧也所以者何下第二舉因行釋上理深教妙即後明因也隨宜所説下第二次歎權實即是從一乘根本出三乘支末上歎實有二初歎果實二舉因釋成今亦二初歎外次舉內釋成初文前標隨宜歎解隨宜者隨三機所宜説三乘教言三意不三意踰言外故云難解雖談於果而意在因説小乘是果者欲辨是大乘因亦意踰言外故難解也又説三乃欲令出三不言有三言出三者令出三界不言有三者無有三乘也而物遂言實有三界亦實有三乘故不解佛意亦難今出三求三而意無三界可出亦無三乘可求寄言二有意在兩無意踰言外故言難解又言在二有而意不在二有亦不在二無亦有亦無非有非無四句內外所以然者意在求佛所言佛者絶四句也故中論云如來在世時不言有與無亦有及亦無非有及非無而物情遂聞兩有作於有解不知絶四句故名難解亦意難解者説求絶四句之佛非求他佛退求自佛言自佛者了達七釋本來絶四即名為佛故中論云如來所有性即是世間性而情乃謂求於外佛不知退觀故名難解又佛意雖令還觀己身不觀於外然既不見己亦未嘗他故肇公云內觀不見己外聽不我聞如此四句泯無蹤迹既不見其有迹何有無迹故佛不能行佛不能到預是運心未到此處皆不識佛意故名難解吾從成佛已來此釋上難解之意此句明用權時也種種因緣者敘機性異也種種譬喻下隨機演教也令離諸著者釋用權意即是略解十方三世佛説教意也意在無著故説教也此中未得分明開方便門故不得顯無三乘但得作離著意釋之佛説三乘者乃明兩捨不在互存言兩捨者一捨三界二亦捨三乘不在互存者不在捨三界而存三乘問曰何故兩捨答捨三界故度三百由旬不在三乘復度二百五百若度萬德便成萬德便成故不可為無五百度故不可為有即是中道法身亦是大車遊戲快樂諸方等經盛談斯意如淨名呵迦旃延佛説無常意者令捨常見亦不著生滅無常遠離二邊不在中道故知既捨三界亦宜辨三乘所以者何下第二舉內智既圓釋成外用善巧如來知見廣大下第二總歎衆德自上已來別歎二智所以總歎衆德者乘具衆德令讚佛乘宜備讚衆德又若歎佛智容謂佛智超衆德未悟餘德拔群故須遍美又顯一智備含衆德故總歎之又從初歎佛慧謂歎根本法輪次隨宜已下美支末教從知見廣大下已歎攝末歸本上別歎有二初歎實智為體二美權智之用今總歎衆德亦開為二初歎內德無不圓二美外用無不普又前歎實智為理權智為門謂別理別門今歎內德外用即總理總門斯一章經可謂言約而義周門外二章各開為兩內德二者一別牒嘆智二遍歎衆德如來智見廣大深遠者牒別智也無量無礙下遍歎衆德也如來能種種分別下第二嘆外用無不普亦開為二初嘆巧説二美現通前機案後是衣裓外用雖多不出斯二蓋是救子之明術化物之大宗問曰云何爾耶答現通以生信説法以發解佛法大海信為能入智為能度又現通拔苦與樂治物身病説法滅惑生解救其心疾又現通以生福説法以殖慧為益大要不可復言略舉此二揄揚佛乘使捨小歸大故也就説法中復為二句初美七辨巧説言辭已下嘆五音美妙即用此讚揚大慧引彼小心成就一切未曾有法者第二次嘆神通如神力七種神力分別品八修瑞相又如華嚴云世界不積聚不亂亦不雜一切入一剎而實無所入無量劫一念一念無量劫元來無積聚而現諸劫事前明大小無礙而無多少後辨短長自在而無延促凡夫二乘下位所無故名未曾有法問曰應前明現通後辨説法何故不爾答説法事正故初辨之也止舍利弗不須復説第二止言加嘆佛德所以須止言者一者明佛智不可嘆故嘆所不能嘆故明止言智度論云波若無壞相的無德所依止過一切語言誰能讚其德即卷上義泯無蹤迹上雖嘆果嘆因美權美實皆是無名相中強名相説考其至理未曾因果何有權實亦實亦權非權非實如是五句故辨止言又止言者長望始終如淨名三事初從定起嘆佛智甚深蓋是寄言顯理未辨至理無言今唱理無言謂言於無言後説偈竟佛即默然謂無言於無言以此三門窮稱嘆之美然實是正説但未分明判一有三無故稱方便問何以知同淨名耶答後偈云是法不可示故知是示於不可示言於不言也驗前未明無言知後無言於無言也又止言者凡有三人出世一但長惡如外道天魔二亦生善亦長惡如善凡夫三但生善不長惡即是佛也若直説不止言者乃生三根之善而長五千之惡故須止言又止言者有三根人上根之人聞佛前説即已領悟不復須言所以然者上辨果明因嘆權美實義無不備故聞之已解不須復言即是嘆菩薩之利智嗟聲聞之鈍根令自鄙小心欣求大道二者中根人若直爾為説則不尊人重道要須止言待三請方説則重道尊人三者下根之流即五千等例不堪與言故如來致默又止言者自上已來明大乘人密開權顯實嘆果美因今欲令身子小乘之流嘆果美因開權顯實顯發密教調伏衆生是故止言具大小揚揄方窮稱讚之美又自上已來以善人為方便顯發密教調伏衆生今欲以惡人為方便顯發密教調伏衆生是故止言唯佛與佛乃知者上辨絶言故群生不知今明無言唯佛能究又前明法不可知即嘆所乘法今明唯佛能解美能乘人具嘆法美人義乃圓備所謂諸法如是相下上泯言歸於無言今明雖復無言而無所不言卷舒自在方覺其妙若言住言無言住無言無言不能言言不能無言皆是有礙之道未足稱其巧深與此相違方覺其妙十句為三初七明因次兩辨果後一總嘆因果正言因果衆義大綱此宗旨故無言而言論於因果七義明因因義則圓二句辨果於果義足果則一切智報謂一切種智即是後文如來智佛智體如之智正酬於因故稱為果一切種智名後得智從實智起故名為報又欲分二智不同故互其文也釋偈偈與長行異者長行寄言讚佛乘則廣今略而頌之長行止言歎佛乘則略今則廣之前廣後略為令易持前略後廣為明解義故為令解義生其波若為令易憶發其總持故波若朗其聞慧總持其思府豈非大聖內有無緣大悲外有無方大辨益物之周耶又廣略互現轉勢説法提耳指掌屈曲從緣也上長行寄言嘆中五雙明義今撮其大意二轍頌之一者歎果二者美因以因果是衆義綱維立信根本故略頌斯二所以前嘆果後美因者此經雖具明因果以果為正故前歎也果中為二初偈嘆能乘人次偈美所乘法權實理教皆入一乘法攝之初云世雄不可量者一切天人皆謂佛身有生滅壽有始終故不能量無生滅身無始終壽又身壽權實凡有四重如品初所述而昔天人不識其一豈知其四佛力無所畏第二頌歎所乘法亦有四重權實而昔稟教之人尚不識一何由達四問以知此是所乘法耶答譬喻品云無量億千諸力解脫禪定智慧及佛餘法令諸子等乘是寶乘直至道場猶是今文取圓德為乘體耳及佛餘法者上明一道清淨實德為乘體今敘從實起權名乘功用還入一乘是故一乘綱羅權實又世雄不可量頌上略嘆佛智佛力無所畏頌上遍嘆衆德長行寄言有此兩段故今頌之本從無數佛下此第二嘆因釋成於果兩偈不同者初偈上半明無一佛而不益無一行而不行謂廣大行下明甚深謂甚深行即行亦不受不行亦不受乃至不受亦不受乃是甚深難可了耳第二偈上半敘行妙因圓下半辨極果滿釋如是大果報此頌止言加嘆佛乘上美能乘之人所乘之法甚深之因微妙之果雖作此讚猶未稱實不暢聖心蓋是無名相中強作人法因果名耳然至妙之道未曾人法何曾因果乃至四句言忘慮絶始是妙法蓮華蓋是一經之宗趣一經心髓可不留意哉余立此經用中道為宗顯在於此以中道故乃可稱妙隨在諸邊不名妙矣故放眉間折中之光豈虗表哉就文亦兩初雙標次辨雙釋前亦雙標雙釋即二雙明義長行各標各釋所謂其義其遠其言巧妙什公對僧睿云天竺梵文言入絃管今反彼為此猶不稱彼言也初標佛解章門上半明所解有因果兩法下半明能解有總別二人問何故辨唯佛能解因果耶答若聞因果定作因果者衆生亦能豈歎佛成今明因果者佛解未曾因果為衆生故強作因果名説之故唯佛能解又佛非但知名妙顯無名亦知此名本來寂滅悟名無名即如來智達無名名稱為佛智任運而知即自然智不從師得即無師智次標衆生不解章門上半出所不解法下半敘不解人上半出不解之法亦有二下半明不解人亦有二與佛相對也言二法者謂理教也是法不可示謂所表之理絶言也言辭相寂滅明教也非但所表之理絶言能表之言亦絶故善吉言我無所論乃至不説一字也問曰佛解章門標於因果衆生不解章門應云不解因果何故乃稱言辭寂滅答上明非因果因果今辨因果非因果佛具達斯二衆生並迷兩法不欲煩説故互相兼耳下半出不解人亦有二人初明無解人二辨有信人明九道衆生未能內外並緣觀俱寂何猶能解無言之道耶除諸菩薩衆信力堅固者下第二明有信人又二初明菩薩有信次敘二乘無信除諸菩薩衆明菩薩有信也諸佛弟子衆下敘二乘無信也此中總説二乘利鈍並不信佛乘其力所不堪者尚不堪受大法何猶生信問二乘何故不信答未入十信位故未信也又總而言之凡有三品一佛則亦信亦解二菩薩信而未解三二乘不信不解二乘既是不能信即是聖一闡提不信無量四諦一體三寶故二乘人不信三寶四諦也假使滿世間下第二釋二章門初釋衆生不解章門二釋唯佛能解章門各二初明大小乘人不解次辨總別二佛能解大小乘不解中有二初明小乘人不解次敘大乘人不解兩文各二小中有聲聞緣覺大中有初心不退問大小之人何故不解答小乘住斷常體觀故不解中道如涅槃云若以二乘言無布施是則名為破戒邪見空觀既邪有觀亦邪邪見之人但見於邪云何見正菩薩雖習正觀但取相未觀心猶昧故稱不解故涅槃云住十地故見不了了無所住故見則了了有所住則纍猶未盡觀猶未明與此相違見則了了若爾今學道之人常須晨夜習無所得也此文敘初心之與不退並不解妙乘若爾因人尚不知妙云何有妙若初分經次因為宗失經旨也又告舍利弗下第二釋唯佛能解章門章上釋衆生不解明大小二人所不能知今釋唯佛能解辨總別兩佛之所説解亦是其義深遠其言巧妙也釋舍利弗當知諸佛語無異第八明勸信方便所以有此文來者上寄言止言二種稱嘆佛乘言與昔違恐物驚憚是故勸信又遂近來者上明菩薩有信二乘無信是故今明勸二乘信就文為二初勸信實次勸信權二文各三諸佛語無異者遮其謗也諸佛言一言三皆有深致無相差異勿起謗也當生大信力者第二正勸信也二乘闡提既未生信是故勸之世尊法久後下第三釋遮謗勸信所由也起二乘機初必説不實後必為説實斯二是決定義故稱要當問云何令信答達此身心本性無生便回小入大何以知之下經云昔説五衆生滅名為小教今説五本不生名為大乘楞伽經云得人無我名曰聲聞得法無我便成菩薩問曰如波若等盛談五衆無生二乘聞已生信何名闡提答昔未説無二乘生滅唯有菩薩無生今則明之恐其不信是故勸之也告諸聲聞此第二勸其信權亦開三別初出不信人次半行略釋所信之法後敘開權之意釋成信也爾時大衆中第九勸請方便問今文實是大衆懷疑致請云何為方便答然具有權實二人但身子之流多是發教以帶解而請故名方便問曰何故前彌勒請今身子請答欲示窮上極下不知佛智即顯佛乘為深今聞道之流虗心信愛故有大小二人請也又顯窮因不了極果故彌勒請極小不達窮大故身子請極因不了極果欲今轉因以至果則終益也極小不了極大欲令回小入大則始益也問乃知大小俱請何故前彌勒請後身子請耶答釋迦入定謂現在佛現瑞表説佛乘彌勒補處是當來之佛文殊是過去世尊欲明三聖共讚揚一道故彌勒致請今明如來起定正告聲聞聲聞執動疑生故申疑致請又前三聖作大方便以顯大道今物欣大今示小方便自敘小失令物捨小問曰身子云何帶解嘆而請答曰一往觀之言身子俱疑今昔然實是雙嘆第一方便者就今嘆也我自昔來就昔嘆也故前就第一嘆後授希有歎既稱歎佛乘今欣大捨小故名方便問何故嘆慧日大聖尊答欲令時會人重法故嘆人美法又執三乘教人謂説三乘教主是佛説一乘教主為魔三乘是正法一乘是邪教是故今嘆人美法斥斯執也又歎能乘之人所乘之人法即助佛稱嘆一乘也問曰此中何故敘佛無問自説耶答身子明法既深妙無人能問故佛自説作此意釋者即是重嘆佛權實因果也然此經大宗正明因辨果顯實開權自上已來佛及彌勒皆已嘆竟身子今復重嘆上是實人嘆今是權人嘆又上是良醫嘆今敘病人嘆又上是大乘人開權顯實明因辨果今小乘人開權明實明因辨果問方便品初五雙明義身子牒嘆為具已不答大宗乃嘆因果權實而亦具五雙慧日大聖尊久乃説是法謂人法一雙也道場所得法及我意難可測即權實一雙稱嘆所行道諸佛之所得因果一雙也力無畏三昧標章門為總下因果權實釋章門為別總別一雙也即此四雙為理自説之言名之為教謂理教一雙也故具足五雙也釋於諸聲聞衆佛説我第一自上嘆佛五雙是揚大方便令物欣大今是抑小方便令物悟小乘我為小中之宗尚不知其真偽餘小之劣豈可定保執耶我珠為勝尚為魚目汝珠既劣寧是夜光即以此言動衆人之執又前是大人嘆權不可知今是小人嘆權不可知又上是實人嘆權意趣難解今是權人嘆權意趣難解又前唱隨宜難解之言今出隨宜難解之證身子教中昔領隨宜尚稱不解餘之淺劣復何言哉問何故言自於耶答世人云自於者審今尚不知自況能知他又自於小尚不了況復知他大耶皆是身子抑挫小心令欣大道稱嘆方便顯在於斯也問曰何故云自於智不了耶答身子上揄揚大智今毀小智我第一智既非究竟餘人之智豈是極哉以智是大小乘宗故別抑揚問前何故云為是究竟法為是所行道答佛嘆大智為果今欲敘小智為因故因果義成權實事顯若望動執生疑者前寄言止言二方便是大人動小執今此一章明小人動小執大動小執以其非類取信猶難小動小執生信為易餘小人動小未足可從身子之動必當傾捶如將軍既降散夫自伏為是究竟法為是所行道可約兩義釋云一就昔理同教異以理既同則同成菩薩故是大因約三乘教異則成羅漢為究竟果二就今昔兩教自昔論之則是究竟之果今教辨之則是大乘之因後為正意釋願為如實説上是抑小今是揚大昔小既非實願如實願説今之大也欲聞具足道者亦是揚大今一既具足是滿字者則知昔教稱為半字釋止止不須説一止明理深故不可説令物欣大二止鈍根不堪聞使其捨小為止之益豈是空言又一止止天令天離著一止止人使人無依令人與天懷無所寄堪受重玄也釋身子重稱唯願一明大衆久捨有得之心故唯願説二早習無依之觀故唯願説又過去種善根故唯願説之現在能信敬唯願説之問佛何故止而身子稱敬信耶答佛欲令信是故止也以佛止言天人驚疑答以能敬能信故不驚不疑答佛止也又即以此言釋重稱唯願一不敢驚故唯願説之二不敢疑故唯願説之又能敬法唯願説之聞即信受故唯願説之釋佛復止非但有三善道驚疑亦有增上慢四衆執小拒大欲為汝説則三根善生五千長惡又斥三善道令人天捨有見止四衆令二乘息空心二見若除方堪受中道又斥三善令不著生死止四衆使不染涅槃二著若除則堪受一道問何故長行一止偈二止耶答長行正止增上慢人故唯明一止偈乃辨法深故一止人鈍根故一止故長行但為人偈具約人法釋為人意也問何故云聞必不敬信答五千之徒決定退席故稱必人天驚疑猶可改之不稱必也釋第三請無上兩足尊者三請凡舉三尊而嘆初作大聖尊嘆次法王嘆後兩足尊嘆前中一約法嘆初明三聖之尊後為六道之文所以約法嘆者既是法王必精於法説一説三皆有深致唯須頂受慎勿驚疑又如云此是醫王妙窮藥病但須服行不應疑慮作此嘆者即是勸信問三請三種嘆人亦有三種美法以不答初云久乃説是法謂希有嘆願説第一法即第一嘆中間法王含嘆於法體悟妙法故名法王亦是法王嘆也釋第三請中凡有五請一敵對請二少多請三引例請四淺深請五利益請歒對請者對上二人上二人不堪遂不説者今二人堪則應為説言二人者一是身子是故稱我所以稱我者我為標領既其頂受餘不逮者自然聞信百千萬億者第二少多請非器者止有五千故不説者堪聞者無笇故應為説世世者第三引例請世世尚受今何猶不信四淺深請者過去行淺尚受今生解深必當應信聞必敬信長夜安穩多所饒益者第五利益請如來若説非止有現在敬信之小利復有當來之大益長夜安穩出三界內外火宅也多所饒益者至於寶所也前即纍無不盡後德無不圓又佛上云天人驚疑身子答云聞必敬信不取驚疑佛上云增上慢之人必墮惡道今答云我等長夜安穩多所饒益偈中為長行五權未盡更明二義謂佛世世尚化今何容不説又前世善劣既化生善勝故應化也偈云則生大歡喜者敬信為因長夜安穩為果安穩辨纍盡饒益明德圓佛若説經因果俱成得離皆辨故大喜也爾時佛告下第十明顯鄣方便問何故明顯鄣方便耶答上師資請酬互諍師即再言座有惡人資重陳衆並清淨今遂受請而説則資言是實師語便虗今證師説不虗故明退席欲證資言是實故嘆於住衆問何故證佛語為實答師明座有惡人既其是實後説妙法斯即非虗問何故證資言是實答資明衆有善人遂果如所授前揚大抑小豈虗言哉又此中陳善惡者欲深誡二世勿封小乘勸兩時衆生宜明習大道又令未發小心者不發已發者怖畏改之故陳惡人又使未發大心者發已發者歡喜進行明淨衆也問何故臨説一乘五千退席答甘露將垂壞毒避席可傷之深又問曰何故嘆淨衆毀不淨衆答曰使住人欣夜光之將至傷彼去者握魚目而離群釋罪根深重直保執小乘乖一實之理故名罪執小生於謗大故名根久習執情為深十方佛不能拔為重釋正説中世云惜寸陰而遺尺璧貴一言而賤千金良以千金非寶一語可珍又云寧惠千金不惠一言良以一言難吐故也今借此説以喻斯經良以一道之言難吐遂今華嚴已後有四調柔正説之前興十方便方得吐一言也就正説中序其大宗同為顯一道但為教一人而有三周説者蓋是轉勢説法故三反言方而光宅之流常取前經為後本後周令同前則三説之文還同一説若爾聽前既惑聞後亦迷化上根有餘教中下不足問三周説何法耶答大宗明兩權一實識二權則捨小悟一實則入大又識二權則知因悟一實則識果又識二權則識用知一實則解體又大宗者昔住二實已捨有今悟兩權復捨空空有既除中道觀發以空有見除纍無不寂中道觀發德無不圓故是乘於大車直至道場也宜取此為正意則三周之説非直二乘改轍亦六道翻流菩薩進悟初正説次勸弘經此經云教菩薩法佛所護念初正為説謂令發菩提心勸弘經使修菩薩行後經云為令聲聞憶念本願所行道故説法華謂本願即菩提心所行道謂菩薩行也大章文句如舊疏中已説就長行內開為四門初明一乘真實門次辨三乘方便門第三得失門第四勸信門生起亦如舊疏餘未盡者今更述之題云妙法蓮華教菩薩法佛所護念三章經正明妙法華經教菩薩法佛所護念第四一門勸菩薩信受三章復為二意前之二門教菩薩識法第三一門教菩薩知人識法者謂識權實知人者示人得失也次此二訓即教菩薩義同又初之二門正辨教菩薩法後之一門釋佛所護念教菩薩法者教權教實令捨權悟實佛所護念者示人之失令其捨失名為佛護示人之得令人取得名為佛念護是遮惡之名念以生善為義令捨空有二見故名遮惡使發中道正觀名為生善初二門名教菩薩門初明一乘真實謂佛意門三世十方諸佛本意但為明一道唯為教一人故名諸佛意門第二三乘方便謂隨衆生意門佛意雖為顯一道教一人但隨衆生意説於多道教多人今令菩薩識此二意故名教菩薩法又初名隨自意語門今令菩薩識此二語名教菩薩法又初明淨土法門後辨穢土法門是故後明諸佛出於五濁惡世後既是穢則驗前為淨於淨土則説一於穢國則示三今令菩薩識淨穢二土教門故名教菩薩法又諸子有二一是直往菩薩二謂小乘為直往菩薩故説一乘真實為二乘人明三乘方便今令菩薩識教二子法故名教菩薩法又諸佛凡有二身應身之佛則説一乘真實化身之佛明三乘方便今令菩薩識應化二身所説之法故名教菩薩法又有二門一者會三歸一二者開一為三今令菩薩識佛開會故名教菩薩法就初一乘真實門復開為三初釋迦自開宗門二引證門三順同門釋迦當今教生宜自敞玄宗恐謂一佛化偏故引三世為證引證既顯從例而説故有第三順同門也初門復三一稱嘆門順生其解二不虗門逆杜其惑三顯教意門明衆生不解教意唯佛能解敘衆生不解教意令其識教明唯佛能解教意令其知理即昔五乘之説悉名為教一道清淨目之為理又衆生不解教意令物識權敘唯佛能解教意令物知實既識權實便具二慧入佛知見又衆生不識教意破五乘之執即是滅惑唯佛能識教意令其生解惑滅解生入佛知見又衆生不解教意令捨小唯佛能解便其入大又衆生不解教意令識生滅之失唯佛能解教意令悟無生滅得所以然者昔稟教之流皆言惑之可滅解之可生謂此生滅故名為失今明諸佛所解惑本不生今無所滅故辨無生滅以示其得問今文無有此説何所依據作是釋耶答後大衆領悟親有此意言故昔於捺國説五衆生滅今於鷲嶺説無生滅故經云諸法從本來常自寂滅相又上明四調柔十種方便為一言難吐者即是衆生不解教意門自昔已來四十餘載稟五乘教人並不解如來一句教意故五乘之人所行所説悉乖正道斯之一言翻於昔宗驚神逆耳是故難吐是以用四調柔起十方便方得吐此一言也釋開示悟入雖有四句分為二門初一句謂三世佛自德門後三句謂化他門自德化他包攝一切稱自德門者凡欲化他必須前明自德如欲賜車前明有車方可賜子言自德者即敘如來自有中道法身今明開者開如來自有中道法身也問經云開佛知見故出現於世乃是開他何名自開答須深照佛意於佛則不須自開今自開佛者為欲開衆生故也又法華論文意甚難見今釋其意方覺精能問何故云開佛知見使得清淨答開佛知見謂德無不圓使得清淨謂纍無不盡纍無不盡故不可為有德無不圓故不可為無即中道法身亦是藥草喻品中二種果義開佛知見即是究竟至於一切種智謂菩提果使得清淨即是究竟涅槃常寂滅相三世諸佛自開二果亦令衆生得此二果故名為大事因緣故出現於世示佛知見已下三句明化他者第一初句辨同義明九道不同法身不二肇公云天地與我同根萬物與我一體所以明同義者初句但敘佛有法身若不明衆生同有則衆生無由成佛是故第二次辨同義第三句悟佛知見者前既辨同有法身此明使物知同故稱為悟第四句言入者既其始知便有終入也今次以三雙攝此四句初一自德後三化他自他一雙後三之中初一辨同名為本有悟之與入謂始有也第二本始一雙後二之中初一為始知後一為終入謂始終一雙故此四句言約義周次釋諸佛知見佛知見即四智也壽量品明如來知見三界之相無有生死若退若出亦無在世及滅度者非實非虗非如非異此即就三界作之意令置於身上即令衆生入佛知見若就佛上作之於己身無益也六道是因緣生法因緣生法是即寂滅性所以然者六道若有自體不假因緣若從因緣則無自體無自體故寂滅寂滅即是究竟空也然若有六道之有方有六道空耳六道本來未曾是有今云何空耶若先有今無可言亦有亦無也本未曾有無何所論亦若是有是無可言非有非無竟未曾兩是今云何兩非故六道本不曾有本不曾無本不曾亦有亦無本未曾非有非無故四句絶四心斷四言滅故經云諸法寂滅相不可以言宣因緣六道雖本來四絶而六道宛然六道四絶即不壞假名而説實相雖復四絶六道宛然即不動等覺建立諸法不壞假名而説實相即如來智不動等覺建立諸法名為佛智任運現前名自然智不從師得即無師智此之四智是佛知見也問此四智是何身耶答即是法身一智有其四義更無四體也問何智起應化用耶答雖本來寂滅即六道宛然故不動而應十方現前即佛智用即就應中便具四智不動而應即佛智雖應不動謂如來智任運如此自然智問此是常智無常耶答作無常智者既是無常佛即無常智今明若是無常智者應與二乘同還是衆生不解教意耳何名唯佛能解今明四智未曾常無常但對二乘無常智讚美為常也問四智與五種佛性三波若何異答涅槃云十二因緣不生不滅是中道即境界佛性發不生滅觀即觀智佛性觀智明了即菩提性斷常斯寂即果果性十二未曾境智亦非智斷即是法不可示名為正性正性者即是佛性體也此但就不生不滅論五性五性但是如來智也既悟因緣宛然不生不滅具五性即知不性不滅宛然因緣亦是觀智及菩提果亦是果果性但不得是正佛性三種般若正明實相發生波若及説於文字並是如來智中開此三也佛智中亦具三謂境智及文字自然無師智更無別體通實貫前二也問四智云何是二諦中道答六道宛然本來寂滅即是世諦第一義生如來智雖本來寂滅六道宛然是第一義世諦生於佛智問何故云世諦第一義答世諦宛然而本來寂滅即是第一義故名世諦第一義所以立二諦者即是中道六道宛然本來寂滅豈可定有雖本寂滅六道宛然豈可定無即是二諦合成中道二諦既是中道如來智佛智二智合是正觀也釋但教菩薩所以但教菩薩者由失一道故成六道則根本是一道亦根本是一人今欲令六道歸一道六人歸一人是故但教菩薩若非一者不可令歸一故涅槃云失一味藥成六種味也釋但以一佛乘為衆生説法問但一佛乘是果乘因乘答經云一佛乘故知是果乘舊云是因乘失旨也問曰云何但一佛説法耶答經不言但説一佛乘直云但以一佛乘説法耳此明佛住一道清淨流出一切教門即是出生義無有餘乘若二若三者上明一道理唯有佛乘故從佛乘流出一切教今無有餘乘不從餘乘出一切教問曰此欲何所明耶答既辨從一生多故多還歸一無多可以出多亦無多可以歸多也一切十方佛亦爾者亦從一出多多歸於一無多可以生多故多不歸多也釋三世佛章一一佛中有二初明能化出生收入義次辨所化出生收入義能化中初明出生次辨收入出生中出生二事過去諸佛者明從一道出生過去十方佛即是出生義過去十方佛若應身若應身若化身皆從一道流出也以無量無數下明出生法義從一道流出一切法方便者一切巧説方便智用從一道流出也下偈云諸佛所得法無量方便力而為衆生説又方便者神通輪也下句明説法輪此二是衣裓機案化物之宗也是法皆為一佛乘故辨收入還收十方應化身同歸一道收一切神通説法亦歸一道所以從一多出者本為令多歸一耳是諸衆生從佛聞法第二明所化出生收入聞三乘五乘之教有五乘之人謂出生即從是五乘教出生五乘人也究竟下明收五乘人歸佛作也問總諸佛中何故但有示悟入無有開耶答開是自德下三化他今正明化他故略自也釋今我亦如是第三釋迦順同有二初明教理次判有無教理凡有三雙知機中有二初知欲二知性教中亦有二初説法二現通理中有二初總後別皆為得一佛乘謂總義也一切種智別明乘宗也釋尚無二乘何況有三此判理有無釋成上為得佛乘一切種智以道理唯一故説一切教皆為顯一道理無多故不顯於多然此一往斥奪之辭判此有無耳若還作有無決定解者不免二見下經云若有若無等中論云淺智見諸法若有若無相若能破二不著一如是五句歸不可示本有可示故有不可示竟無可示云何有不可示如此用心方識佛旨釋諸佛出五濁惡世前章有三義二義一義三義者初自説二引證三順同二義者總此三章唯有二義一者明有二者辨無明有者道理唯有佛乘故從一生多攝多歸一辨無者無有二乘故不從多生多攝多歸一義者雖明有無二義為成一義謂一道清淨故經云但明一道唯教一人今明昔方便亦為釋成上一道清淨若昔三乘遂實則上明一道不成以三是方便故一道始成五濁章為二初雙標次雙釋標者一標諸佛能出之人次釋所出五濁惡世也雙釋者從劫濁至成就諸善不根釋五濁章門從諸佛已下釋諸佛出生章門問何故凡夫有五濁得聞一乘答有四句一機鄣俱有二機障俱無三鄣有機無四機有鄣無機鄣無機鄣俱有者穢土中凡夫聞一乘者是也有五濁故名有鄣有大機故得聞一乘機鄣俱無者淨土中二乘人未聞一乘是也既是土故無五濁障大機未熟故未聞一乘又穢土中亦有其人即佛滅後羅漢不聞一乘者是也五濁已傾故言無鄣不聞一乘稱曰無機機有鄣無者淨土中菩薩是也既是淨土故無五濁鄣得聞一乘稱為有機又是穢土中羅漢得聞一乘是也既是羅漢故無五濁鄣得聞一乘名為有機鄣有機無者五濁凡夫不聞一乘者是也大乘既有四句小乘亦然一機鄣俱有謂有五濁鄣得聞小乘也二機鄣俱無者謂淨土菩薩不聞小乘者是也如香積為淨土是故無障不聞小乘之名故無小機三機有鄣無如淨土中聞小乘者是也四鄣有機無穢土中不聞小乘者是也問既有五濁鄣云何復聞一乘答鄣弱機強謂穢土之緣得聞一乘但此義多途自有鄣強機弱如穢土凡夫雖有一乘機未發故不聞一乘如地有種緣未合故未生牙二者鄣強機強謂穢土之人聞一乘悟解者是三機鄣俱弱亦如穢土明善之人得聞一乘而不悟解四機鄣俱強如穢土大邪見惡人忽聞一乘即便悟解一乘既有四句小乘亦然一鄣弱機強聞小悟小二鄣強機弱未聞小也三俱強大邪見人聞小即悟小也問文中何故前明煩惱濁後辨見濁雖有五合唯成二一在家起愛即是毒蟲二出家起見所謂惡見下偈中亦作此次第而列問定以何物為衆生濁體答舊云假名衆生是衆生濁體今謂不爾假名衆生不當善惡不名為濁衆生濁者即惡人也以起愛業衆生名衆生濁問見濁應次煩惱濁者何故隔以衆生濁答前明煩惱濁從煩惱次起於業故明衆生濁敘在家衆生煩惱業竟然後始得辨出家起見外道故次明見濁問命是報云何名濁答取短命妨修道為濁不直取命猶如不直取衆生正取惡衆生也五濁具三道煩惱見煩惱道衆生業道命苦道時通三也釋得失章問何故明得失答前彌勒偈云種種因緣以無量喻照明佛法開悟衆生前示法權實謂上弘大道今明得失下益衆生又上明唯顯一理今明唯教一人故辨得失又大品云不示魔事魔罪名惡知識今佛是三世衆生大善知識令覺知魔事故示得失也又自上已來敘能被之教有實有權今明稟教之人有失有得問此是學何等教人答取文正意謂學昔權教人有得失也所以明學權教人得失者前既明三乘是權恐執因不移故次明得失令捨失從得又菩薩依大教學則稱教故無失二乘依小教不稱教故須明得失又欲示二世求道憑師之人須精鑒師之得失不可便信亦令師識知弟子真偽而曉示之此中明失中有二人一凡二聖得中二人一佛在世羅漢二滅後羅漢而光宅云後人還是前人前明非佛弟子後明是增上慢此釋有三失一將聖同凡有破聖失二明過重輕有顛倒之失前明非佛弟子其過則重後云是增上慢辨過者輕三者文煩之過前已明非佛弟子鄣失有餘何煩更辨是增上慢又都不觀文後乃言當知此輩輩是不一之名云何由是一人問上具明唯有一理唯教一人今何故但云不聞不知但教菩薩答上雖有一人法二義但人義為切正主己身故偏云不知唯教一人問何故云不聞不知答五千退席都不聞教亦不知理也非佛弟子者未得小乘道果謂得道果故小乘弟子不攝不聞不知但教菩薩大乘弟子不攝以大小不攝故為過則深此欲顯封執小乘大小不攝使其改迷從悟故有此示失釋第二聖人失問初人亦言自謂後人亦稱自謂有何異耶答初人有二自謂未得小得小二小未究竟自謂究竟第二人但有後謂異前也問前是五千後何人耶答即三根聲聞是也所以然者三根聲聞並有自謂之言上根人云爾時心自謂得至於滅度中下亦爾問佛判前人云非佛弟子後人何故不然答是凡夫大小不攝非佛弟子後人既得羅漢乃非大乘所收小乘弟子所攝是故不得云非佛弟子但望大乘未得究竟自謂究竟名增上慢耳問何故云實羅漢必信此經答此舉得釋失是羅漢聞必生信驗五千不信非羅漢也所以知五千不信者其人若信佛不遣之非但不信聞乃生謗故遣令退席問佛滅度後羅漢凡有幾人答有二種羅漢一有大機而未熟故不值佛聞法二無大機故不值人聞法故法華論有二種聲聞有大機者謂退大取小人無大機者是決定聲聞問此二人同生淨土有何異耶答悟有早晚根有鈍利問住羅漢幾時而悟答楞伽云至無量億劫耽小乘空三昧樂猶如醉人久久方醒問五千亦不聞不知與此人何異答五千聞而不信今明但不聞故不信若聞即信故與前異問生淨土中有大乘機可聞説法華本乘聲聞生於淨土無大乘機云何得聞一乘耶一切無機聞教悉作此問答有二因緣一者佛性即是一乘既本有佛性即本有一乘佛性力故還生善根而是一乘種子還生一乘善根二者如涅槃云信心因聽法聽法因信心問此中四人約機鄣有無云何判耶答凡夫是有鄣無大機人聖人若聞一乘即是無鄣有機人若不聞是無鄣無機人凡夫若聞一乘有障有機人得中二人佛在世羅漢是無障有機人佛滅度後羅漢是無鄣無機人又是無鄣有機但機未熟故不聞生淨土就方聞也問上明法權實辨人真偽今何故但勸信一乘真實答意在一也釋偈文頌上顯鄣方便者以障道事深故上但略説今廣明之即用誡勸二世衆生又上雖明退席未廣釋起去所由容謂佛無慈猶隔五千慈不能普故委曲釋之前廣釋不淨衆以誡二世衆生令其捨小次明淨衆勸二世衆生使其求大又執小不移現在障不聞一乘則無極樂因未朱不成佛失極樂果現在謗大種極苦因未來墮無間受極苦果此過為大故誡二世也嘆淨衆令習大捨小故永斷極苦因果習大故得極樂因果斯事不輕故勸二世衆生令求大又即釋教菩薩法有二種一示人得失即此章也頌正説已去示法權實也又示人得失是釋佛護念示失令捨為護示得令取為念頌正説即釋教菩薩權實二慧令入佛知見也初誡中佛廣釋之凡有十過初無正解三過次無正行三過小智為第七糟粳為八九鮮福為第十執小拒大有十種之罪宜應捨之初無大小乘解有三種過如文所列他壞正觀其人懷增上之毒故障大乘又他於增上法中懷增上之解今於增上法中懷憍慢之惑所以偏舉慢者以懷慢自恃必不重道尊人故不可化於戒有缺漏者此明無大乘行也破戒為缺而失定水為漏前明無解故無慧命無戒定是故無行五千之徒具無三學又戒如天德瓶瓶破又漏則無復戒也護惜者既無行解不喜他道為護自不除過為惜衆中糟粳者上明有不堪用今辨無有堪用如酒米堪用糟粳不堪用問何故云衆中之糟粳答衆中之不堪用猶如糟粳故揭糟於糟而棄於糟如佛威德故令去酒米堪用喻住衆也酒即堪飲如住衆現在即行因米轉方成食喻住衆未來得果糟不堪食喻去衆現在不堪行因粳不堪轉成食喻去衆未朱不得果又酒是果米為因去衆未未不得佛果現在無有佛因住衆具此二也又糟喻於教米譬於理直往及回小之人因三乘之教得一乘理如因粳得米五千之徒守三乘之言如得粳失一乘之理如不得米二人得中道真味養性陶神如得酒五千之徒封執斷常喻如得糟問歎淨衆有幾德答前不淨衆無有堪用有不堪用淨衆亦然無有枝葉無堪用唯有真實唯有堪用也釋頌正説長行四門頌亦有四初頌一乘真實門二頌三乘方便門三頌稱嘆門四頌勸信門初兩門與長行別者長行前明一乘真實後明三乘方便偈頌大意是同而復有異義頌一乘真實通明諸佛出世説教意後頌三乘方便別敘釋迦出五濁世一期始終教門是故異也又初門通敘諸佛説教意後門明諸佛説次第初門頌上三門即三初頌自開次頌引證三頌順同頌自開三門一頌諸佛説教意門二頌教次第門三勸信門説教意中又二門初頌昔教意次頌今教意昔教意有二初頌昔説四乘教意次頌昔説大乘教意頌四乘教意為二初頌四教次頌説四教意初頌四教為二前頌人天教次頌二乘教頌人天教為三初歎佛有説教之智即知藥次明佛知機謂識病三設教謂應病授業此文句為定故更疏之問説九部法何故命初稱或答有二義一者望昔適緣不定或作長行而説或作偈頌或説自身或説他身以或字貫九也十住婆沙云或有樂長行或有樂偈頌或有樂雜説莊嚴章句者所樂各不同我隨而不捨二者望今九不定九説九為令悟不九故下經云入大乘為本以故説是經也頌二乘教又有二初知機為是説涅槃明説教我設是方便下第二明説四乘教意即是顯衆生不解明佛解四乘教意前明二乘教意次頌人天教意問何故云決定説大乘答道理無小道理有大佛依理而判故有決定之言又初起小機故説小小必歸大決定須説大以無小乘永住小故是以前云世尊法久後要當説真實問何故頌昔説四乘意及昔説大乘教意答一欲顯昔四乘是方便昔大乘是真實即是開方便門示真實相二欲明昔四乘是密教昔大乘是顯教昔説四為開一故名密昔正明大乘是佛乘故是顯教也三約人論者為鈍根人説四乘昔為利根人説大乘即抑小揚大也四釋長行者頌昔四乘教釋上長行衆生不解教不解教意者不知無四説四説四為顯無四不知無四説四不識權也不解説四為顯無四不知實也昔説大乘明菩薩解教意佛説大因大果令修因起果菩薩如教而行故解教意五者都為成此理教也亦曰為成解故也昔若四乘大乘密顯之法為明佛乘當知一切教皆是法華此經已外無復餘教也問有幾種大乘答有二種一獨菩薩聞二乘不聞此中説佛乘是真實三乘是方便菩薩權實兩教有權實二解故入佛知見二者有三乘共聞大乘但得佛乘究竟未得顯有一無三但菩薩利根既聞佛乘究竟即知二乘非究竟亦具二智問菩薩云何聞大乘即解大小權實答如説二無生以人無生故無三乘六道人即是明唯有一菩薩人也法無生故即明無三乘六道法即是明唯有一法又説一切法皆是一如如即一乘如外更無有法即一乘外更無三乘故菩薩聞昔大乘即解權實二乘鈍根雖聞此密言猶未得悟待法華顯説方始得解問若菩薩於法華之前已悟者何故此經云疑網皆已除答利根者已悟始行之流不解密語故保執三乘聞初略説是故生疑具足廣明方乃得解有佛子心淨者即淨前人天及二乘心也若有凡夫樂生死二乘著涅槃心則聞昔四乘密教不聞昔顯教也釋以深心念佛前須識佛後方解念人語難依論言可信中論云如來在世時不言有與無亦有及亦無非有及非無故知佛絶四句也今還作絶四句而念解與佛應故得佛記既於佛不起四句心悟己身亦爾故論云如來所有性即是世間性如此則內外並緣觀俱寂名深念佛在念既爾禮佛歸依及稱佛名皆須深心也修持佛戒者前深心念佛謂具佛解今深心持戒即是佛行行解更無二體即一正觀名為正解遮凡夫二乘生心動念故名佛戒具佛行解故得佛記又此言為釋下句以深心念佛及持佛淨戒故得佛記大喜遍身釋聲聞若菩薩此頌上今日教意此章有三初明唯教一人次辨唯有一理三明唯為一意此三即釋成昔教昔若顯若密皆為明佛乘者以諸佛唯為教一人顯一理有一意故也初頌上唯教一人者釋迦一化及三世佛有二種教一者法華之前機異教異既有五機便有五教若作大小二機便有二藏從法華已去機同教同無復五機唯有一機無復五教唯有一教大小亦爾是故今明菩薩聲聞同一機發皆成佛也釋自證無上道大乘平等法肇公云天地與我同根萬物與我一體淨名云凡聖皆一如也若佛自住大以小授他豈非乖父子一體違凡聖皆一如釋若人信歸佛此引知師之資以證師也無有自握夜光以魚目授子名不欺誑也斷諸法中惡者一切法中惡皆斷則知大小乘法中惡亦斷故不自住大與子小也釋我以相嚴身引佛身業證佛心也無量衆所尊外為物尊必內有威德內有威德則心無欺誑引意業證佛心也下引口業證佛心若我遇衆生上論教意竟今敘教次第衆有伏疑云若昔若今若顯若密皆為顯一理者佛初出世何故不即説一耶是故今明教之次第上辨今昔顯密皆為顯一此就佛意門今明教次第就衆生意門上是隨自意語門今隨他意語門此中即明三輪之義初辨不得説根本法輪我設是方便下明説支末之教是亦非真滅下謂後説攝末歸本初中有二意前明不得初出世時為一切人説於一乘從我知此衆生已下釋不得説所以略有二義一明無大乘之善堅著於五欲下謂有障大之惡即愛見因果是也釋我慢自矜高此敘佛初出世九十六種恃此邪道不受佛大乘正道也若有無等者有無具二失一障中道二是見根有此二失故佛不得説大乘中道法也釋諸法從本來常自寂滅相略明八不義十方三世佛一切教門皆為顯一道清淨一道清淨即諸法從本來常自寂滅相宜留意此門也八不者不生亦不滅不滅亦不轉不內亦不外不本亦不始能説是因緣善滅諸戲論我稽首禮佛諸説中第一不生亦不滅者開大小二觀小乘之人是生滅觀謂有愛見煩惱從惑生業因業生苦果即是生義修治道滅愛見愛見滅故業苦便滅故得涅槃名為滅觀有所得大乘學猶是小乘亦言有五住煩惱及二生死名為生義斷五住滅二死得二涅槃名為滅義故有所得大小乘人皆是生滅觀也今對生滅故明不生滅了愛見本自不生誰能生業苦若有於生可得有滅既本無生何由有滅即是菩薩無生滅觀故中論云諸業本不生以無定性故諸業亦不滅以其不生故故淨名云本自不生今則無滅並其證也次不滅亦不轉者江南諸師謂金剛心有假實二義實法則金剛心滅前佛果起後假名相續則轉金剛心成佛果北土弘攝論者凡有二師一云聞薰習滅而佛果生次云轉聞薰習以成報佛二互相指斥斥其滅者明是斷見斥不滅者謂是常見中論破因果品明若至若失義皆不成至謂因至於果滅則因滅果生俱是斷常非相生義今用此經總問二計經云諸法本不生何所滅移若本不生而言滅者豈非無生而計有滅名為顛倒又翻不及小乘小乘之人計有生故滅命經云本不生而言有滅豈非兩重顛倒轉義亦作此責之既本不生何所轉移如凡本不生云何轉凡成聖次總問兩家為習本無生觀成佛為習生觀成佛若習本無生觀成佛者即聞薰習本不生何所滅移耶轉義亦作斯責今總對責三家明菩薩從初發心習本無生觀故無所滅亦無所轉也次不內亦不外者北土二家一云本有真如體未有其用從真如內生一切功德智慧之用如本有金朴從人功爐治生金上調柔明淨之用故是內出義次師云非從真內生諸功德但轉無始來一切功德作於報佛依真如法身爾問真如本有諸功德是始生已不答是始生問既是始生云何常耶答真如常故功德亦常問無常與常合從常而是常常與無常合從無常應是無常又無常之法若轉而成常亦應常住之法轉成無常則不可合如其不異則無所論合此總問二家也次問金真非金為是妄為是真耶答云是妄問論云虗誑妄取者是中何所取即言是妄則無一豪法若有一豪不名為妄妄既本不生云何從妄內出真本無金朴金從何生若言朴自是妄金自是真還如向問妄本不有金剛本有非始生也若言金非是真但有金體未有金用則用是本無今有若本無今有則已有還無亦同前難今對此義明諸法本不生即是般若生非波若從妄內出亦非轉妄而作波若衆生本不生即是佛生非佛從衆生內出亦非衆生外來故中論云如來所有性即是世間性故云不內亦不外也不本亦不始者南北皆云涅槃真如名為本有報佛等義此是始有今明若本有定本有本有不可始始有定始有始有不可本名為有見亦是本見始見今為對此明不本亦不始非有亦非無對無常始有故言本有耳諸法何曾本有耶亦約緣始悟故言始也亦未曾始有也至此已來明一重意也若隨教約緣具有八義謂無生滅生滅乃至無本始本始無生滅生滅者於顛倒橫謂故有五住二死之生約緣了悟亦得假名稱滅故中論顛倒品一切受求煩惱顛倒無從來即結云如是顛倒滅須深取此意次無滅轉滅者約橫謂言有生就了悟則知聞薰習本不生即此名不生強稱為滅從來未得本不生悟今始得本不生悟於緣得轉悟名之為轉故經云轉凡成聖意在於此也不內外內外者本未見不生故無功德見本無生故有一切功德豈非內出約緣悟不生故有功德豈非外來本始例同此釋次第三重意者初明無生滅次辨生滅此是無生滅生滅生滅無生滅無生滅生滅豈是生滅生滅無生滅豈是無生滅故非生滅亦非無生滅言忘慮絶即是法不可示也生無生既爾轉滅等六事例然次別破江南二師釋此文光宅云一乘之因無復三乘故言常寂其人所以作此釋者謂初分經正明於因未辨果故也今明雖是一句之經實為大事所以然者因果斯經大宗又為衆義根本宜審詳定今所以者正是二果相對明昔小果滅非真滅今大果滅是真滅即昔小涅槃非真涅槃今大涅槃是真涅槃昔小涅槃非真涅槃謂開方便門今大涅槃是真涅槃謂顯真實義所以就果論權實者以此經正用果為宗又法華教起正判三果權實故也莊嚴云此文明涅槃果但未得寶所俗外涅槃且將大品實相涅槃以對昔日小乘孤斷之滅彼所以作此釋者亦云初分經未辨於果今謂初分經未辨於果過同光宅而言大品涅槃劣謗波若也又言此涅槃劣大涅槃毀法華也又今正説法華而將大品之果此則法華因乘勝大品法華果乘同大品即因勝果劣義成顛倒今所明者此文正明大小優劣以小乘涅槃既劣則法華大乘涅槃為勝乃正是法華涅槃不應言非又諸方等經同明涅槃理更無異不應有所抑揚問既言本來寂滅即本來是佛云何言佛子行道已來世得作佛答雖本來是佛於緣是而恆非今欲令悟非而恆是故現習寂滅之觀故未來得佛問云何習耶答肇公云道遠哉觸事而真莊周既有指馬之況今寄一指萬義類之如會指成捲即緣觀寂捲有自體不假指成既由指而成即無自體有自體故捲有無自體故捲無若有捲有可有捲無捲竟非有何所論無若有有無可論其亦竟無有無有無何所亦哉若有二是可有雙非竟無二是何有雙非若有有無四境可起有無四心竟無有無四境何有有無四心無有有無四境故無心於外無有四心無心於內於外無數於內無心彼已寂滅浩然大均即是涅槃如斯而悟故得成佛釋頌引三世佛證門前長行略故前別明三世次總明三世偈文既廣但頌別不頌總也此是長行廣而偈略長行三世佛門極略今偈即廣之皆互現也長行一一佛門皆三謂化主教門及以徒衆今略頌也長行三章皆略今三皆廣前略後廣為解義故三廣各二化主中二一時長二佛廣教門中二一説法二神通徒衆中二一別二別總初引時長佛廣引證本為成信若引一時一佛不免化偏故辨極長之時極多之佛也長行教門有二初明無數方便即是神通二譬喻言辭此明説法今頌具之但長行前明現通後辨説法此是敘正次第今前明説法後頌現神通謂顯理次第顯理正是教門神通乃為傍助故下經云我以異方便助顯第一義又諸大聖下頌神通也論二經同異舊云大品經明無得六度能動能出故成佛有得六度不動不出不得成佛故大品明乘義狹斯經善無大小並至菩提則一乘義廣今前難之若法華云一豪之善皆成佛者則一豪之善皆應動出而大小乘明一切取相有所得善皆不動出則知大品是實説也而法華據其遠緣甚遠經故一切善並至菩提所以然者佛見衆生起一豪善終因此善遂致成佛故遠近通説大品云無得善成佛此是説近不説遠若遠近通説者一切善並皆成佛智度論云有得是無得初門即其事故二經俱實問若爾法華大品有何異耶答若以近遠論之兩經無異非但二經佛法大意悉如此也但大品菩薩根熟明菩薩近遠之善悉皆成佛四乘根性未熟故未辨成佛至於法華五乘之緣並熟故皆成佛以此為異耳釋若有衆生類值諸過去佛上來明若現通説法皆為顯於一理此下辨一豪之善並皆成佛即是唯教一人問上釋迦自開宗亦作此判與今何異答上是真説顯一理教一人此章則引古證今我見古佛説一切事皆以顯一古人一豪善皆已成佛故我今明顯一理唯教一人斯言可信此中二章初別明二世衆生修行成佛次從若有聞是法合明二世衆生成佛初別相明二世即二佛滅度後中有五人初是信心人信心者直信有三寶如此之人亦得成佛餘如舊説釋未來佛章就文中有二初明説一乘次明説一乘意就初又二前總明顯一理教一人初文即是顯一理若有聞法者明唯教一人次別明顯一理教一人亦二初辨願門次舉行門文處易知諸佛兩足尊下第二明説一乘意亦有二意初明緣因佛性從緣而起故須説一乘教二者本有佛性則本有一乘故須説一佛乘問曰何故云知法常無性答釋説一乘意若菩提心有自性則本來已有不藉於緣不須説一乘以菩提心無自性假緣而發故須説一乘也佛種者菩提心為佛種子故華嚴彌勒百句歎菩提心命初即云菩提是佛種子三世諸佛由菩提心成正覺故但菩提心要藉緣而發即一乘之教以道理唯有佛乘無有餘乘衆生既聞此言則不發餘心但發佛心也是法住法位下第二明正因佛性雖發佛心若本無有佛性終不成佛故説正因佛性見此佛性方成佛也問此文乃明世間常住何以知是佛性答勝鬘明一乘亦云一切法常住是故禮法王彼既佛性今亦然也又壽量品云三界無有生死乃至非如非異天親云明常住佛性則知今亦然矣問何故約未來佛章明此二性答未來是三世中間可以貫前通後故也又上雖明一豪之善並皆成佛今欲釋之要須發菩提心乃本有佛性方得成佛若無二佛性雖復修善不得成佛故有此文來也舊法華師不明此經有二佛性則終不得佛破三世佛意可傷之甚也問此章明佛性何故云諸佛兩足尊答諸佛之言該羅一切今明佛性恐一佛偏化故云諸佛也釋現在佛門為二初總後別總意者同未來佛明説一乘意謂衆生有緣正二因故須説一故接前文云亦説如是法次別明同上二世佛顯實開權問前二世佛皆初開權後顯實現在佛門何故前顯實後開權答接未來佛章明二種佛性故即明顯實是前云於道場知已今亦云知第一寂滅問何故上云是法住法位今云寂滅答示佛性種種名字也次開權者上顯實是佛意門今隨衆生意門文意雖爾子意不然故説種種性種種乘也釋迦順同門云我今亦如是者同明二種佛性也次同現在佛顯實開權也釋我以佛眼觀頌第二三乘方便門問上已頌五濁與今何異答上略説今廣説又上為釋教次第故來今通敘十方三世能化所化事故來此中四章初明居法身地見五濁衆生有苦無樂起大悲心前須詳定法身然後始得菩薩見六道也依江南法華師不得云居法身地見以法華經未辨常住法身故也依關東智度論師亦不得云居法身地見彼以實相為法身實相體非覺故法身體非見但能生於覺故名覺能生於見故名見攝論師云法身是真如亦非見義應身乃是見耳今用金光明三身品以釋此文彼云法身者謂如如境及如如智如如智即利益衆生名為佛眼是覺他義如如境是自利即如如智所照之境智照此境謂自照義故法身佛得有自覺覺他兩義故名法身佛佛者覺也豈有是法身佛而非覺哉問如如智可是法身佛以智是覺照之名如如境非覺照之名云何名佛答須深照此意蓋是一體義分即智不變異名如即如覺照稱智更無二體故並是佛也問攝論云照用皆是應身與金光明經相違云何會釋答經論意亦無二但開合不同經則合本開迹論則開本合迹經合本開迹者如如智即應身如如境即法身合此二種皆名法身故言合本而有應化兩用應身化菩薩化身化二乘故是開迹論開本合迹者以如如境為法身如如智為應身故開本也合迹者應身已外皆名化身至壽量品中當廣釋之論五眼五眼有二門一因果相對因人具四眼佛名佛眼此即總別相對因人四眼別知四境佛具五眼總知一切如經云佛眼無所不知而無所知無所不知謂佛智而無所知謂如來智二約佛自有本迹二身若論五眼但説迹身説法身不得有五眼名以迹身有宍有天等有五名耳法身無此事故無五眼名若舉境取智照障內為宍亦義得説有五也今經云佛見六道者正就法身論之也總別眼者正總辨也問見六道是四智何智答四智中是佛智用名為佛眼也問貧無福慧眼見何事答初明無樂因樂果入生死下明有苦果苦因即二無二有也就苦果苦因各二苦果二者謂一世苦及相續苦苦因二者即愛見也貪著五欲正生愛也如貓牛下由癡故起謂愛因也即淨名云從癡有愛如涅槃云狂故生貪無所見者謂愛用也一不見愛是苦因能感苦果又不見實相發生觀智斷苦因滅苦果故一愛䨱心不見四諦也不求大勢佛者前明以愛䨱心不能自治今明以愛䨱心不知求他治也深入諸邪見者上明以䨱心故不知求正今明以䨱心故錯求於邪以苦欲捨苦者深入諸邪見是大苦因欲以捨苦果也亦應類之愛是苦因而衆生起愛求樂欲捨苦是故下云諸苦所因貪欲為本問外道將何邪見以捨苦耶答以有無二見名之為邪鄣中道本衆見之根用此二見欲捨苦果外道起有無見欲捨於苦名以苦捨苦末世入佛法中起有無見欲求道者義亦類然問上已明愛見與今何異答前章明佛初出世為有愛見衆生不得説大而説於小此就迹身今明居法身地見有苦無樂起大悲心是故為異釋我始坐道場華嚴會化主教門徒衆蓮華穢土諸相美事也觀樹經行者爾時雖化菩薩不欲捨二乘即欲以化大人之法授小乘也衆生諸根鈍者不習無所得正觀慧眼也著樂癡所盲者上明無解今敘有惑任置鈍根以不可化況於癡中更復著樂耶不受梵王請者即梵王等是鈍根著樂之人如重病子請文良醫求服大藥父若授之進無差病之功退有傷命之理問何故十方佛慰喻釋迦答曰釋迦隱二實德以貧所樂二法度脫於人此為難事故須安慰也隱二實德者謂真實身及真實教也貧所樂二法者一眇目二人二垢衣長者又隱四實以貧所樂四權度人問云何名貧所樂答二乘之人貧無大乘福慧但樂小法名貧所樂也釋即趣波羅捺初成道時二思惟不得説一二思應得説三故往波羅捺説三教又二義不得説一一不可以大授小二強授即有損無益有四義故應得説三一同古佛二受今佛勸三梵王所請四濁世有三乘機也問何故往波羅捺菀答一同古佛之處二順今人之機即五人是也問佛著何衣將誰共去答依小乘著衣袈裟獨趣捺菀觀五人也不可以言宣者尚不可説是一豈可言是三今欲為倒中之倒故示權中之權故説為三也問從久遠來欲明何義答為欲釋疑初成道時三七日思惟不説大法以四因緣方説小乘若爾三阿僧祇劫都未曾説大亦未曾説小何名菩薩是故釋云從久遠來早已説已不乖菩薩之道則因果二時俱利物也又釋疑故來云何五人一聞四諦便得道果是故久來已説今方悟耳又上已略開乘權乘實今欲開久已成佛故有此文問何故須開久已成佛答欲釋前解後釋前者時衆疑疑云昔未曾轉法輪則五人等未種善根云何始聞便得悟道故釋云早已成佛久轉法輪則早種善今聞方悟二釋後者後聞説一乘直往疑除羅漢成佛者良由久已成佛早説一乘久種一乘善根故聞得悟解曾從諸佛聞者上明從久遠來略開能化成佛久此略開所化修行久以能化成佛久故早化此等衆生令種善根釋鈍根小智人即是五千之徒今更以四義呵之斥餘保教未悟之衆令改執也問何以知是五千耶答前實得羅漢必信今云聞而不信故知是也又傷五千退席故悲見三根堪聞故喜將説一乘而悲喜兩集故敘無機謂大悲門述歡喜大慈門又喜無畏五千既去不復憂之不受畏之起謗也又今昔相對昔憂三根不受畏之起謗今無此慮故喜無畏又説盡理之法暢衆聖之心是故喜也不畏謗一亦不畏執三故無畏也問何故作六種嘆耶答為欲勸信諸佛難值已值法華難説已説難聽已聽難聞已聞宜應歡喜頂受問何故云如諸佛儀式答諸佛初則不定後則必定説無分別也問聞與聽何異答若聽在聞後謂循循而聞聽住神側耳而聽也若聽前聞後非但聞法為難舉步未聽此亦難也釋汝等勿有疑問上稱歎已是勸信今何故復有此章答前勸信今遮謗也又前稱嘆為成勸信今正勸信也汝等勿疑遮謗也下明慚愧者改上愛見之過清淨者本無過人也又回小為慚愧直往為清淨下明學法華得失為勸信故來也
